<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ricette Salutari — Classe 5IA</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
/* ─── TOKENS ──────────────────────────────────────── */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --cream:#f5f0e8;--sand:#e8dcc8;--terracotta:#c4673a;--olive:#6b7c4a;
  --deep:#2a1f14;--gold:#c9a84c;--sea:#3a6b7c;--navy:#1B4F72;
  --mint:#EAFAF1;--peach:#FDEBD0;--sky:#EBF5FB;--sky2:#D6EAF8;
  --motiv:#1D6A39;--aller:#784212;--purple:#6C3483;--purple-bg:#F5EEF8;
  --appro:#7a5c10;--appro-bg:#fdf6e3;
}
html{scroll-behavior:smooth}
body{background:var(--cream);font-family:'Crimson Pro',serif;color:var(--deep);min-height:100vh;
  background-image:radial-gradient(ellipse at 10% 20%,rgba(196,103,58,.07) 0%,transparent 50%),
                   radial-gradient(ellipse at 90% 80%,rgba(58,107,124,.07) 0%,transparent 50%)}

/* ─── EDITOR SIDEBAR ──────────────────────────────── */
#editor-sidebar{
  position:fixed;top:0;right:0;width:480px;height:100vh;
  background:#1a1a2e;color:#e8e8f0;z-index:2000;
  display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);
  box-shadow:-8px 0 40px rgba(0,0,0,.4);
}
#editor-sidebar.open{transform:translateX(0)}
.editor-top{background:#16213e;padding:1rem 1.2rem;display:flex;align-items:center;gap:.8rem;border-bottom:1px solid #2d2d50;flex-shrink:0}
.editor-top h2{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:400;flex:1;color:#c9b9e8}
.editor-close{background:none;border:none;color:#999;font-size:1.4rem;cursor:pointer;line-height:1;padding:.2rem}
.editor-close:hover{color:#fff}
.editor-recipe-select{padding:.5rem .8rem .5rem 1.2rem;background:#16213e;border-bottom:1px solid #2d2d50;flex-shrink:0}
.editor-recipe-select select{width:100%;background:#0f3460;color:#e8e8f0;border:1px solid #2d5f8f;border-radius:3px;padding:.5rem .8rem;font-family:'Crimson Pro',serif;font-size:.95rem;cursor:pointer}
.editor-body{flex:1;overflow-y:auto;padding:1.2rem}
.editor-body::-webkit-scrollbar{width:5px}
.editor-body::-webkit-scrollbar-track{background:#16213e}
.editor-body::-webkit-scrollbar-thumb{background:#2d5f8f;border-radius:3px}
.field-group{margin-bottom:1.1rem}
.field-group label{display:block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:#8899cc;margin-bottom:.35rem}
.field-group input,.field-group textarea,.field-group select{width:100%;background:#0d1b2a;color:#e8e8f0;border:1px solid #2d3a5a;border-radius:3px;padding:.55rem .75rem;font-family:'Crimson Pro',serif;font-size:.92rem;line-height:1.5;resize:vertical;transition:border-color .2s}
.field-group input:focus,.field-group textarea:focus,.field-group select:focus{outline:none;border-color:#5b8ee6;background:#0f2340}
.field-group textarea{min-height:80px}
.field-group textarea.tall{min-height:120px}
.field-sep{height:1px;background:#2d2d50;margin:1.2rem 0}
.field-section-title{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:#6c9fff;margin-bottom:.8rem;padding:.3rem 0;border-bottom:1px solid #1f2f50}
.macro-row{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}
.editor-footer{padding:1rem 1.2rem;background:#16213e;border-top:1px solid #2d2d50;display:flex;gap:.6rem;flex-shrink:0}
.btn-apply{flex:1;padding:.65rem;background:#1D6A39;color:#fff;border:none;border-radius:3px;font-family:'Crimson Pro',serif;font-size:.88rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:background .2s}
.btn-apply:hover{background:#27a34f}
.btn-download{flex:1;padding:.65rem;background:#c4673a;color:#fff;border:none;border-radius:3px;font-family:'Crimson Pro',serif;font-size:.88rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:background .2s}
.btn-download:hover{background:#d4834a}
.btn-new{padding:.65rem 1rem;background:#1B4F72;color:#fff;border:none;border-radius:3px;font-family:'Crimson Pro',serif;font-size:.88rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:background .2s}
.btn-new:hover{background:#2471a3}

/* ─── EDIT TOGGLE BUTTON ──────────────────────────── */
#edit-fab{position:fixed;bottom:1.8rem;right:1.8rem;z-index:1500;width:54px;height:54px;border-radius:50%;background:var(--navy);color:#fff;border:none;font-size:1.4rem;cursor:pointer;box-shadow:0 4px 20px rgba(27,79,114,.45);transition:all .22s;display:flex;align-items:center;justify-content:center}
#edit-fab:hover{background:var(--terracotta);transform:scale(1.07)}
#edit-fab.active{background:var(--terracotta)}

/* ─── TOAST ───────────────────────────────────────── */
#toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(60px);background:#1D6A39;color:#fff;padding:.6rem 1.4rem;border-radius:3px;font-size:.85rem;letter-spacing:.06em;z-index:3000;transition:transform .3s ease,opacity .3s ease;opacity:0;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* ─── HEADER ──────────────────────────────────────── */
.site-header{text-align:center;padding:3.5rem 2rem 1.5rem}
.header-line{width:120px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:0 auto 1.4rem}
.site-header h1{font-family:'Playfair Display',serif;font-size:clamp(2rem,5vw,3.4rem);font-weight:400;letter-spacing:.05em;line-height:1.1}
.site-header h1 em{font-style:italic;color:var(--terracotta)}
.site-header p{margin-top:.7rem;font-size:.82rem;color:var(--sea);font-weight:300;letter-spacing:.14em;text-transform:uppercase}

/* ─── VIEW TABS ───────────────────────────────────── */
.view-tabs{display:flex;justify-content:center;gap:0;margin:1.2rem auto 0;max-width:700px !important;border:1.5px solid var(--sand);border-radius:3px;overflow:hidden}
.view-tab{flex:1;padding:.55rem 1rem;font-family:'Crimson Pro',serif;font-size:.88rem;letter-spacing:.08em;cursor:pointer;border:none;background:transparent;color:var(--deep);transition:all .22s;text-transform:uppercase}
.view-tab+.view-tab{border-left:1.5px solid var(--sand)}
.view-tab.active{background:var(--navy);color:#fff}
.view-tab:not(.active):hover{background:var(--sand)}

/* ─── FILTER BAR ──────────────────────────────────── */
.filter-bar{display:flex;justify-content:center;flex-wrap:wrap;gap:.55rem;padding:1.4rem 2rem 2rem}
.filter-btn{border:1.5px solid var(--sand);background:transparent;color:var(--deep);font-family:'Crimson Pro',serif;font-size:.88rem;letter-spacing:.06em;padding:.38rem 1rem;cursor:pointer;border-radius:2px;transition:all .22s}
.filter-btn:hover{background:var(--deep);color:var(--cream);border-color:var(--deep)}
.filter-btn.active{background:var(--terracotta);border-color:var(--terracotta);color:#fff}
.view-panel{display:none}
.view-panel.active{display:block}

/* ─── CARDS ───────────────────────────────────────── */
.cards-grid{max-width:1400px;margin:0 auto;padding:0 2rem 5rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:1.8rem}
.card{background:#fff;border-radius:3px;overflow:hidden;box-shadow:0 2px 18px rgba(42,31,20,.06);transition:transform .28s,box-shadow .28s;display:flex;flex-direction:column;opacity:0;animation:fadeUp .5s ease forwards;cursor:pointer}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 36px rgba(42,31,20,.16)}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.card:nth-child(1){animation-delay:.04s}.card:nth-child(2){animation-delay:.08s}
.card:nth-child(3){animation-delay:.12s}.card:nth-child(4){animation-delay:.16s}
.card:nth-child(5){animation-delay:.20s}.card:nth-child(6){animation-delay:.24s}
.card:nth-child(7){animation-delay:.28s}.card:nth-child(8){animation-delay:.32s}
.card:nth-child(9){animation-delay:.36s}.card:nth-child(10){animation-delay:.40s}
.card:nth-child(11){animation-delay:.44s}.card:nth-child(12){animation-delay:.48s}
.card:nth-child(13){animation-delay:.52s}
.card-accent{height:4px;width:100%}
.card-body{padding:1.5rem 1.5rem .9rem;flex:1}
.card-category{font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;opacity:.75;margin-bottom:.45rem}
.card-title{font-family:'Playfair Display',serif;font-size:1.17rem;font-weight:400;line-height:1.35;margin-bottom:.4rem}
.card-chef{font-size:.8rem;font-style:italic;opacity:.55;margin-bottom:.5rem}
.porzioni-badge{display:inline-block;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;background:var(--deep);color:var(--cream);padding:.18rem .6rem;border-radius:2px;margin-bottom:.5rem}
.divider{height:1px;background:linear-gradient(90deg,var(--sand),transparent);margin:.7rem 0}
.tags{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.7rem}
.tag{font-size:.7rem;padding:.18rem .55rem;border-radius:2px;letter-spacing:.04em}
.tag-km0{background:rgba(107,124,74,.12);color:var(--olive)}
.tag-dop{background:rgba(201,168,76,.15);color:#8a6d1a}
.tag-mare{background:rgba(58,107,124,.12);color:var(--sea)}
.tag-carne{background:rgba(180,60,60,.1);color:#8a2020}
.tag-veg{background:rgba(107,124,74,.12);color:var(--olive)}
.tag-legumi{background:rgba(196,103,58,.12);color:var(--terracotta)}
.tag-integrale{background:rgba(42,31,20,.08);color:var(--deep)}
.ingredients-section{padding:0 1.5rem .9rem}
.ingredients-toggle{display:flex;align-items:center;gap:.45rem;cursor:pointer;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--terracotta);border:none;background:none;font-family:'Crimson Pro',serif;padding:.5rem 0;width:100%;text-align:left;transition:opacity .2s}
.ingredients-toggle:hover{opacity:.65}
.toggle-icon{font-size:1rem;transition:transform .28s;display:inline-block;line-height:1}
.toggle-icon.open{transform:rotate(45deg)}
.ingredients-list{display:none;padding-bottom:.8rem;animation:slideDown .22s ease}
.ingredients-list.open{display:block}
@keyframes slideDown{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
.ingredients-list ul{list-style:none;display:flex;flex-direction:column;gap:.28rem}
.ingredients-list li{font-size:.9rem;display:flex;align-items:flex-start;gap:.45rem;line-height:1.4;font-weight:300}
.ing-dot{width:5px;height:5px;border-radius:50%;background:var(--gold);margin-top:.45em;flex-shrink:0}
.macros{display:grid;grid-template-columns:repeat(4,1fr);background:var(--cream);border-top:1px solid var(--sand);padding:.75rem 1.5rem}
.macro{text-align:center}
.macro-val{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:700;color:var(--deep);line-height:1}
.macro-label{font-size:.63rem;letter-spacing:.07em;text-transform:uppercase;opacity:.5;margin-top:.18rem;display:block}
.macro-approx{grid-column:1/-1;text-align:center;font-size:.65rem;font-style:italic;opacity:.45;padding:.2rem 0 .3rem;letter-spacing:.03em}
/* Card hint strip instead of button */
.card-footer{display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(201,168,76,.3);background:var(--appro-bg)}
.card-hint-text{flex:1;padding:.45rem .75rem;color:var(--appro);font-family:'Crimson Pro',serif;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase}
.card-print-btn{display:flex;align-items:center;gap:.3rem;padding:.45rem .8rem;border:none;border-left:1px solid rgba(201,168,76,.3);background:transparent;color:var(--navy);font-family:'Crimson Pro',serif;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:background .18s;flex-shrink:0}
.card-print-btn:hover{background:var(--navy);color:#fff}

.acc-mare{background:linear-gradient(90deg,var(--sea),#5a9bb0)}
.acc-legumi{background:linear-gradient(90deg,var(--terracotta),#d4845a)}
.acc-veg{background:linear-gradient(90deg,var(--olive),#8a9e60)}
.acc-pasta{background:linear-gradient(90deg,var(--gold),#d4b46c)}
.acc-insalata{background:linear-gradient(90deg,#6b9c7c,#8abf9c)}
.acc-zuppa{background:linear-gradient(90deg,#7c6b3a,#a08c50)}
.cat-mare{color:var(--sea)}.cat-legumi{color:var(--terracotta)}.cat-veg{color:var(--olive)}
.cat-pasta{color:#8a6d1a}.cat-insalata{color:#3a7c5a}.cat-zuppa{color:#7c6b3a}

/* ─── SCHEDE ──────────────────────────────────────── */
.schede-grid{max-width:1100px;margin:0 auto;padding:0 2rem 5rem;display:flex;flex-direction:column;gap:2.4rem}
.scheda{background:#fff;border-radius:4px;overflow:hidden;box-shadow:0 2px 20px rgba(42,31,20,.07);opacity:0;animation:fadeUp .5s ease forwards}
.scheda-header{padding:1.1rem 1.6rem;display:flex;align-items:center;gap:1rem;border-bottom:3px solid var(--navy)}
.scheda-num{font-family:'Playfair Display',serif;font-size:2rem;font-weight:700;color:var(--navy);opacity:.25;line-height:1;flex-shrink:0;min-width:2.2rem}
.scheda-title-block{flex:1}
.scheda-title{font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:400;color:var(--navy);line-height:1.25}
.scheda-chef{font-size:.8rem;font-style:italic;opacity:.55;margin-top:.15rem}
.scheda-body{display:grid;grid-template-columns:1fr 1fr}
@media(max-width:700px){.scheda-body{grid-template-columns:1fr}}
.scheda-cell{padding:1rem 1.4rem;border-right:1px solid var(--sky2);border-bottom:1px solid var(--sky2)}
.scheda-cell:nth-child(2n){border-right:none}
.scheda-cell.full{grid-column:1/-1;border-right:none}
.scheda-cell-label{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--navy);font-weight:400;margin-bottom:.4rem;display:flex;align-items:center;gap:.4rem}
.scheda-cell-content{font-size:.92rem;line-height:1.6;font-weight:300}
.scheda-cell.allergeni .scheda-cell-content{color:var(--aller);font-weight:400;background:var(--peach);border-radius:3px;padding:.5rem .7rem;font-size:.88rem}
.scheda-cell.motiv .scheda-cell-content{color:var(--motiv);font-weight:300;background:var(--mint);border-radius:3px;padding:.6rem .8rem;font-size:.88rem;line-height:1.65}
.scheda-cell.cottura .scheda-cell-content{color:#5D4037;font-weight:300;background:#FBF7F0;border-radius:3px;padding:.6rem .8rem;font-size:.88rem;line-height:1.65;border-left:3px solid var(--gold)}
.scheda-cell.antitumorale .scheda-cell-content{color:var(--purple);font-weight:300;background:var(--purple-bg);border-radius:3px;padding:.6rem .8rem;font-size:.88rem;line-height:1.65}
.scheda-cell.stagione .scheda-cell-content{font-style:italic;opacity:.7;font-size:.88rem}
.scheda-cell.approfondimento .scheda-cell-content{color:var(--appro);font-weight:300;background:var(--appro-bg);border-radius:3px;padding:.6rem .8rem;font-size:.88rem;line-height:1.65;border-left:3px solid var(--gold)}
.ing-chips{display:flex;flex-wrap:wrap;gap:.35rem}
.ing-chip{background:var(--sky);color:var(--navy);font-size:.75rem;padding:.2rem .55rem;border-radius:2px;line-height:1.4;font-weight:300}
.ing-chip.dop{background:rgba(201,168,76,.2);color:#7a5c10}
.ing-chip.igp{background:rgba(58,107,124,.15);color:var(--sea)}
.ing-chip.km0{background:rgba(107,124,74,.18);color:var(--olive)}
.macros-row{display:grid;grid-template-columns:repeat(4,1fr);background:var(--cream);border-top:1px solid var(--sky2)}
.macros-row .macro{text-align:center;padding:.7rem .5rem}

/* ─── MODAL ───────────────────────────────────────── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(42,31,20,.55);z-index:999;align-items:center;justify-content:center;padding:1rem}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:4px;max-width:720px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:modalIn .25s ease}
@keyframes modalIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.modal-close{float:right;margin:1rem 1.2rem 0 0;background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--deep);opacity:.5;transition:opacity .2s;line-height:1}
.modal-close:hover{opacity:1}

/* ─── APPROFONDIMENTO BADGE in card ──────────────────── */
.appro-badge{display:inline-flex;align-items:center;gap:.3rem;font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;background:var(--appro-bg);color:var(--appro);border:1px solid rgba(201,168,76,.4);padding:.22rem .6rem;border-radius:2px;margin-top:.4rem;font-weight:400}

footer{text-align:center;padding:1.8rem;font-size:.73rem;letter-spacing:.1em;text-transform:uppercase;opacity:.4}

/* ─── SDG ─────────────────────────────────────────── */
.sdg-section{padding:.9rem 1.4rem 1rem;border-top:1px solid var(--sky2);background:#f9fafc}
.sdg-section-label{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:#1a3a5c;font-weight:400;margin-bottom:.7rem;display:flex;align-items:center;gap:.4rem}
.sdg-grid{display:flex;flex-wrap:wrap;gap:.6rem}
.sdg-card{display:flex;gap:.6rem;align-items:flex-start;background:#fff;border-radius:3px;border:1px solid #dce4f0;padding:.55rem .7rem;flex:1;min-width:260px}
.sdg-badge{flex-shrink:0;width:42px;height:42px;border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.65rem;font-weight:700;color:#fff;line-height:1.15;text-align:center}
.sdg-text{flex:1}
.sdg-title{font-size:.78rem;font-weight:600;color:#1a3a5c;margin-bottom:.18rem;line-height:1.3}
.sdg-desc{font-size:.8rem;line-height:1.55;color:#2a3a50;font-weight:300}
/* SDG colors */
.sdg-1{background:#e5243b}.sdg-2{background:#dda63a}.sdg-3{background:#4c9f38}
.sdg-4{background:#c5192d}.sdg-5{background:#ff3a21}.sdg-6{background:#26bde2}
.sdg-7{background:#fcc30b}.sdg-8{background:#a21942}.sdg-9{background:#fd6925}
.sdg-10{background:#dd1367}.sdg-11{background:#fd9d24}.sdg-12{background:#bf8b2e}
.sdg-13{background:#3f7e44}.sdg-14{background:#0a97d9}.sdg-15{background:#56c02b}
.sdg-16{background:#00689d}.sdg-17{background:#19486a}

@media(max-width:600px){
  .cards-grid,.schede-grid{padding:0 1rem 3rem}
  .site-header{padding:2.5rem 1rem 1.2rem}
  #editor-sidebar{width:100vw}
}

/* ─── NEW SECTIONS ─────────────────────────────────── */
:root {
  --coral: #C0392B; --coral-bg: #FDEDEC;
  --adapt-bg: #F4F6F7; --adapt-border: #AEB6BF;
  --haccp-head: #2C3E50; --haccp-ccp: #E74C3C; --haccp-ok: #27AE60;
}
.scheda-cell.diabete .scheda-cell-content {
  color:var(--coral);font-weight:300;background:var(--coral-bg);border-radius:3px;
  padding:.6rem .8rem;font-size:.88rem;line-height:1.65;border-left:3px solid var(--coral);
}
.adapt-grid {display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.6rem;margin-top:.4rem}
.adapt-card {background:#fff;border:1px solid var(--adapt-border);border-radius:3px;padding:.7rem .9rem}
.adapt-label {font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin-bottom:.3rem;display:block}
.adapt-text {font-size:.83rem;line-height:1.55;font-weight:300}
.adapt-vegan .adapt-label {color:#27AE60}
.adapt-lattosio .adapt-label {color:#8E44AD}
.adapt-celiaci .adapt-label {color:#D35400}
.adapt-halal .adapt-label {color:#1A5276}
.adapt-kosher .adapt-label {color:#7D6608}

/* HACCP */
.haccp-flow {display:flex;flex-direction:column;gap:0}
.haccp-step {display:flex;gap:.6rem;align-items:stretch}
.haccp-step-arrow {display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:28px}
.haccp-arrow-line {flex:1;width:2px;background:#AEB6BF;margin:0 auto}
.haccp-arrow-head {font-size:.8rem;color:#AEB6BF;line-height:1}
.haccp-box {flex:1;background:#fff;border:1px solid #AEB6BF;border-radius:3px;margin-bottom:4px;overflow:hidden}
.haccp-box.is-ccp {border-color:var(--haccp-ccp);border-width:2px}
.haccp-box-head {display:flex;align-items:center;gap:.5rem;padding:.5rem .8rem;background:#F2F3F4}
.haccp-box.is-ccp .haccp-box-head {background:#FDEDEC}
.haccp-step-name {font-size:.85rem;font-weight:600;flex:1;line-height:1.3}
.haccp-ccp-badge {font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;background:var(--haccp-ccp);color:#fff;padding:.15rem .5rem;border-radius:2px;flex-shrink:0}
.haccp-ok-badge {font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;background:var(--haccp-ok);color:#fff;padding:.15rem .5rem;border-radius:2px;flex-shrink:0}

  {id:0,numero:1,title:"Spigola al Cartoccio con Carote Lesse",chef:"Amitrano",cat:"mare",catLabel:"Mare & Pesce",accent:"acc-mare",tags:[["mare","tag-mare"],["km0","tag-km0"]],porzioni:"Dosi per 4 persone",ingredients:["4 filetti di spigola 160 g cad. (pesca costiera campana)","4 carote medie (agro-sarnese, km0)","1 limone di Sorrento IGP","prezzemolo fresco","2 spicchi aglio","olio EVO campano DOP","sale marino integrale","pepe nero","timo fresco"],macros:{kcal:220,prot:28,carb:10,grassi:8},note:"Cottura al vapore nel cartoccio: nessun grasso aggiunto",allergeni:"Pesce (spigola)",procedimento:"Disporre ogni filetto di spigola su un foglio di carta forno. Aggiungere fettine di carota, aglio, prezzemolo, scorza di limone IGP, olio EVO e sale. Chiudere il cartoccio ermeticamente. Cuocere in forno a 180°C per 18–20 min. Servire nel cartoccio aperto al tavolo.",motivazione:"La spigola è pesce magro con 18 g di proteine/100 g e grassi insaturi benefici. La cottura al cartoccio non aggiunge grassi e preserva tutti i nutrienti. Le carote apportano betacarotene e fibre. Il limone di Sorrento IGP aggiunge vitamina C e limonene antiossidante.",cottura:"Il cartoccio crea un microclima di vapore umido a 180°C: la T interna del pesce raggiunge i 63°C garantendo la sicurezza microbiologica. Questo metodo preserva Omega-3 e aminoacidi essenziali. Le carote lesse mantengono betacarotene che aumenta la biodisponibilità con la cottura.",antitumorale:"La spigola apporta Omega-3 EPA e DHA con azione antinfiammatoria. Il limone di Sorrento IGP è ricco di limonene, uno dei monoterpeni più studiati in oncologia. Le carote contengono betacarotene e falcarinolo associati alla riduzione del rischio di tumore al colon.",stagione:"Tutto l'anno (spigola e carote disponibili tutto l'anno; limone IGP in inverno-primavera)",approfondimento:{nome:"Limone di Sorrento IGP",marchio:"IGP",descrizione:"Il Limone di Sorrento ha ottenuto il riconoscimento IGP nel 2000. Coltivato sulle terrazze della Penisola Sorrentina, si distingue per la buccia spessa e profumatissima. La scorza è eccezionalmente ricca di limonene (fino al 70% degli oli essenziali), hesperidina e vitamina C, con concentrazioni 3-4 volte superiori ai limoni comuni. La coltivazione avviene sotto le pagliarelle, strutture tradizionali che proteggono i frutti dal freddo."},ingChips:[{t:"Spigola km0",c:"km0"},{t:"Carote agro-sarnese",c:"km0"},{t:"Limone Sorrento IGP",c:"igp"},{t:"Olio EVO DOP",c:"dop"},{t:"Prezzemolo",c:""}]},

ale); orata fresca ottobre-aprile; zucchine San Pasquale maggio-settembre",approfondimento:{nome:"Olive di Gaeta DOP",marchio:"DOP",descrizione:"Le Olive di Gaeta DOP sono della varietà Itrana, coltivate nel territorio di Gaeta e nei comuni limitrofi tra Lazio e Campania. Raccolte a maturazione avanzata (dicembre-gennaio), quando la buccia vira dal verde al nero-violaceo, vengono lavorate con metodi tradizionali in salamoia senza additivi chimici. Contengono fino a 300 mg/kg di idrossitirosolo, uno degli antiossidanti più potenti del mondo vegetale, con effetti documentati sulla riduzione del rischio cardiovascolare e antitumorale — effetto riconosciuto anche dall'EFSA con un health claim ufficiale. Sono presenti in questo piatto come elemento cardine della tradizione gastronomica dell'Italia meridionale."},ingChips:[{t:"Riso integrale bio",c:""},{t:"Orata FAO 37",c:"km0"},{t:"Olio EVO Sorrentino DOP",c:"dop"},{t:"Aglio Nubia IGP",c:"igp"},{t:"Capperi Pantelleria IGP",c:"igp"},{t:"Olive Gaeta DOP",c:"dop"},{t:"Zucchine S.Pasquale PAT",c:"pat"},{t:"Limone Sorrento IGP",c:"igp"}]},

rielli e cicerchie ottobre-marzo); pomodorini Piennolo DOP tutto l'anno",approfondimento:{nome:"Noci di Sorrento PAT",marchio:"PAT",descrizione:"Le Noci di Sorrento sono inserite nell'elenco dei Prodotti Agroalimentari Tradizionali italiani. Coltivate sui Monti Lattari e sulle colline della Penisola Sorrentina, si distinguono per il guscio sottile e il gheriglio grande dal sapore dolce. Contengono circa 15 g di Omega-3 ALA per 100 g, il triplo rispetto a molte cultivar nordeuropee. Sono ingrediente fondamentale del nocillo, il liquore sorrentino."},ingChips:[{t:"Cicerchie PAT",c:"pat"},{t:"Orzo semiperlato",c:""},{t:"Piennolo DOP",c:"dop"},{t:"Zucchine S.Pasquale PAT",c:"pat"},{t:"Noci Sorrento PAT",c:"pat"},{t:"Friarielli PAT",c:"pat"},{t:"Olio EVO DOP",c:"dop"}]},

cchine di San Pasquale sono un ecotipo locale della Penisola Sorrentina, inserite nell'elenco PAT. Si distinguono per la forma allungata, la buccia striata di verde chiaro e scuro e la polpa soda con sapore dolciastro. Non richiedono trattamenti fitosanitari intensivi grazie alla resistenza naturale alle malattie fungine. La coltivazione avviene su terrazze con tecniche agronomiche tramandate di generazione in generazione."},ingChips:[{t:"Riso carnaroli",c:""},{t:"Zucchine km0",c:"km0"},{t:"Speck Alto Adige IGP",c:"igp"},{t:"Olio EVO",c:"km0"},{t:"Parmigiano",c:""}]},
  {id:4,numero:5,title:"Tartare di Pesce Spada con Crostini e Salsa al Limone",chef:"D Esposito",cat:"mare",catLabel:"Mare & Pesce",accent:"acc-mare",tags:[["mare","tag-mare"],["IGP","tag-dop"],["km0","tag-km0"]],porzioni:"Dosi per 4 persone",ingredients:["400 g pesce spada freschissimo (abbattuto, pesca Sicilia/Campania)","2 limoni di Sorrento IGP (succo e scorza)","olio EVO campano","prezzemolo fresco","erba cipollina","1 cucchiaio capperi dissalati","4 fette pane integrale (crostini)","sale marino integrale","pepe bianco","1 cucchiaino senape Dijon"],macros:{kcal:280,prot:30,carb:18,grassi:10},note:"Usare SOLO pesce spada abbattuto a -18 gradi C per almeno 24h (obbligo di legge per il crudo)",allergeni:"Pesce (pesce spada) · Glutine (pane) · Senape",procedimento:"Tritare finemente al coltello il pesce spada abbattuto. Preparare la salsa con succo e scorza di limone IGP, olio EVO, senape, sale e pepe. Condire il pesce con meta della salsa, capperi e erba cipollina. Formare quenelles. Tostare il pane integrale. Impiattare la tartare sui crostini con la salsa rimanente a parte e prezzemolo fresco.",motivazione:"Il pesce spada e fonte di proteine complete (20 g/100 g) e Omega-3 DHA/EPA. La preparazione a crudo preserva integralmente tutti i nutrienti termolabili. Il limone di Sorrento IGP non solo insaporisce ma l'acido citrico denatura parzialmente le proteine superficiali. I crostini integrali apportano fibre.",cottura:"PREPARAZIONE A FREDDO - nessuna cottura termica. Il pesce spada DEVE obbligatoriamente essere stato abbattuto a -18 gradi C per almeno 24 ore (Reg. CE 853/2004) per eliminare Anisakis simplex. L'acidita del limone IGP contribuisce alla sicurezza microbiologica superficiale ma NON sostituisce l'abbattimento termico.",antitumorale:"Il pesce spada apporta Omega-3 EPA e DHA con azione antinfiammatoria sistemica. Il limone di Sorrento IGP e eccezionalmente ricco di limonene. Il prezzemolo apporta apigenina con documentata inibizione della proliferazione cellulare. I capperi contengono quercetina e campferolo con potente azione antiproliferativa.",stagione:"Estate (pesce spada luglio-settembre); limone IGP tutto l'anno",approfondimento:{nome:"Limone di Sorrento IGP",marchio:"IGP",descrizione:"Il Limone di Sorrento IGP e tra gli agrumi piu pregiati al mondo per la qualita della scorza. La cultivar Femminello Sorrentino produce frutti quasi tutto l'anno. La scorza spessa fino a 9 mm contiene ghiandole oleifere visibili che rilasciano il profumo intenso al minimo sfregamento. Il disciplinare IGP impone la raccolta manuale. Il Limoncello della Costa d'Amalfi IGP utilizza esclusivamente la scorza del Limone di Sorrento IGP."},ingChips:[{t:"Pesce spada abbattuto",c:"km0"},{t:"Limone Sorrento IGP",c:"igp"},{t:"Olio EVO",c:"km0"},{t:"Capperi",c:""},{t:"Pane integrale",c:""}]},
  {id:5,numero:6,title:"Tubettone Sorrentino Integrale",chef:"Esposito",cat:"pasta",catLabel:"Pasta",accent:"acc-pasta",tags:[["integrale","tag-integrale"],["IGP","tag-dop"],["km0","tag-km0"],["PAT","tag-pat"]],porzioni:"Dosi per 4 persone",ingredients:["320 g pasta integrale (tubettoni)","200 g piselli novelli coltivati negli orti della Penisola Sorrentina","olio EVO Penisola Sorrentina DOP","1 cipollotto fresco tritato","finocchietto selvatico campano","scorza grattugiata di 2 limoni di Sorrento IGP","30 g granella noci di Sorrento PAT","6 alici di Cetara sotto sale","sale marino integrale","pepe nero"],macros:{kcal:430,prot:18,carb:62,grassi:14},note:"Ogni ingrediente e un presidio del territorio sorrentino-campano",allergeni:"Glutine (pasta) · Pesce (alici) · Frutta a guscio (noci)",procedimento:"Dissalare le alici in acqua fredda 30 min. Soffriggere il cipollotto in olio EVO DOP. Aggiungere i piselli novelli e cuocere 8 min. Cuocere la pasta integrale al dente. Mantecare pasta e piselli, aggiungere le alici spezzettate fuori fuoco, scorza di limone IGP e finocchietto. Impiattare con granella di noci di Sorrento PAT.",motivazione:"I piselli novelli sorrentini hanno IG basso (35). La pasta integrale abbassa del 30% l'indice glicemico. Le alici di Cetara apportano Omega-3, calcio e vitamina D. La granella di noci di Sorrento PAT aggiunge grassi polinsaturi Omega-3 ALA e vitamina E.",cottura:"Le alici di Cetara vengono dissalate a freddo e aggiunte esclusivamente fuori fuoco: il calore ossiderebbe gli Omega-3 e svilupperebbe istamina. I piselli novelli vengono cotti brevemente (8 min) per preservare vitamina C. La scorza di limone IGP e le noci vengono aggiunte sempre a crudo.",antitumorale:"Le alici di Cetara apportano Omega-3 EPA e DHA che inibiscono la sintesi di prostaglandine pro-infiammatorie. Il finocchietto contiene anetolo con documentata attivita pro-apoptotica. Le noci di Sorrento PAT sono ricche di acido ellagico. Il limone IGP apporta limonene che inibisce la farnesil-transferasi.",stagione:"Primavera-estate (piselli novelli sorrentini aprile-giugno); alici di Cetara e limone IGP tutto l'anno",approfondimento:{nome:"Alici di Cetara - Presidio Slow Food",marchio:"Presidio Slow Food",descrizione:"Le Alici di Cetara e la loro colatura sono un Presidio Slow Food. Cetara, borgo marinaro della Costa d'Amalfi, e famoso per la lavorazione delle alici sotto sale. La colatura di alici di Cetara (IGP dal 2020) e un liquido ambrato ottenuto dalla maturazione in botti di castagno per 12 mesi. Le alici sono eccezionalmente ricche di Omega-3 (EPA 0.9 g/100 g, DHA 1.1 g/100 g), vitamina D e calcio."},ingChips:[{t:"Pasta integrale",c:""},{t:"Piselli Sorrento km0",c:"km0"},{t:"Olio EVO DOP",c:"dop"},{t:"Limone Sorrento IGP",c:"igp"},{t:"Noci Sorrento PAT",c:"pat"},{t:"Alici Cetara",c:"km0"}]},
  {id:6,numero:7,title:"Seppia Ripiena con Zucchine San Pasquale in Guazzetto",chef:"Iaccarino",cat:"mare",catLabel:"Mare & Pesce",accent:"acc-mare",tags:[["mare","tag-mare"],["km0","tag-km0"],["PAT","tag-pat"]],porzioni:"Dosi per 4 persone",ingredients:["4 seppie medie (pesca costiera campana)","3 zucchine San Pasquale PAT","prezzemolo fresco abbondante","2 spicchi aglio","olio EVO campano","vino bianco secco","pomodorini del Piennolo DOP","sale marino","pepe","pane integrale grattugiato (50 g)","1 uovo (per il ripieno)"],macros:{kcal:290,prot:28,carb:14,grassi:11},note:"Il guazzetto di prezzemolo e il sugo tradizionale di accompagnamento delle seppie campane",allergeni:"Molluschi (seppia) · Uova · Glutine (pane grattugiato) · Solfiti (vino bianco)",procedimento:"Pulire le seppie. Preparare il ripieno con tentacoli tritati, zucchine San Pasquale PAT a cubetti, prezzemolo, aglio, pane grattugiato integrale e uovo. Farcire le seppie e chiudere con stuzzicadenti. In casseruola rosolare in olio EVO, sfumare con vino bianco, aggiungere pomodorini Piennolo DOP e cuocere 35 min a fuoco basso.",motivazione:"La seppia e mollusco magrissimo con soli 72 kcal/100 g. L'inchiostro di seppia contiene melanina e taurina con proprieta antiossidanti. Le zucchine San Pasquale PAT sono ipocaloriche e ricche di potassio. Il prezzemolo apporta vitamina C, apigenina e folati in quantita eccezionali.",cottura:"La farcitura con pane integrale funge da agente legante a basso IG. La cottura lenta in casseruola (35 min a fuoco basso) intenerisce il collagene dei molluschi. I pomodorini Piennolo DOP vengono aggiunti successivamente per preservare il licopene.",antitumorale:"Il prezzemolo e la fonte alimentare piu ricca di apigenina con documentata inibizione della crescita di cellule tumorali. I pomodorini del Piennolo DOP apportano licopene e betacarotene. Le zucchine San Pasquale PAT contengono cucurbitacine con attivita antitumorale. L'aglio aggiunge allicina e diallil disolfuro.",stagione:"Primavera-estate (seppie febbraio-giugno; zucchine San Pasquale maggio-settembre)",approfondimento:{nome:"Pomodorino del Piennolo del Vesuvio DOP",marchio:"DOP",descrizione:"Il Pomodorino del Piennolo del Vesuvio ha ottenuto la DOP nel 2009. Si coltiva sulle pendici del Vesuvio in terreni vulcanici. Il nome piennolo deriva dal dialettale appendere: i grappoli vengono legati e appesi in locali freschi dove maturano lentamente durante l'inverno senza refrigerazione. Il frutto contiene circa 25 mg/100 g di licopene, 3 volte superiore ai pomodori comuni."},ingChips:[{t:"Seppia km0",c:"km0"},{t:"Zucchine S.Pasquale PAT",c:"pat"},{t:"Piennolo DOP",c:"dop"},{t:"Prezzemolo fresco",c:""},{t:"Olio EVO",c:"km0"}]},
  {id:7,numero:8,title:"Farro Integrale con Sgombro e Verdure di Stagione",chef:"Mastellone",cat:"pasta",catLabel:"Cereali Integrali",accent:"acc-pasta",tags:[["integrale","tag-integrale"],["mare","tag-mare"],["km0","tag-km0"]],porzioni:"Dosi per 4 persone",ingredients:["250 g farro integrale","200 g sgombro al naturale (pesca locale)","150 g pomodorini campani freschi (km0)","2 zucchine medie (stagione, km0)","olio EVO campano","basilico fresco","menta fresca","succo di limone","1 spicchio aglio","sale marino integrale","pepe nero"],macros:{kcal:360,prot:22,carb:46,grassi:11},note:"Il farro integrale richiede ammollo di 8 ore per ridurre i tempi di cottura",allergeni:"Glutine (farro) · Pesce (sgombro)",procedimento:"Ammollare il farro integrale 8 ore. Cuocere in acqua salata 45 min, scolare e raffreddare. Tagliare le zucchine a dadini e saltarle 5 min. Sgocciolare lo sgombro. In ciotola assemblare farro raffreddato, sgombro sbriciolato, zucchine, pomodorini, basilico e menta. Condire con olio EVO e succo di limone.",motivazione:"Il farro integrale ha IG circa 35 grazie all'alta concentrazione di fibre (8 g/100 g). Lo sgombro e il pesce azzurro con la piu alta concentrazione di Omega-3 (2,2 g/100 g). Il raffreddamento del farro massimizza l'amido resistente.",cottura:"L'ammollo obbligatorio del farro integrale (8 ore) riduce gli antinutrienti migliorando la biodisponibilita di ferro, zinco e calcio. Lo sgombro al naturale non subisce ulteriore cottura, preservando gli Omega-3. Il raffreddamento rapido del farro genera amido resistente RS3 che produce butirrato nel colon.",antitumorale:"Lo sgombro ha Omega-3 EPA e DHA che riducono i livelli di prostaglandine pro-infiammatorie. Il farro integrale apporta lignani che riducono i livelli di estrogeni liberi circolanti. Il basilico apporta eugenolo che inibisce l'angiogenesi tumorale. La menta contribuisce con perillyl alcohol.",stagione:"Estate (zucchine e pomodorini freschi); sgombro e farro disponibili tutto l'anno",approfondimento:{nome:"Olio EVO Penisola Sorrentina DOP",marchio:"DOP",descrizione:"L'Olio Extravergine di Oliva Penisola Sorrentina ha ottenuto la DOP nel 1998. Prodotto principalmente dalla cultivar Minucciola (oltre l'80%), con raccolta manuale e frangitura a freddo entro 24 ore. Il contenuto di acido oleico supera il 72%, con livelli eccezionali di oleocantale e oleuropeina, i polifenoli piu studiati per le proprieta antinfiammatorie e cardioprotettive."},ingChips:[{t:"Farro integrale",c:""},{t:"Sgombro km0",c:"km0"},{t:"Pomodorini campani",c:"km0"},{t:"Zucchine km0",c:"km0"},{t:"Olio EVO",c:"km0"}]},
  {id:8,numero:9,title:"Risotto Integrale alla Pescatora",chef:"Massa",cat:"pasta",catLabel:"Cereali & Riso",accent:"acc-pasta",tags:[["mare","tag-mare"],["integrale","tag-integrale"],["km0","tag-km0"]],porzioni:"Dosi per 4 persone",ingredients:["300 g riso integrale carnaroli","200 g gamberetti sgusciati (km0, pesca locale)","150 g cozze (km0, allevamento costiero campano)","100 g vongole veraci (km0)","150 g pomodorini campani","1 cipolla piccola","2 spicchi aglio","olio EVO campano","vino bianco secco","prezzemolo fresco","brodo di pesce homemade","sale marino","peperoncino"],macros:{kcal:410,prot:28,carb:50,grassi:10},note:"Il riso integrale richiede pre-ammollo e tempi di cottura piu lunghi del carnaroli classico",allergeni:"Crostacei (gamberetti) · Molluschi (cozze, vongole) · Solfiti (vino bianco)",procedimento:"Aprire cozze e vongole in padella con aglio e vino bianco, filtrare il liquido. Soffriggere cipolla in olio EVO, tostare il riso integrale 3 min. Aggiungere brodo di pesce caldo a mestoli. A tre quarti cottura aggiungere i gamberetti, i molluschi sgusciati e i pomodorini. Mantecare fuori fuoco. Prezzemolo fresco abbondante.",motivazione:"Il riso integrale ha IG circa 50 vs il riso bianco IG circa 72. Le cozze sono la fonte alimentare piu ricca di vitamina B12 (320 microgrammi/100 g) e selenio. I gamberetti apportano iodio fondamentale per la funzione tiroidea.",cottura:"Il riso integrale viene tostato a secco 3 min prima del liquido abbassando l'IG. Le cozze e le vongole vengono aperte a fuoco vivo (3 min). Il liquido di apertura dei molluschi viene filtrato e aggiunto al risotto. I gamberetti vengono aggiunti negli ultimi 3 min.",antitumorale:"Le cozze e le vongole contengono selenio, oligoelemento fondamentale per la glutatione perossidasi: bassi livelli correlano con aumento del rischio di tumori. I gamberetti apportano astaxantina con documentata azione antitumorale. Il prezzemolo fornisce apigenina.",stagione:"Tutto l'anno (frutti di mare); pomodorini campani estate-autunno",approfondimento:{nome:"Cozze del Golfo di Napoli - km0",marchio:"km0",descrizione:"Le cozze (Mytilus galloprovincialis) allevate nel Golfo di Napoli sono di straordinaria qualita. Gli allevamenti locali con filari galleggianti producono cozze con carne abbondante e saporita. Vengono raccolte quotidianamente garantendo freschezza impossibile con prodotti di importazione. Dal punto di vista nutrizionale: vitamina B12 (340 microgrammi/100 g - 14000% RDA), selenio, ferro e Omega-3, con sole 86 kcal/100 g."},ingChips:[{t:"Riso integrale",c:""},{t:"Gamberetti km0",c:"km0"},{t:"Cozze km0",c:"km0"},{t:"Vongole km0",c:"km0"},{t:"Pomodorini campani",c:"km0"},{t:"Olio EVO",c:"km0"}]},
  {id:9,numero:10,title:"Pennette Integrali Broccoli e Provolone del Monaco",chef:"Panico",cat:"pasta",catLabel:"Pasta Integrale",accent:"acc-pasta",tags:[["integrale","tag-integrale"],["DOP","tag-dop"],["km0","tag-km0"]],porzioni:"Dosi per 4 persone",ingredients:["320 g pennette integrali","400 g broccoli baresi (km0, agro-sarnese)","50 g provolone del Monaco DOP (stagionato 6 mesi)","2 spicchi aglio","olio EVO campano","peperoncino","sale marino integrale","acqua di cottura della pasta","prezzemolo fresco (facoltativo)"],macros:{kcal:390,prot:17,carb:58,grassi:11},note:"Il provolone del Monaco DOP, tipicita dei Monti Lattari, si usa in piccola quantita come condimento",allergeni:"Glutine (pasta) · Latte (provolone del Monaco)",procedimento:"Lessare i broccoli baresi al dente in acqua salata, scolare tenendo l'acqua di cottura. In padella soffriggere aglio e peperoncino, aggiungere i broccoli e schiacciarne parte. Cuocere la pasta integrale nella stessa acqua dei broccoli. Mantecare pasta e broccoli aggiungendo acqua di cottura. Fuori fuoco grattugiare il provolone del Monaco DOP.",motivazione:"I broccoli baresi contengono sulforafano, il composto bioattivo piu studiato in oncologia nutrizionale. La pasta integrale ha IG circa 40. L'abbinamento crea un piatto con proteine complete, fibre e calcio in proporzioni ottimali.",cottura:"La cottura dei broccoli nella stessa acqua della pasta recupera i glucosinolati idrosolubili. I broccoli vengono cotti al dente (6-8 min): cotture piu lunghe distruggerebbero la mirosinasi e i glucosinolati. Il provolone del Monaco DOP viene aggiunto fuori fuoco per preservarne gli aromi.",antitumorale:"I broccoli baresi sono la fonte piu ricca di sulforafano, la molecola naturale piu studiata in oncologia: attiva i geni NRF2 soppressori tumorali. L'aglio aggiunge allicina. Il provolone del Monaco DOP stagionato apporta acido linoleico coniugato (CLA) con attivita anticancro. Il peperoncino aggiunge capsaicina pro-apoptotica.",stagione:"Autunno-inverno (broccoli baresi ottobre-marzo); provolone del Monaco DOP e pasta tutto l'anno",approfondimento:{nome:"Provolone del Monaco DOP",marchio:"DOP",descrizione:"Il Provolone del Monaco ha ottenuto la DOP nel 2010. Prodotto con latte vaccino crudo intero dai Monti Lattari, lavorato artigianalmente con caglio in pasta di capretto. La stagionatura minima e di 6 mesi. Il nome Monaco deriva dall'usanza degli affinatori del XVII-XVIII secolo. Il latte delle vacche di razza Agerolese, allevate allo stato semibrado sui pascoli dei Monti Lattari, conferisce un bouquet aromatico inimitabile con note di fieno ed erbe di montagna."},ingChips:[{t:"Pennette integrali",c:""},{t:"Broccoli baresi km0",c:"km0"},{t:"Provolone Monaco DOP",c:"dop"},{t:"Olio EVO",c:"km0"},{t:"Aglio",c:""}]},
  {id:10,numero:11,title:"Pasta e Cicerchie di Capri",chef:"Pollio",cat:"legumi",catLabel:"Legumi & Pasta",accent:"acc-legumi",tags:[["legumi","tag-legumi"],["km0","tag-km0"]],porzioni:"Dosi per 4 persone",ingredients:["180 g cicerchie di Capri PAT (ammollate 24h)","200 g pasta mista integrale","2 pomodori ramati (stagione)","1 cipolla dorata","2 spicchi aglio","rosmarino fresco","olio EVO campano","brodo vegetale","sale marino integrale","peperoncino","prezzemolo fresco"],macros:{kcal:370,prot:17,carb:58,grassi:8},note:"Ammollo obbligatorio 24h e cottura lenta per eliminare la ODAP tossica",allergeni:"Glutine (pasta)",procedimento:"Ammollare le cicerchie 24 ore cambiando l'acqua 2-3 volte. Cuocere in acqua non salata per 60-70 min. Soffriggere cipolla, aglio e rosmarino in olio EVO. Aggiungere pomodori e cicerchie cotte. Cuocere la pasta mista nella zuppa aggiungendo brodo. Finire con olio EVO a crudo, prezzemolo e peperoncino.",motivazione:"Le cicerchie di Capri PAT hanno proteine di alta qualita (25 g/100 g), IG bassissimo (inferiore a 30) e alto contenuto di fibre prebiotiche. La cottura come zuppa densa crea un piatto ad alto potere saziante.",cottura:"L'ammollo di 24 ore con cambi d'acqua e OBBLIGATORIO: riduce la ODAP (neurotossina) responsabile del latirismo. La pasta viene cotta direttamente nella zuppa: l'amido che rilascia crea cremosita naturale senza grassi aggiuntivi.",antitumorale:"Le cicerchie contengono lectine e inibitori di proteasi con documentata attivita pro-apoptotica. Il rosmarino apporta acido carnosico e rosmarinico con effetto inibitorio su enzimi pro-infiammatori. L'aglio contribuisce con allicina e organosolfurati.",stagione:"Tutto l'anno (cicerchie secche); pomodori freschi estate",approfondimento:{nome:"Cicerchie di Capri PAT",marchio:"PAT",descrizione:"Le Cicerchie di Capri (Lathyrus sativus) sono un Prodotto Agroalimentare Tradizionale (PAT) campano e Presidio Slow Food. Coltivate nell'area flegrea e nella zona di Capri per secoli, hanno un contenuto proteico superiore (25 g/100 g), IG bassissimo (inferiore a 30) e resistenza eccezionale alla siccita. Nella tradizione culinaria napoletana erano il cibo dei poveri. Il Presidio Slow Food coinvolge una quindicina di produttori locali per mantenere la biodiversita genetica."},ingChips:[{t:"Cicerchie Capri PAT",c:"pat"},{t:"Pasta integrale",c:""},{t:"Olio EVO",c:"km0"},{t:"Rosmarino fresco",c:""},{t:"Pomodori freschi",c:"km0"}]},
  {id:11,numero:12,title:"Tagliolini al Limone",chef:"Salvato",cat:"pasta",catLabel:"Pasta",accent:"acc-pasta",tags:[["IGP","tag-dop"],["km0","tag-km0"]],porzioni:"Dosi per 4 persone",ingredients:["320 g tagliolini freschi all'uovo (o secchi)","3 limoni di Sorrento IGP (scorza e succo)","40 g burro di qualita","200 ml panna fresca (ridotta, 50 ml/porzione)","40 g parmigiano reggiano stagionato","sale marino integrale","pepe bianco","basilico fresco","erba cipollina fresca"],macros:{kcal:480,prot:14,carb:60,grassi:20},note:"Usare la scorza biologica del limone IGP - e il vero protagonista del piatto",allergeni:"Glutine (tagliolini) · Uova (tagliolini freschi) · Latte (burro, panna, parmigiano)",procedimento:"Cuocere i tagliolini in acqua salata (2 min se freschi, 6 min se secchi). Sciogliere il burro a fuoco bassissimo, aggiungere la panna. Fuori fuoco aggiungere scorza e succo dei limoni IGP e parmigiano. Scolare i tagliolini al dente e mantecare nella salsa con acqua di cottura. Servire con basilico fresco ed erba cipollina.",motivazione:"Il limone di Sorrento IGP e l'ingrediente protagonista: la scorza contiene limonene, hesperidina e vitamina C in concentrazioni eccezionali. La panna viene usata in quantita limitata (50 ml/porzione) come veicolo lipidico che aumenta la biodisponibilita dei flavonoidi.",cottura:"Il burro e la panna vengono scaldati a fuoco bassissimo (inferiore a 90 gradi C). Il limone - scorza e succo - viene aggiunto SEMPRE fuori fuoco: il calore degraderebbe il limonene volatile e la vitamina C termolabile. La mantecatura con acqua di cottura permette di ridurre la quantita di panna.",antitumorale:"Il limonene della scorza del limone di Sorrento IGP e tra i composti naturali piu studiati in oncologia: inibisce la farnesil-proteina transferasi, enzima chiave nella crescita tumorale. La vitamina C del limone inibisce la formazione di nitrosammine cancerogene. L'erba cipollina apporta composti solforati con effetto antiproliferativo.",stagione:"Tutto l'anno (limoni di Sorrento IGP, ottimali in inverno-primavera)",approfondimento:{nome:"Limone di Sorrento IGP - La scorza",marchio:"IGP",descrizione:"Il Limone di Sorrento IGP e l'ingrediente protagonista assoluto di questo piatto. Il disciplinare IGP impone la raccolta manuale per non danneggiare le bucce e la commercializzazione con foglia come simbolo di freschezza. Gli agricoltori della Penisola Sorrentina coltivano i limoneti su strette terrazze chiamate macere, sostenute da muretti a secco di pietra lavica, spesso raggiungibili solo a piedi."},ingChips:[{t:"Tagliolini freschi",c:""},{t:"Limone Sorrento IGP",c:"igp"},{t:"Burro",c:""},{t:"Parmigiano",c:""},{t:"Basilico fresco",c:"km0"}]},
  {id:12,numero:13,title:"Zuppa di Fagioli di Controne e Scarola con Crostini di Segale",chef:"Somma",cat:"legumi",catLabel:"Zuppe & Legumi",accent:"acc-zuppa",tags:[["legumi","tag-legumi"],["km0","tag-km0"],["PAT","tag-pat"]],porzioni:"Dosi per 4 persone",ingredients:["250 g fagioli di Controne PAT (ammollati 12h)","300 g scarola riccia campana fresca (km0)","4 fette pane di segale integrale","3 spicchi aglio","olio EVO campano","brodo vegetale homemade","sale marino integrale","peperoncino","rosmarino fresco","1 pomodoro maturo","parmigiano reggiano (facoltativo)"],macros:{kcal:310,prot:16,carb:48,grassi:7},note:"I fagioli di Controne PAT, dal Cilento, sono tra le eccellenze leguminose campane",allergeni:"Glutine (pane di segale)",procedimento:"Ammollare i fagioli di Controne 12 ore. Cuocere in acqua non salata per 50-60 min. Soffriggere aglio e rosmarino, aggiungere il pomodoro e i fagioli cotti. Cuocere 10 min. Sbollentare la scarola 3 min, strizzare bene, aggiungere alla zuppa. Tostare il pane di segale. Servire sui crostini con olio EVO a crudo.",motivazione:"I fagioli di Controne PAT sono tra i legumi con il piu alto contenuto di proteine vegetali (22 g/100 g) e fibre (15 g/100 g). IG molto basso (GL circa 6 per porzione). La scarola riccia campana e ricca di folati, vitamina K e acido cicorico. La zuppa segue il principio della dieta mediterranea cilentana dichiarata Patrimonio UNESCO.",cottura:"I fagioli di Controne PAT vengono ammollati 12 ore e cotti in acqua non salata: questa procedura e CCP fondamentale per inattivare le lectine fitoemagglutinine tossiche. La scarola viene sbollentata separatamente 3 min e strizzata: riduce l'amaro e abbatte ossalati. L'olio EVO viene versato esclusivamente a crudo.",antitumorale:"I fagioli di Controne PAT contengono saponine, fitati e inibitori di proteasi con attivita di inibizione della proliferazione cellulare tumorale. La scarola riccia e ricca di acido cicorico e lattucina con effetto pro-apoptotico. Il rosmarino apporta acido carnosico con effetto inibitorio sulla cancerogenesi epatica.",stagione:"Autunno-inverno (scarola riccia settembre-aprile; fagioli di Controne secchi tutto l'anno)",approfondimento:{nome:"Fagioli di Controne PAT - Presidio Slow Food",marchio:"PAT",descrizione:"I Fagioli di Controne sono un Prodotto Agroalimentare Tradizionale (PAT) campano e Presidio Slow Food. Coltivati a Controne, borgo del Cilento (SA), si distinguono per la buccia sottilissima, la polpa cremosa e il sapore dolce. Il Presidio Slow Food coinvolge produttori locali per salvare questa varieta dall'abbandono. Sono nell'Arca del Gusto Slow Food come patrimonio gastronomico a rischio di estinzione."},ingChips:[{t:"Fagioli Controne PAT",c:"pat"},{t:"Scarola riccia km0",c:"km0"},{t:"Pane segale integrale",c:""},{t:"Olio EVO",c:"km0"},{t:"Rosmarino fresco",c:""}]},

are l'indice glicemico. Salsa pomodorino a fuoco medio-basso: la cottura aumenta la biodisponibilita del licopene del 35%.",antitumorale:"Il licopene dei pomodorini del Piennolo DOP e uno dei carotenoidi piu studiati in oncologia. Le melanzane contengono nasunico con effetto antiproliferativo documentato. Il basilico apporta eugenolo che inibisce l'angiogenesi tumorale. L'aglio contribuisce con allicina e organosolfurati.",stagione:"Pomodorino del Piennolo DOP: tutto l'anno (conservazione in grappolo). Melanzane: giugno-ottobre (stagionalita locale campana).",approfondimento:{nome:"Pomodorino del Piennolo del Vesuvio DOP",marchio:"DOP",descrizione:"Il Pomodorino del Piennolo del Vesuvio ha ottenuto la DOP nel 2009. Si coltiva sulle pendici del Vesuvio in terreni vulcanici. Il nome piennolo deriva dal dialettale appendere: i grappoli vengono legati e appesi in locali freschi dove maturano lentamente durante l'inverno senza refrigerazione. Il frutto contiene circa 25 mg/100 g di licopene, 3 volte superiore ai pomodori comuni, e una acidita naturale che lo rende eccellente per la conservazione."},ingChips:[{t:"Piennolo DOP",c:"dop"},{t:"Olio EVO DOP Sorrento",c:"dop"},{t:"Semola rimacinata",c:""},{t:"Melanzane km0",c:"km0"},{t:"Basilico km0",c:"km0"}]},

kis simplex, Reg. CE 853/2004). L'aria al limone viene preparata a temperatura ambiente — il calore degraderebbe il limonene volatile e la vitamina C termolabile.",antitumorale:"Il limonene della scorza del Limone di Sorrento IGP e tra i composti naturali piu studiati in oncologia: inibisce la farnesil-proteina transferasi. I pomodori apportano licopene e betacarotene. Il sesamo contiene lignani (sesaminolo, sesamolina) con documentata attivita antiproliferativa.",stagione:"Tonno: giugno-settembre (pesca Mediterraneo). Pomodoro e rucola: primavera-estate. Limone di Sorrento IGP: tutto l'anno, ottimale in inverno-primavera.",approfondimento:{nome:"Limone di Sorrento IGP",marchio:"IGP",descrizione:"Il Limone di Sorrento IGP e tra gli agrumi piu pregiati al mondo per la qualita della scorza. La cultivar Femminello Sorrentino produce frutti quasi tutto l'anno. La scorza, spessa fino a 9 mm, contiene ghiandole oleifere che rilasciano profumo intenso al minimo sfregamento. Il disciplinare IGP impone la raccolta manuale. La sua presenza garantisce qualita certificata, tracciabilita e tutela delle produzioni locali, elementi fondamentali nella valorizzazione del patrimonio agroalimentare italiano."},ingChips:[{t:"Tonno abbattuto km0",c:"km0"},{t:"Limone Sorrento IGP",c:"igp"},{t:"Olio EVO DOP",c:"dop"},{t:"Sesamo",c:""},{t:"Rucola km0",c:"km0"},{t:"Pomodori km0",c:"km0"}]},

let editorOpen = false;
let editorUnlocked = false;
let currentEditId = 0;

function toggleEditor() {
  if (!editorUnlocked) {
    const pwd = prompt('🔐 Inserisci la password per accedere all\'editor:');
    if (pwd !== 'Piennolo2030') {
      if (pwd !== null) alert('Password errata.');
      return;
    }
    editorUnlocked = true;
  }
  editorOpen = !editorOpen;
  document.getElementById('editor-sidebar').classList.toggle('open', editorOpen);
  document.getElementById('edit-fab').classList.toggle('active', editorOpen);
  if (editorOpen) buildEditorSelect();
}

function buildEditorSelect() {
  const sel = document.getElementById('editor-recipe-select');
  sel.innerHTML = data.map(r => `<option value="${r.id}">${r.numero}. ${r.title}</option>`).join('');
  sel.value = currentEditId;
  loadRecipeInEditor(currentEditId);
}

function loadRecipeInEditor(id) {
  currentEditId = id;
  const r = data.find(x => x.id === id);
  if (!r) return;
  const ex = extraData[id] || {};
  const appro = r.approfondimento || {};
  const adapt = ex.adattamenti || {};
  const sdgs  = sdgData[id] || [];
  const cats = [{v:'mare',l:'Mare & Pesce'},{v:'pasta',l:'Pasta & Cereali'},{v:'insalata',l:'Insalate'},{v:'legumi',l:'Legumi'},{v:'veg',l:'Verdure'}];
  const catOpts = cats.map(c => `<option value="${c.v}" ${r.cat===c.v?'selected':''}>${c.l}</option>`).join('');
  const marchiOpts = ['DOP','IGP','PAT','Presidio Slow Food'].map(m=>`<option value="${m}" ${appro.marchio===m?'selected':''}>${m}</option>`).join('');

        <div class="field-group" style="margin:0"><label>N° SDG</label><input type="number" id="ef-sdg-n-${i}" value="${s.n}" min="1" max="17"></div>

      </div>
      <div class="field-group" style="margin:0"><label>Descrizione collegamento</label><textarea id="ef-sdg-desc-${i}" style="min-height:70px">${esc(s.desc)}</textarea></div>
    </div>`).join('');

    <div class="field-sep"></div>
    <div class="field-section-title">🛒 Ingredienti (uno per riga)</div>

    <div class="field-sep"></div>
    <div class="field-section-title">⚠️ Allergeni</div>
    <div class="field-group"><input id="ef-allergeni" value="${esc(r.allergeni)}"></div>
    <div class="field-sep"></div>
    <div class="field-section-title">📊 Valori nutrizionali (per porzione)</div>
    <div class="macro-row">

      <div class="field-group"><label>Proteine g</label><input type="number" id="ef-prot" value="${r.macros.prot}"></div>
      <div class="field-group"><label>Carboidrati g</label><input type="number" id="ef-carb" value="${r.macros.carb}"></div>
      <div class="field-group"><label>Grassi g</label><input type="number" id="ef-grassi" value="${r.macros.grassi}"></div>

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

function applyEdits() {
  const r = data.find(x => x.id === currentEditId);
  if (!r) return;
  const id = currentEditId;

  // ── data[] fields ──
  r.title       = document.getElementById('ef-title').value.trim();
  r.chef        = document.getElementById('ef-chef').value.trim();
  const newCat  = document.getElementById('ef-cat').value;
  const catLabels = {mare:'Mare & Pesce',pasta:'Pasta & Cereali',insalata:'Insalate di Cereali',legumi:'Zuppe & Legumi',veg:'Verdure & Cereali'};
  r.cat         = newCat;
  r.catLabel    = catLabels[newCat] || newCat;
  r.porzioni    = document.getElementById('ef-porzioni').value.trim();
  r.note        = document.getElementById('ef-note').value.trim();
  r.ingredients = document.getElementById('ef-ing').value.split('\n').map(s=>s.trim()).filter(Boolean);
  r.allergeni   = document.getElementById('ef-allergeni').value.trim();
  r.macros.kcal = parseInt(document.getElementById('ef-kcal').value)||0;
  r.macros.prot = parseInt(document.getElementById('ef-prot').value)||0;
  r.macros.carb = parseInt(document.getElementById('ef-carb').value)||0;
  r.macros.grassi= parseInt(document.getElementById('ef-grassi').value)||0;
  r.procedimento= document.getElementById('ef-proc').value.trim();
  r.motivazione = document.getElementById('ef-motiv').value.trim();
  r.cottura     = document.getElementById('ef-cottura').value.trim();
  r.antitumorale= document.getElementById('ef-antitum').value.trim();
  r.stagione    = document.getElementById('ef-stagione').value.trim();

  // ── approfondimento ──
  r.approfondimento = {
    nome:       document.getElementById('ef-appro-nome').value.trim(),
    marchio:    document.getElementById('ef-appro-marchio').value,
    descrizione:document.getElementById('ef-appro-desc').value.trim()
  };

  // ── extraData fields ──
  if (!extraData[id]) extraData[id] = {};
  extraData[id].diabete = document.getElementById('ef-diabete').value.trim();
  extraData[id].adattamenti = {
    vegan:    document.getElementById('ef-adapt-vegan').value.trim(),
    lattosio: document.getElementById('ef-adapt-lattosio').value.trim(),
    celiaci:  document.getElementById('ef-adapt-celiaci').value.trim(),
    halal:    document.getElementById('ef-adapt-halal').value.trim(),
    kosher:   document.getElementById('ef-adapt-kosher').value.trim()
  };

  // ── sdgData fields ──
  const sdgs = sdgData[id] || [];
  sdgs.forEach((s,i) => {
    const nEl = document.getElementById(`ef-sdg-n-${i}`);
    const tEl = document.getElementById(`ef-sdg-titolo-${i}`);
    const dEl = document.getElementById(`ef-sdg-desc-${i}`);
    if (nEl) s.n      = parseInt(nEl.value)||s.n;
    if (tEl) s.titolo = tEl.value.trim();
    if (dEl) s.desc   = dEl.value.trim();
  });

  renderCards(currentCardFilter);
  renderSchede(currentSchedeFilter);
  buildEditorSelect();
  showToast('✓ Modifiche applicate!');
}

function deleteRecipe(id) {
  if (!confirm('Eliminare questa ricetta?')) return;
  data = data.filter(r => r.id !== id);
  currentEditId = data.length ? data[0].id : -1;
  renderCards(currentCardFilter);
  renderSchede(currentSchedeFilter);
  buildEditorSelect();
  showToast('Ricetta eliminata');
}

  const newId = Date.now();

/* ══════════════════════════════════════════════════
   DOWNLOAD HTML
══════════════════════════════════════════════════ */
function downloadHTML() {
  const serializedData     = JSON.stringify(data, null, 2).replace(/<\/script>/g, '<\\/script>');
  const serializedExtra    = JSON.stringify(extraData, null, 2).replace(/<\/script>/g, '<\\/script>');
  const serializedSdg      = JSON.stringify(sdgData, null, 2).replace(/<\/script>/g, '<\\/script>');
  let html = document.documentElement.outerHTML;
  // Replace data[]
  html = html.replace(
    /\/\* ══+ DATA ══+\*\/[\s\S]*?^];/m,
    `/* ${'═'.repeat(50)}\n   DATA\n${'═'.repeat(50)} */\nlet data = ${serializedData};`
  );
  // Replace extraData[]
  html = html.replace(
    /const extraData = \[[\s\S]*?^\];/m,
    `const extraData = ${serializedExtra};`
  );
  // Replace sdgData[]
  html = html.replace(
    /const sdgData = \[[\s\S]*?^\];/m,
    `const sdgData = ${serializedSdg};`
  );
  const blob = new Blob([html], {type:'text/html;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ricette_5ia.html';
  a.click();
  showToast('⬇ Download avviato!');
}

function toggleIng(btn) {
  const list = btn.nextElementSibling;
  const icon = btn.querySelector('.toggle-icon');
  list.classList.toggle('open');
  icon.classList.toggle('open');
}
function switchView(view, btn) {
  document.querySelectorAll('.view-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('view-'+view).classList.add('active');
  window.scrollTo({top:0, behavior:'smooth'});
  if (view === 'haccp') renderHaccp(currentHaccpFilter);
}

}
