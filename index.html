  {"diabete":"La spigola è pesce magro con pochissimi carboidrati: carico glicemico del pasto ≈ 4, ideale per diabetici. Il betacarotene delle carote migliora la funzione delle cellule beta pancreatiche. Per l'ipertensione: le carote sono ricche di potassio (320 mg/100 g); la cottura al cartoccio senza sale aggiunto riduce l'apporto sodico; il limone di Sorrento IGP può sostituire il sale come esaltatore di sapidità. Per l'aterosclerosi: l'olio EVO DOP apporta acido oleico e polifenoli cardioprotettivi; gli Omega-3 della spigola riducono i trigliceridi e aumentano le HDL.","adattamenti":{"vegan":"Sostituire la spigola con 300 g di tofu compatto marinato al limone, avvolto nel cartoccio con le stesse verdure (180°C, 15 min). Aggiungere alga nori sbriciolata per il sapore marino.","lattosio":"Il piatto è naturalmente privo di lattosio. Nessuna modifica necessaria.","celiaci":"Il piatto è naturalmente senza glutine. Verificare che tutti gli ingredienti non siano stati contaminati da glutine durante la produzione.","halal":"La spigola è halal. Tutti gli ingredienti sono naturalmente halal. Nessuna modifica necessaria.","kosher":"La spigola ha pinne e squame — è kosher. Il piatto è parve. Tutti gli ingredienti devono essere certificati kosher."},"haccp":{"fasi":[{"nome":"Ricezione spigola fresca","pericolo":"Biologico: Anisakis simplex, Listeria monocytogenes · Chimico: PCB, diossine, metalli pesanti (Pb, Cd) · Fisico: lische, residui di rete","ccp":true,"misura":"T ≤ 2°C al ricevimento; verifica organolettica (odore marino, carni compatte); ispezione visiva per Anisakis; certificato sanitario 853/2004; rifiutare se T > 4°C"},{"nome":"Stoccaggio a T controllata — frigorifero (CCP)","pericolo":"Biologico: moltiplicazione rapida Listeria e Vibrio a T > 4°C · Chimico: produzione istamina (enzimi batterici) · Fisico: contaminazione crociata da altri alimenti","ccp":true,"misura":"T ≤ 2°C; ripiano basso separato da altri alimenti; contenitore chiuso; consumare entro 24h; monitoraggio T con termometro certificato ogni 4h; registrazione su apposito registro"},{"nome":"Stoccaggio a T ambiente — dispensa (ingredienti non deperibili)","pericolo":"Biologico: muffe e insetti nell'olio EVO e nelle spezie in contenitori aperti · Chimico: irrancidimento dell'olio EVO per ossidazione in presenza di luce e calore · Fisico: contaminazione da polvere in contenitori non chiusi","ccp":false,"misura":"Olio EVO DOP in contenitore chiuso opaco a T ≤ 20°C lontano da fonti di calore; sale e spezie in contenitori ermetici; aglio in luogo asciutto e ventilato. Procedura FIFO: etichettare ogni confezione con data di apertura; posizionare i prodotti più vecchi davanti e i nuovi dietro; olio EVO: consumare entro 2 mesi dall'apertura"},{"nome":"Lavaggio e preparazione carote","pericolo":"Biologico: E. coli, Salmonella da suolo · Chimico: residui pesticidi organofosforati · Fisico: terriccio, sassolini residui","ccp":false,"misura":"Pelatura completa; lavaggio sotto acqua corrente potabile ≥ 30 sec; tagliere dedicato verdure"},{"nome":"Assemblaggio cartoccio","pericolo":"Biologico: contaminazione crociata da mani o superfici · Fisico: frammenti di carta forno non alimentare · Chimico: nessuno specifico","ccp":false,"misura":"Usare solo carta forno certificata per alimenti; guanti monouso; superfici sanificate"},{"nome":"Cottura in forno 180°C (18–20 min)","pericolo":"Biologico: sopravvivenza Anisakis e Listeria · Chimico: nessuno significativo · Fisico: nessuno","ccp":true,"misura":"T interna ≥ 63°C per ≥ 15 sec; termometro a sonda obbligatorio; forno pre-riscaldato; non aprire il cartoccio prima del tempo"},{"nome":"Servizio","pericolo":"Biologico: ricontaminazione post-cottura · Chimico: nessuno · Fisico: lische residue nel filetto","ccp":false,"misura":"Servire immediatamente a T > 65°C; verificare assenza lische prima di servire; utensili puliti e dedicati"}]}},
  {"diabete":"Il riso integrale bio ha IG ≈ 50, significativamente più basso del riso bianco. I capperi di Pantelleria contengono quercetina che migliora la sensibilità insulinica. Per l'ipertensione: l'olio EVO Sorrentino DOP riduce la pressione sistolica; le olive di Gaeta DOP apportano acido oleico cardioprotettivo; attenzione al sodio dei capperi e delle olive — dissalare accuratamente. Per l'aterosclerosi: l'olio EVO DOP apporta oleocantale; l'Omega-3 dell'orata riduce i trigliceridi; l'aglio di Nubia IGP abbassa il colesterolo LDL.","adattamenti":{"vegan":"Sostituire l'orata con 200 g di tofu affumicato o tempeh + 1 cucchiaio di alga nori per il sapore marino. Tutti gli altri ingredienti sono già vegani.","lattosio":"Il piatto è naturalmente privo di lattosio. Nessuna modifica.","celiaci":"Il piatto è naturalmente senza glutine. Verificare la certificazione GF di tutti i prodotti in scatola.","halal":"L'orata è halal. Verificare che le olive non siano conservate con alcol.","kosher":"L'orata ha pinne e squame — è kosher. Il piatto è parve. Tutti gli ingredienti devono essere certificati kosher."},"haccp":{"fasi":[{"nome":"Ricezione orata fresca FAO 37","pericolo":"Biologico: Anisakis simplex, Listeria, Vibrio parahaemolyticus · Chimico: metalli pesanti, PCB · Fisico: squame residue, ami da pesca","ccp":true,"misura":"T ≤ 2°C; occhi brillanti e convessi, branchie rosse, odore marino; certificato FAO 37; ispezione visiva Anisakis; consumare entro 24h"},{"nome":"Stoccaggio a T controllata — frigorifero (CCP)","pericolo":"Biologico: moltiplicazione Listeria monocytogenes (cresce anche a 4°C), Vibrio · Chimico: ossidazione Omega-3 (irrancidimento) · Fisico: contaminazione crociata tra pesce e altri alimenti","ccp":true,"misura":"Pesce a T ≤ 2°C separato; altri ingredienti a T ≤ 4°C; olive e capperi in contenitori chiusi; monitoraggio T 2 volte/turno con registrazione; no contatto diretto pesce-verdure"},{"nome":"Stoccaggio a T ambiente — dispensa (ingredienti non deperibili)","pericolo":"Biologico: insetti nel riso integrale in confezioni aperte; muffe sulle lattine in ambienti umidi · Chimico: ossidazione dell'olio EVO DOP; irrancidimento del riso integrale in confezioni aperte · Fisico: corpi estranei nel riso sfuso","ccp":false,"misura":"Riso integrale in contenitore ermetico a T ≤ 20°C; olio EVO DOP in contenitore opaco chiuso; olive e capperi a T ambiente in contenitori chiusi prima dell'apertura. Procedura FIFO: etichettare con data di apertura; riso: consumare entro 12 mesi; olio EVO: entro 2 mesi dall'apertura; verificare settimanalmente assenza di insetti"},{"nome":"Dissalatura capperi di Pantelleria","pericolo":"Biologico: Listeria nel sale · Chimico: eccesso sodio residuo · Fisico: residui di sale grosso nei piatti","ccp":true,"misura":"Immersione in acqua fredda ≤ 10°C per 20 min; cambiare acqua 2 volte; non dissalare a T ambiente; assaggiare prima di usare"},{"nome":"Cottura orata in padella","pericolo":"Biologico: sopravvivenza Anisakis e Listeria · Chimico: ossidazione olio EVO ad alta T · Fisico: schizzi di olio bollente","ccp":true,"misura":"T interna ≥ 63°C per 1 min; sonda; olio EVO a T ≤ 180°C; padella pre-riscaldata"},{"nome":"Cottura riso integrale e raffreddamento","pericolo":"Biologico: Bacillus cereus (spore resistenti alla cottura) · Chimico: nessuno · Fisico: corpi estranei nel riso crudo","ccp":true,"misura":"Ebollizione ≥ 100°C; raffreddamento rapido a ≤ 10°C entro 90 min; abbattitore o bagno ghiacciato; non lasciare a T ambiente"},{"nome":"Assemblaggio e servizio","pericolo":"Biologico: ricontaminazione · Chimico: nessuno · Fisico: squame, lische residue","ccp":false,"misura":"Verificare lische; superfici sanificate; servire entro 15 min dall'assemblaggio; T > 60°C"}]}},
  {"diabete":"Le cicerchie PAT hanno IG < 30 e GL ≈ 5 per porzione. L'orzo aggiunge beta-glucani che rallentano l'assorbimento del glucosio. Per l'ipertensione: i friarielli PAT sono ricchi di potassio e calcio; le noci di Sorrento PAT contengono arginine precursore dell'ossido nitrico vasodilatatore. Per l'aterosclerosi: le noci di Sorrento PAT apportano Omega-3 ALA, vitamina E e fitosteroli che riducono il colesterolo LDL.","adattamenti":{"vegan":"Il piatto è già completamente vegano. Verificare che il sale iodato non contenga additivi di origine animale.","lattosio":"Il piatto è naturalmente privo di lattosio. Nessuna modifica.","celiaci":"L'orzo contiene glutine. Sostituire con riso integrale (200 g) o quinoa (200 g).","halal":"Il piatto è naturalmente halal. Tutti gli ingredienti vegetali sono permessi.","kosher":"Il piatto è parve e naturalmente kosher. Verificare che l'olio EVO abbia certificazione kosher."},"haccp":{"fasi":[{"nome":"Ammollo cicerchie 24h (CCP CRITICO)","pericolo":"Biologico: muffe, aflatossine · Chimico: ODAP (beta-N-ossalil-aminoalanina) neurotossina · Fisico: pietre, sassolini, frammenti vegetali","ccp":true,"misura":"Ammollo MINIMO 24h in acqua fredda in frigorifero ≤ 4°C; cambiare acqua ogni 8h (almeno 3 volte); selezionare visivamente eliminando sassolini; eliminare tutta l'acqua di ammollo"},{"nome":"Cottura cicerchie ≥ 60 min (CCP)","pericolo":"Biologico: lectine fitoemagglutinine residue · Chimico: ODAP residua se cottura insufficiente · Fisico: nessuno","ccp":true,"misura":"Ebollizione vigorosa ≥ 100°C per ≥ 60 min in acqua non salata; verificare completa tenerezza al morso; eliminare l'acqua di cottura"},{"nome":"Stoccaggio a T controllata — frigorifero (CCP)","pericolo":"Biologico: Bacillus cereus (spore termoresistenti nei cereali e legumi cotti) · Chimico: nessuno · Fisico: contaminazione da contenitori non idonei","ccp":true,"misura":"Raffreddamento rapido a ≤ 10°C entro 90 min; conservare in contenitori alimentari chiusi in frigorifero; consumare entro 24h"},{"nome":"Stoccaggio a T ambiente — dispensa (ingredienti non deperibili)","pericolo":"Biologico: insetti (tonchio) nelle cicerchie secche in ambienti umidi; muffe nei legumi con umidità > 14% · Chimico: ossidazione dell'olio EVO DOP; aflatossine nelle cicerchie mal conservate · Fisico: sassolini e impurità nelle cicerchie sfuse","ccp":false,"misura":"Cicerchie secche in contenitore ermetico a T ≤ 20°C e umidità < 60%; olio EVO in contenitore opaco chiuso; orzo in contenitore ermetico. Procedura FIFO: etichettare con data di apertura; cicerchie: consumare entro 12 mesi; ispezionare mensilmente per insetti; olio EVO: entro 2 mesi dall'apertura"},{"nome":"Lavaggio verdure crude (zucchine, finocchio)","pericolo":"Biologico: E. coli O157, Salmonella · Chimico: pesticidi organofosforati e carbammati · Fisico: insetti, terriccio","ccp":false,"misura":"Lavaggio in acqua corrente; immersione in acqua con bicarbonato 5 min; risciacquo; tagliere dedicato verdure"},{"nome":"Assemblaggio ciotola e servizio","pericolo":"Biologico: contaminazione crociata · Chimico: ossidazione noci (Omega-3 sensibili) · Fisico: gusci di noce residui","ccp":false,"misura":"Noci aggiunte a crudo all'ultimo; verificare assenza frammenti di guscio; consumare entro 2h a T ambiente o 24h in frigorifero"}]}},
  {"diabete":"Il risotto con zucchine km0 ha un carico glicemico moderato (GL ≈ 22). Per l'ipertensione: lo speck contiene sodio — non aggiungere sale durante la cottura; le zucchine ricche di potassio bilanciano l'effetto pressorio. Per l'aterosclerosi: la quantità ridotta di speck (25 g/porzione) limita l'esposizione ai grassi saturi e ai nitriti; il parmigiano stagionato apporta calcio con effetti positivi sulla pressione arteriosa.","adattamenti":{"vegan":"Omettere lo speck, sostituire il parmigiano con lievito alimentare (2 cucchiai). Aggiungere 50 g di pomodori secchi sott'olio e 30 g di noci tostate.","lattosio":"Omettere il parmigiano o sostituire con parmigiano stagionato ≥ 24 mesi (naturalmente privo di lattosio). Lo speck non contiene lattosio.","celiaci":"Il piatto è naturalmente senza glutine. Verificare che lo speck non contenga additivi con glutine.","halal":"Lo speck è prodotto da carne di maiale — NON è halal. Sostituire con 80 g di bresaola di manzo o pollo affumicato halal.","kosher":"Lo speck è prodotto da maiale — NON è kosher. Sostituire con bresaola di manzo kosher certificata. Omettere il parmigiano."},"haccp":{"fasi":[{"nome":"Ricezione speck Alto Adige IGP","pericolo":"Biologico: Listeria monocytogenes (carne affumicata ad alto rischio) · Chimico: nitriti/nitrati residui (conservanti), ammine biogene · Fisico: frammenti di osso o cartilagine","ccp":true,"misura":"T ≤ 4°C; integrità confezione sigillata; data scadenza; aspetto (colore rosso-marrone uniforme, no mucillagine); certificato produttore"},{"nome":"Stoccaggio a T controllata — frigorifero (CCP)","pericolo":"Biologico: Listeria monocytogenes (cresce a 4°C nelle carni affumicate) · Chimico: irrancidimento grassi saturi · Fisico: assorbimento odori da altri alimenti","ccp":true,"misura":"T ≤ 4°C; speck in contenitore chiuso separato da verdure e latticini; parmigiano in involucro originale; monitoraggio T ogni 4h; consumare entro 3 giorni dall'apertura"},{"nome":"Stoccaggio a T ambiente — dispensa (ingredienti non deperibili)","pericolo":"Biologico: insetti nel riso carnaroli; muffe sull'aglio in ambienti umidi · Chimico: ossidazione dell'olio EVO; deterioramento del vino bianco in bottiglia aperta · Fisico: corpi estranei nel riso sfuso","ccp":false,"misura":"Riso carnaroli in contenitore ermetico a T ≤ 20°C; olio EVO in contenitore opaco; vino bianco in frigorifero dopo apertura (consumare entro 3 giorni). Procedura FIFO: etichettare con data di apertura; riso: consumare entro 12 mesi; olio EVO: entro 2 mesi dall'apertura"},{"nome":"Soffritto cipolla","pericolo":"Biologico: nessuno significativo · Chimico: formazione acroleina se cipolla brucia (T > 210°C) · Fisico: nessuno","ccp":false,"misura":"Fuoco moderato; T olio ≤ 180°C; cipolla deve appassire (dorata) non annerire"},{"nome":"Tostatura riso e cottura risotto","pericolo":"Biologico: Bacillus cereus (spore termoresistenti nel riso) · Chimico: nessuno · Fisico: corpi estranei nel riso crudo","ccp":true,"misura":"Tostatura 2 min a fuoco vivo; mantenere ebollizione leggera costante T ≥ 85°C per tutta la cottura; consumare entro 2h"},{"nome":"Aggiunta speck e mantecatura","pericolo":"Biologico: ricontaminazione Listeria da speck · Chimico: nitriti a T elevata formano nitrosammine · Fisico: frammenti","ccp":true,"misura":"Lo speck viene aggiunto a metà cottura (T > 80°C); non surriscaldare (T < 120°C per i nitriti); servire immediatamente"},{"nome":"Servizio","pericolo":"Biologico: zona di pericolo termico · Chimico: nessuno · Fisico: nessuno","ccp":false,"misura":"Servire immediatamente a T > 65°C; non conservare risotto mantecato oltre 2h"}]}},
  {"diabete":"Il pesce spada ha GL ≈ 1 (praticamente nullo). I crostini integrali aggiungono fibre che abbassano il carico glicemico. Per l'ipertensione: il pesce spada è naturalmente a basso sodio; il limone di Sorrento IGP può sostituire completamente il sale come condimento. Per l'aterosclerosi: gli Omega-3 DHA ed EPA del pesce spada riducono i trigliceridi; l'acido oleico dell'olio EVO è cardioprotettivo.","adattamenti":{"vegan":"Alternativa: tartare di avocado con capperi, limone IGP e pomodorini su crostini integrali. Oppure tartare di barbabietola rossa con senape e erba cipollina.","lattosio":"Il piatto è naturalmente privo di lattosio. Nessuna modifica.","celiaci":"Sostituire il pane integrale con pane di riso o mais certificato GF. Verificare che la senape non contenga amido di frumento.","halal":"Il pesce spada è halal. Tutti gli altri ingredienti sono halal. Nessuna modifica.","kosher":"Il pesce spada ha pinne e squame — è kosher. Il piatto è parve."},"haccp":{"fasi":[{"nome":"Verifica abbattimento pesce spada (CCP ASSOLUTO)","pericolo":"Biologico: Anisakis simplex (letale se ingerito vivo nel crudo) · Chimico: mercurio (bioaccumulatore — limite UE 1 mg/kg) · Fisico: frammenti di lisca nel filetto tritato","ccp":true,"misura":"OBBLIGATORIO per legge (Reg. CE 853/2004): certificato abbattimento a -18°C per ≥ 24h; rifiutare assolutamente se non certificato; documentazione conservata 3 anni; non servire a donne incinte (mercurio)"},{"nome":"Scongelamento controllato (CCP)","pericolo":"Biologico: moltiplicazione batterica rapida nella zona di pericolo (4–60°C) · Chimico: ossidazione lipidi Omega-3 · Fisico: perdita di consistenza","ccp":true,"misura":"Scongelare SOLO in frigorifero a ≤ 4°C per max 24h; mai a T ambiente; mai in acqua calda; usare entro 4h dallo scongelamento completo; non ricongelare"},{"nome":"Stoccaggio a T controllata — frigorifero/abbattitore (CCP)","pericolo":"Biologico: Listeria monocytogenes, Pseudomonas · Chimico: istamina (enzimi batterici attivi anche a basse T) · Fisico: contaminazione crociata da altri alimenti","ccp":true,"misura":"T ≤ -18°C per pesce ancora abbattuto; T ≤ 2°C per pesce scongelato; separazione assoluta da altri alimenti; consumare entro 4h dallo scongelamento"},{"nome":"Stoccaggio a T ambiente — dispensa (ingredienti non deperibili)","pericolo":"Biologico: insetti nel pane integrale in confezioni aperte; muffe nell'olio se esposto a luce · Chimico: ossidazione dell'olio EVO in contenitori trasparenti · Fisico: frammenti di confezioni danneggiate nella senape o nei capperi","ccp":false,"misura":"Pane integrale in sacchetto chiuso a T ≤ 20°C; olio EVO in contenitore opaco; capperi in confezione chiusa lontano dalla luce. Procedura FIFO: etichettare con data di apertura; pane aperto: consumare entro 3 giorni o congelare; olio EVO: entro 2 mesi dall'apertura"},{"nome":"Tritatura al coltello (preparazione tartare)","pericolo":"Biologico: contaminazione da superfici e mani · Chimico: residui detergenti su tagliere · Fisico: frammenti metallici da lama coltello, lische residue","ccp":true,"misura":"Tagliere e coltello DEDICATI e sanificati con soluzione ipoclorito 200 ppm; guanti monouso; ispezione visiva per lische; lama coltello integra"},{"nome":"Assemblaggio e servizio immediato (CCP)","pericolo":"Biologico: moltiplicazione rapida su pesce crudo a T ambiente · Chimico: ossidazione lipidi al contatto con aria · Fisico: frammenti di capperi non dissalati","ccp":true,"misura":"Servire ENTRO 10 MINUTI dall'assemblaggio; T piatto ≤ 10°C (piatti refrigerati); non conservare tartare già preparata"}]}},
  {"diabete":"I piselli novelli sorrentini hanno IG ≈ 35 e la pasta integrale IG ≈ 42. GL del piatto ≈ 20. Le alici di Cetara apportano Omega-3 che migliorano la sensibilità insulinica. Per l'ipertensione: le alici di Cetara vanno dissalate MOLTO accuratamente; le noci di Sorrento PAT apportano arginine che producono ossido nitrico vasodilatatore. Per l'aterosclerosi: gli Omega-3 delle alici di Cetara abbassano i trigliceridi; le noci PAT apportano acido linoleico.","adattamenti":{"vegan":"Sostituire le alici con 2 cucchiai di pasta di miso + 20 g di capperi dissalati. Aumentare la granella di noci per compensare gli Omega-3.","lattosio":"Il piatto è naturalmente privo di lattosio. Nessuna modifica.","celiaci":"Sostituire la pasta integrale con pasta di riso integrale o di legumi.","halal":"Le alici sono halal. Tutti gli altri ingredienti sono naturalmente halal.","kosher":"Le alici hanno pinne e squame — sono kosher. Il piatto è parve."},"haccp":{"fasi":[{"nome":"Ricezione e dissalatura alici di Cetara","pericolo":"Biologico: Listeria nel sale; istamina (Engraulidae ad alto rischio) · Chimico: sodio in eccesso, istamina chimica · Fisico: lische, residui di sale grosso","ccp":true,"misura":"Immersione in acqua fredda ≤ 10°C per 30 min; cambiare acqua 2 volte; non dissalare a T ambiente; verificare aspetto (carne soda, colore argenteo)"},{"nome":"Stoccaggio a T controllata — frigorifero (CCP)","pericolo":"Biologico: Listeria nelle alici; muffe nei piselli freschi · Chimico: istamina nelle alici se T non controllata · Fisico: contaminazione da contenitori","ccp":true,"misura":"Alici dissalate in contenitore chiuso a ≤ 4°C; piselli in sacchetto aperto in frigorifero; consumare entro 12h; mai mescolare alici e piselli crudi nello stesso contenitore"},{"nome":"Stoccaggio a T ambiente — dispensa (ingredienti non deperibili)","pericolo":"Biologico: insetti nella pasta integrale in confezioni danneggiate; muffe sull'olio EVO DOP aperto · Chimico: irrancidimento del germe di grano nella pasta integrale; ossidazione olio EVO · Fisico: corpi estranei in confezioni mal sigillate","ccp":false,"misura":"Pasta integrale in contenitore ermetico a T ≤ 20°C; olio EVO DOP in contenitore opaco chiuso; noci di Sorrento PAT in sacchetto chiuso al riparo dalla luce. Procedura FIFO: pasta integrale aperta: consumare entro 3 mesi (il germe si ossida rapidamente); olio EVO: entro 2 mesi; noci: verificare odore fresco prima dell'uso"},{"nome":"Soffritto cipollotto e cottura piselli","pericolo":"Biologico: Listeria sui piselli crudi · Chimico: formazione composti volatili se cipollotto brucia · Fisico: insetti, terriccio nei piselli","ccp":false,"misura":"Lavare i piselli; fuoco dolce per il cipollotto; cottura piselli 8 min a T ≥ 85°C"},{"nome":"Cottura pasta integrale al dente","pericolo":"Biologico: nessuno significativo · Chimico: nessuno · Fisico: corpi estranei nella pasta cruda","ccp":false,"misura":"Ispezionare visivamente la pasta; acqua a forte ebollizione; colino pulito per scolare"},{"nome":"Mantecatura e aggiunta alici fuori fuoco (CCP)","pericolo":"Biologico: istamina nelle alici aumenta se riscaldate oltre 60°C · Chimico: istamina si forma rapidamente nelle alici a T ambiente · Fisico: lische residue nelle alici","ccp":true,"misura":"Aggiungere le alici ESCLUSIVAMENTE fuori fuoco (T < 50°C); verificare assenza lische prima di aggiungere; servire entro 5 min"},{"nome":"Servizio con noci di Sorrento PAT","pericolo":"Biologico: muffe aflatossigene nelle noci · Chimico: ossidazione Omega-3 (noci rancide) · Fisico: frammenti di guscio nelle noci","ccp":false,"misura":"Verificare aspetto noci (colore chiaro, odore fresco); assaggiare prima di usare; verificare assenza frammenti di guscio"}]}},
  {"diabete":"La seppia è il mollusco con il più basso contenuto calorico (72 kcal/100 g) e GL ≈ 3 — ideale per diabetici. Le zucchine San Pasquale PAT hanno IG ≈ 15. Per l'ipertensione: la seppia è a bassissimo contenuto di sodio naturale; il prezzemolo è ricco di potassio (800 mg/100 g). Per l'aterosclerosi: l'inchiostro di seppia contiene melanina e taurina con proprietà antiossidanti che riducono l'ossidazione delle LDL.","adattamenti":{"vegan":"Non è possibile replicare la seppia con ingredienti vegani. Alternativa: funghi portobello ripieni con zucchine San Pasquale PAT, pane integrale e noci. Stesso sugo di pomodorini Piennolo DOP.","lattosio":"Il piatto è naturalmente privo di lattosio. Nessuna modifica.","celiaci":"Sostituire il pane grattugiato integrale con pane di riso grattugiato GF.","halal":"La seppia è considerata halal dalla maggior parte delle scuole islamiche. Il vino bianco va sostituito con brodo vegetale + aceto bianco.","kosher":"La seppia (cefalopode) NON è kosher. Sostituire con involtini di merluzzo o nasello ripieni con le stesse verdure."},"haccp":{"fasi":[{"nome":"Ricezione seppie fresche","pericolo":"Biologico: Vibrio parahaemolyticus, Listeria monocytogenes · Chimico: metalli pesanti (cadmio nei molluschi cefalopodi) · Fisico: osso di seppia residuo, residui di rete da pesca","ccp":true,"misura":"T ≤ 2°C; sacca integra, colore bianco-lilla, odore marino fresco; certificato sanitario; consumare entro 24h; rifiutare se T > 4°C"},{"nome":"Stoccaggio a T controllata — frigorifero (CCP)","pericolo":"Biologico: Vibrio (cresce rapidamente sopra 5°C), Salmonella Enteritidis nelle uova · Chimico: produzione di cadaverina e putrescina (ammine biogene) in seppie non fresche · Fisico: rottura delle uova con contaminazione","ccp":true,"misura":"Seppie a T ≤ 2°C; uova a T ≤ 4°C in contenitore separato con guscio integro; consumare seppie entro 24h; uova entro 7 giorni; monitoraggio T ogni 4h"},{"nome":"Stoccaggio a T ambiente — dispensa (ingredienti non deperibili)","pericolo":"Biologico: muffe sul pane grattugiato in confezioni aperte; insetti nell'olio EVO · Chimico: irrancidimento del pane grattugiato integrale esposto all'aria; ossidazione olio EVO · Fisico: corpi estranei in confezioni di pane grattugiato mal sigillate","ccp":false,"misura":"Pane grattugiato in contenitore ermetico a T ≤ 20°C; olio EVO in contenitore opaco chiuso; vino bianco in luogo fresco. Procedura FIFO: pane grattugiato aperto: consumare entro 2 settimane; olio EVO: entro 2 mesi; etichettare con data di apertura"},{"nome":"Pulizia seppie e preparazione ripieno","pericolo":"Biologico: Salmonella da uova crude nel ripieno · Chimico: inchiostro (melanina) · Fisico: becco corneo della seppia, osso di seppia","ccp":true,"misura":"Eliminare completamente il becco; rimuovere l'osso di seppia; guanti; uova fresche < 7 giorni; lavare mani dopo contatto con uova crude"},{"nome":"Farcitura e chiusura con stuzzicadenti","pericolo":"Biologico: contaminazione crociata da mani · Fisico: stuzzicadenti — rischio ingestione se non rimossi prima del servizio · Chimico: nessuno","ccp":false,"misura":"Contare gli stuzzicadenti usati e verificarne la rimozione TUTTI prima di servire; guanti monouso"},{"nome":"Cottura brasatura 35 min (CCP)","pericolo":"Biologico: sopravvivenza Salmonella (uova nel ripieno) e Vibrio · Chimico: nessuno significativo · Fisico: stuzzicadenti lasciati","ccp":true,"misura":"T interna ripieno ≥ 75°C per ≥ 2 min; ebollizione leggera costante; rimuovere TUTTI gli stuzzicadenti prima del servizio"},{"nome":"Servizio","pericolo":"Biologico: raffreddamento eccessivo · Chimico: nessuno · Fisico: stuzzicadenti residui","ccp":false,"misura":"Servire a T > 65°C; verifica finale stuzzicadenti; consumare entro 2h"}]}},
  {"diabete":"Il farro integrale ha IG ≈ 35, il più basso tra i cereali, e GL ≈ 12 per porzione. Lo sgombro non contiene carboidrati. Per l'ipertensione: lo sgombro al naturale è a basso contenuto di sodio; i pomodorini apportano potassio; il condimento a base di limone sostituisce il sale. Per l'aterosclerosi: lo sgombro è il pesce con la più alta concentrazione di Omega-3 (2,2 g/100 g) che abbassano i trigliceridi fino al 30%.","adattamenti":{"vegan":"Lo sgombro al naturale può essere sostituito con 200 g di tofu affumicato o 3 cucchiai di alga nori sbriciolata + 30 g di semi di chia per gli Omega-3 vegetali.","lattosio":"Il piatto è naturalmente privo di lattosio. Nessuna modifica.","celiaci":"Il farro contiene glutine. Sostituire con riso integrale (250 g) o quinoa (250 g). Verificare GF dello sgombro in scatola.","halal":"Lo sgombro è halal. Tutti gli altri ingredienti sono naturalmente halal.","kosher":"Lo sgombro ha pinne e squame — è kosher. Il piatto è parve."},"haccp":{"fasi":[{"nome":"Ammollo farro integrale (8h)","pericolo":"Biologico: moltiplicazione batterica nell'acqua di ammollo a T ambiente · Chimico: acido fitico (antinutriente) · Fisico: pietre e corpi estranei nel farro","ccp":true,"misura":"Ammollo in frigorifero a ≤ 4°C; selezionare visivamente il farro prima dell'ammollo; cambiare l'acqua a metà; non ammollare mai a T ambiente oltre 1h"},{"nome":"Ricezione sgombro al naturale (scatola)","pericolo":"Biologico: Clostridium botulinum (lattine danneggiate) · Chimico: istamina (Scombridae) · Fisico: frammenti metallici da lattina danneggiata","ccp":true,"misura":"Rifiutare lattine rigonfie, arrugginite o ammaccate profondamente; verifica data scadenza; registro lotto"},{"nome":"Stoccaggio a T controllata — frigorifero (CCP)","pericolo":"Biologico: Bacillus cereus nel farro cotto (spore termoresistenti) · Chimico: ossidazione Omega-3 nel sgombro aperto · Fisico: contaminazione da utensili","ccp":true,"misura":"Farro: raffreddamento rapido a ≤ 10°C entro 90 min; sgombro aperto: coprire con pellicola e usare entro 30 min; non mescolare farro caldo con sgombro freddo"},{"nome":"Stoccaggio a T ambiente — dispensa (ingredienti non deperibili)","pericolo":"Biologico: insetti (Sitophilus granarius) nel farro integrale sfuso; muffe nelle lattine di sgombro in ambienti umidi · Chimico: irrancidimento del farro integrale in confezioni aperte; ossidazione olio EVO · Fisico: sassolini nel farro sfuso; frammenti di confezioni danneggiate","ccp":false,"misura":"Farro integrale in contenitore ermetico a T ≤ 20°C e umidità < 60%; lattine di sgombro in luogo fresco e asciutto; olio EVO in contenitore opaco chiuso. Procedura FIFO: farro aperto: consumare entro 6 mesi; lattine: verificare integrità mensile; olio EVO: entro 2 mesi dall'apertura"},{"nome":"Cottura farro (45 min)","pericolo":"Biologico: inattivazione contaminanti superficiali · Chimico: perdita vitamina B se cottura eccessiva · Fisico: corpi estranei","ccp":true,"misura":"Ebollizione ≥ 100°C per 45 min; scolare; ispezionare visivamente il farro cotto"},{"nome":"Assemblaggio e condimento a freddo","pericolo":"Biologico: contaminazione crociata da utensili · Chimico: ossidazione olio EVO se esposto a luce · Fisico: spine residue nello sgombro","ccp":false,"misura":"Verificare assenza spine nel sgombro; superfici sanificate; olio EVO in contenitore opaco; consumare entro 24h in frigorifero"}]}},
  {"diabete":"Il riso integrale ha IG ≈ 50. Gamberi, cozze e vongole non contengono carboidrati. Per l'ipertensione: le cozze sono naturalmente a basso sodio; limitare il sale aggiunto; il prezzemolo abbondante apporta potassio. Per l'aterosclerosi: i molluschi hanno bassissimo contenuto di colesterolo; il selenio delle cozze attiva la glutatione perossidasi che riduce l'ossidazione delle LDL.","adattamenti":{"vegan":"Sostituire gamberi, cozze e vongole con 300 g di funghi misti + alga wakame reidratata. Usare brodo di alghe (kombu) al posto del brodo di pesce.","lattosio":"Il piatto è naturalmente privo di lattosio. Nessuna modifica.","celiaci":"Il riso è naturalmente GF. Verificare che il brodo di pesce non contenga additivi con glutine.","halal":"I gamberi sono considerati halal dalla maggior parte delle scuole islamiche. Le cozze e le vongole variano per scuola — verificare.","kosher":"I crostacei (gamberi) e i molluschi (cozze, vongole) NON sono kosher. Sostituire con pesce kosher (merluzzo, salmone, tonno) a pezzi."},"haccp":{"fasi":[{"nome":"Ricezione cozze e vongole vive","pericolo":"Biologico: Vibrio parahaemolyticus, norovirus, biotossine algali (ASP, PSP) · Chimico: metalli pesanti, diossine, PCB · Fisico: sabbia, conchiglie rotte, corpi estranei","ccp":true,"misura":"Bivalvi vivi (gusci chiusi o che si richiudono); etichetta CE con zona raccolta e data; T ≤ 6°C; zona FAO certificata; rifiutare se aperti e che non si richiudono"},{"nome":"Stoccaggio a T controllata — frigorifero (CCP)","pericolo":"Biologico: Vibrio (raddoppia ogni 9 min a 37°C); morte dei bivalvi se T non corretta · Chimico: produzione biotossine · Fisico: gusci rotti con contaminazione incrociata","ccp":true,"misura":"Bivalvi vivi a T 4–6°C in retino forato (devono respirare); gamberetti a T ≤ 2°C; consumare entro 24h; monitoraggio T ogni 4h"},{"nome":"Stoccaggio a T ambiente — dispensa (ingredienti non deperibili)","pericolo":"Biologico: insetti nel riso integrale; muffe nell'aglio in ambienti umidi · Chimico: ossidazione olio EVO; produzione di composti volatili nel vino bianco aperto a T ambiente · Fisico: corpi estranei nel riso sfuso","ccp":false,"misura":"Riso integrale in contenitore ermetico a T ≤ 20°C; olio EVO in contenitore opaco; vino bianco in frigorifero dopo apertura. Procedura FIFO: riso: consumare entro 12 mesi; olio EVO: entro 2 mesi; vino bianco aperto: entro 3 giorni in frigorifero"},{"nome":"Apertura cozze e vongole a fuoco vivo (CCP)","pericolo":"Biologico: sopravvivenza Vibrio e norovirus se T insufficiente · Chimico: biotossine parzialmente termolabili · Fisico: sabbia nel liquido di apertura","ccp":true,"misura":"Fuoco VIVO per ≥ 3 min; scartare tutti i bivalvi che NON si aprono; filtrare il liquido con colino a maglie fini"},{"nome":"Ricezione gamberetti freschi","pericolo":"Biologico: Salmonella, Vibrio · Chimico: solfiti (conservante — dichiarazione obbligatoria in etichetta) · Fisico: crostacei interi (antenne, chele)","ccp":true,"misura":"T ≤ 2°C; verifica etichetta solfiti; aspetto (carne traslucida, no annerimento della testa); consumare entro 24h"},{"nome":"Cottura risotto con frutti di mare (CCP)","pericolo":"Biologico: sopravvivenza patogeni nei gamberetti · Chimico: nessuno · Fisico: gusci residui di vongole","ccp":true,"misura":"T ≥ 85°C costante; gamberetti aggiunti negli ULTIMI 3 min (T interna ≥ 65°C); verificare assenza gusci nei molluschi sgusciati"},{"nome":"Servizio","pericolo":"Biologico: zona di pericolo termico · Chimico: nessuno · Fisico: gusci residui","ccp":false,"misura":"Servire immediatamente a T > 65°C; ispezione visiva finale per gusci; no riscaldamento multiplo"}]}},
  {"diabete":"I broccoli baresi hanno IG ≈ 10 e la pasta integrale IG ≈ 42. GL del piatto ≈ 16. Il sulforafano dei broccoli migliora la sensibilità insulinica a livello cellulare. Per l'ipertensione: i broccoli sono ricchi di potassio (316 mg/100 g) e magnesio; il peperoncino contiene capsaicina con effetto vasodilatatorio. Per l'aterosclerosi: i broccoli contengono luteina e zeaxantina antiossidanti; il provolone del Monaco DOP stagionato apporta CLA cardioprotettivo in piccole quantità.","adattamenti":{"vegan":"Omettere il provolone del Monaco DOP, sostituire con 2 cucchiai di lievito alimentare in scaglie + 1 cucchiaio di pasta di miso bianco.","lattosio":"Sostituire il provolone del Monaco con parmigiano reggiano stagionato ≥ 24 mesi (privo di lattosio per fermentazione completa) o con lievito alimentare.","celiaci":"Sostituire le pennette integrali con pasta integrale di riso o mais certificata GF.","halal":"Il provolone del Monaco DOP deve essere prodotto con caglio halal. Tutti gli altri ingredienti sono naturalmente halal.","kosher":"Il piatto con provolone del Monaco è lattisinio (milchig). Non servire con carne."},"haccp":{"fasi":[{"nome":"Ricezione broccoli baresi freschi","pericolo":"Biologico: Listeria superficiale, larve di insetti (bruchi tra le cimette) · Chimico: pesticidi organofosforati · Fisico: insetti, terriccio, frammenti di foglie esterne","ccp":false,"misura":"Ispezione visiva accurata tra le cimette; lavaggio in acqua corrente; immersione in acqua salata 10 min; scolare e risciacquare"},{"nome":"Stoccaggio a T controllata — frigorifero (CCP)","pericolo":"Biologico: Listeria monocytogenes nel formaggio a pasta semidura · Chimico: ammoniaca da broccoli sovra-maturi · Fisico: muffa nel formaggio mal conservato","ccp":true,"misura":"Broccoli in sacchetto forato a T ≤ 4°C; usare entro 3 giorni; provolone del Monaco avvolto in carta forno a T ≤ 8°C; separati in frigorifero; verificare assenza muffe"},{"nome":"Stoccaggio a T ambiente — dispensa (ingredienti non deperibili)","pericolo":"Biologico: insetti nella pasta integrale in confezioni danneggiate; muffe sull'aglio in ambienti umidi · Chimico: irrancidimento del germe di grano nella pasta integrale; ossidazione olio EVO · Fisico: frammenti di confezione nella pasta","ccp":false,"misura":"Pasta integrale in contenitore ermetico a T ≤ 20°C; olio EVO in contenitore opaco chiuso; aglio in luogo asciutto ventilato. Procedura FIFO: pasta integrale aperta: consumare entro 3 mesi; olio EVO: entro 2 mesi; etichettare con data di apertura"},{"nome":"Lavaggio e taglio broccoli","pericolo":"Biologico: E. coli da contaminazione crociata · Chimico: residui detergenti su tagliere · Fisico: residui di terriccio","ccp":false,"misura":"Tagliere DEDICATO per verdure; coltello sanificato; lavaggio mani"},{"nome":"Cottura broccoli nella stessa acqua della pasta (CCP)","pericolo":"Biologico: inattivazione contaminanti · Chimico: degradazione glucosinolati (sulforafano) con cottura prolungata · Fisico: nessuno","ccp":true,"misura":"Cottura MASSIMO 6–8 min al dente; broccoli devono restare verde brillante; aggiungere la pasta nell'acqua DEI broccoli"},{"nome":"Mantecatura e aggiunta provolone del Monaco (CCP)","pericolo":"Biologico: Listeria nel formaggio se non raggiunge T sufficiente · Chimico: nessuno · Fisico: occhi del formaggio possono essere duri","ccp":true,"misura":"La pasta scolata deve essere a T ≥ 75°C per sciogliere il provolone e inattivare Listeria; grattugiare finemente; servire immediatamente"},{"nome":"Servizio","pericolo":"Biologico: raffreddamento rapido · Chimico: nessuno · Fisico: nessuno","ccp":false,"misura":"Servire a T > 65°C; non conservare la pasta già mantecata con formaggio oltre 2h"}]}},
  {"diabete":"Le cicerchie di Capri PAT hanno IG < 30, il più basso tra tutti i legumi. L'amido della pasta mista viene rallentato nella sua digestione dalle fibre delle cicerchie (GL ≈ 15). Per l'ipertensione: la zuppa è naturalmente a basso contenuto di sodio; il rosmarino contiene acido rosmarinico con effetto inibitorio dell'ACE. Per l'aterosclerosi: le fibre solubili delle cicerchie riducono il colesterolo LDL del 10-15% se consumati regolarmente.","adattamenti":{"vegan":"Il piatto è già completamente vegano. Verificare che il brodo vegetale non contenga estratti di carne.","lattosio":"Il piatto è naturalmente privo di lattosio. Nessuna modifica.","celiaci":"Sostituire la pasta mista con pasta mista di riso o mais certificata GF.","halal":"Il piatto è naturalmente halal.","kosher":"Il piatto è parve e naturalmente kosher."},"haccp":{"fasi":[{"nome":"Ammollo cicerchie di Capri PAT 24h (CCP CRITICO)","pericolo":"Biologico: muffe, aflatossine · Chimico: ODAP (beta-N-ossalil-L-aminoalanina — neurotossina responsabile del latirismo) · Fisico: pietre, sassolini frequenti nelle cicerchie secche","ccp":true,"misura":"Selezione visiva OBBLIGATORIA; ammollo MINIMO 24h in acqua fredda in frigorifero ≤ 4°C; cambiare acqua almeno 3 volte; eliminare TUTTA l'acqua di ammollo"},{"nome":"Cottura cicerchie 60–70 min senza sale (CCP CRITICO)","pericolo":"Biologico: lectine fitoemagglutinine tossiche residue · Chimico: ODAP residua se cottura insufficiente · Fisico: nessuno","ccp":true,"misura":"Ebollizione VIGOROSA ≥ 100°C per i PRIMI 10 MIN; poi sobbollire per ≥ 60 min totali; NON salare durante la cottura; verificare completa tenerezza"},{"nome":"Stoccaggio a T controllata — frigorifero (CCP)","pericolo":"Biologico: Bacillus cereus (germinazione spore nel raffreddamento lento dei legumi) · Chimico: nessuno · Fisico: frammenti di sassolini sfuggiti alla selezione","ccp":true,"misura":"Raffreddamento rapido a ≤ 10°C entro 90 min; contenitore chiuso in frigorifero; consumare entro 24h; non lasciare cicerchie cotte a T ambiente"},{"nome":"Stoccaggio a T ambiente — dispensa (ingredienti non deperibili)","pericolo":"Biologico: insetti (Callosobruchus — tonchio) nelle cicerchie secche; muffe sull'aglio in ambienti umidi · Chimico: ossidazione dell'olio EVO; formazione di prodotti di degradazione nella pasta integrale in confezioni aperte · Fisico: sassolini nelle cicerchie sfuse; corpi estranei nella pasta mal sigillata","ccp":false,"misura":"Cicerchie secche in contenitore ermetico a T ≤ 20°C e umidità < 60%; pasta integrale in contenitore ermetico; olio EVO in contenitore opaco chiuso. Procedura FIFO: cicerchie: verificare mensilmente per insetti; consumare entro 12 mesi; olio EVO: entro 2 mesi; pasta: entro 3 mesi dall'apertura"},{"nome":"Soffritto aglio e rosmarino + pomodori","pericolo":"Biologico: Listeria su verdure crude · Chimico: acroleina se aglio brucia (T > 200°C) · Fisico: residui di terriccio su rosmarino","ccp":false,"misura":"Fuoco moderato; aglio deve dorare non annerire; rosmarino lavato"},{"nome":"Cottura pasta nella zuppa","pericolo":"Biologico: proliferazione se zuppa si raffredda · Chimico: nessuno · Fisico: corpi estranei nella pasta","ccp":false,"misura":"Mantenere leggera ebollizione costante; pasta aggiunta nella zuppa bollente; consumare subito"},{"nome":"Tostatura crostini di segale e servizio","pericolo":"Biologico: nessuno · Chimico: acrilammide nel pane tostato eccessivamente · Fisico: nessuno","ccp":true,"misura":"Tostatura a T ≤ 180°C; colore dorato non scuro; olio EVO esclusivamente a crudo nel piatto finale; servire a T ≥ 75°C"}]}},
  {"diabete":"I tagliolini freschi all'uovo hanno IG ≈ 55. La panna riduce leggermente l'assorbimento dei carboidrati. Per l'ipertensione: il limone di Sorrento IGP è ricco di potassio e vitamina C; ridurre il sale al minimo (la scorza di limone insaporisce senza sodio); ridurre il burro a 20 g per 4 porzioni. Per l'aterosclerosi: il burro contiene grassi saturi — limitare a 10 g/porzione; il limonene del limone IGP inibisce la HMG-CoA reduttasi riducendo la sintesi epatica del colesterolo.","adattamenti":{"vegan":"Sostituire burro con margarina non idrogenata; sostituire panna con panna di cocco o latte di avena; sostituire parmigiano con lievito alimentare. Per i tagliolini usare quelli senza uovo.","lattosio":"Sostituire burro con olio EVO (30 g); sostituire panna con panna di riso o avena; omettere il parmigiano o usare parmigiano stagionato ≥ 24 mesi.","celiaci":"Sostituire i tagliolini con spaghetti di riso o pasta GF. La salsa al limone è naturalmente GF.","halal":"Il burro è halal se di origine bovina. La panna è halal. Il parmigiano è halal se prodotto con caglio non suino.","kosher":"Il piatto è lattisinio (milchig) con burro, panna e parmigiano. Non servire con carne. Tutti i latticini devono essere kosher certificati."},"haccp":{"fasi":[{"nome":"Ricezione tagliolini freschi all'uovo","pericolo":"Biologico: Salmonella Enteritidis (uova crude nell'impasto) · Chimico: nessuno significativo · Fisico: corpi estranei nell'impasto (frammenti di guscio)","ccp":true,"misura":"Conservare a ≤ 4°C; verifica data scadenza; aspetto (colore giallo uniforme, no muffe); verificare assenza frammenti di guscio"},{"nome":"Stoccaggio a T controllata — frigorifero (CCP)","pericolo":"Biologico: Salmonella nei tagliolini; Listeria nel burro; batteri nella panna aperta · Chimico: irrancidimento grassi a T eccessiva · Fisico: assorbimento odori da altri alimenti","ccp":true,"misura":"Tagliolini a T ≤ 4°C in contenitore chiuso; panna a T ≤ 4°C; burro a T ≤ 4°C lontano da alimenti odorosi; consumare entro le scadenze; monitoraggio T ogni 4h"},{"nome":"Stoccaggio a T ambiente — dispensa (ingredienti non deperibili)","pericolo":"Biologico: insetti nei tagliolini secchi in confezioni danneggiate; muffe nelle erbe aromatiche secche in ambienti umidi · Chimico: irrancidimento del burro se lasciato a T ambiente troppo a lungo; ossidazione olio EVO · Fisico: frammenti di confezione nella pasta secca","ccp":false,"misura":"Tagliolini secchi (se usati) in contenitore chiuso a T ≤ 20°C; burro sempre in frigorifero; olio EVO in contenitore opaco. Procedura FIFO: tagliolini secchi: consumare entro 6 mesi dall'apertura; etichettare con data apertura"},{"nome":"Scioglimento burro con erbe (fuoco basso)","pericolo":"Biologico: E. coli e Salmonella sulle erbe aromatiche fresche · Chimico: acroleina e aldeidi tossiche se il burro brucia (T > 130°C) · Fisico: rametti di timo non rimossi","ccp":true,"misura":"Lavare le erbe aromatiche; T burro ≤ 120°C (colore giallo paglierino — MAI marrone); fuoco bassissimo"},{"nome":"Cottura tagliolini freschi","pericolo":"Biologico: inattivazione Salmonella (T interna > 70°C) · Chimico: nessuno · Fisico: agglomerazione tagliolini","ccp":true,"misura":"Acqua a FORTE ebollizione; cottura 2–3 min; mescolare subito; non sovraccaricare la pentola"},{"nome":"Aggiunta limone IGP e mantecatura fuori fuoco","pericolo":"Biologico: nessuno significativo · Chimico: acido citrico può reagire con metalli di padelle non idonee · Fisico: semi di limone nel succo","ccp":false,"misura":"Usare padelle in acciaio inox o antiaderente; filtrare il succo di limone; aggiungere sempre fuori fuoco"},{"nome":"Servizio","pericolo":"Biologico: raffreddamento rapido fuori dalla zona sicura · Chimico: nessuno · Fisico: nessuno","ccp":false,"misura":"Servire IMMEDIATAMENTE in piatti pre-riscaldati; non conservare i tagliolini già conditi; T > 65°C"}]}},
  {"diabete":"I fagioli di Controne PAT hanno IG ≈ 25 e GL ≈ 6 per porzione. La zuppa densa di fagioli e scarola è il piatto con il migliore profilo antiglicemico tra tutte le ricette. Per l'ipertensione: è il piatto ideale per la dieta DASH: fagioli, scarola e olio EVO apportano potassio, magnesio e flavonoidi che abbassano la pressione sistolica. Per l'aterosclerosi: le fibre solubili dei fagioli di Controne PAT si legano ai sali biliari riducendo il colesterolo LDL del 10-15%.","adattamenti":{"vegan":"Il piatto è già completamente vegano. Verificare che il pane di segale non contenga strutto o latticini nell'impasto.","lattosio":"Il piatto è naturalmente privo di lattosio. Omettere il parmigiano facoltativo o usare parmigiano stagionato ≥ 24 mesi.","celiaci":"Il pane di segale contiene glutine. Sostituire con pane di riso o mais integrale certificato GF.","halal":"Il piatto è naturalmente halal. Verificare che il pane di segale non contenga additivi non permessi.","kosher":"Il piatto è parve e naturalmente kosher."},"haccp":{"fasi":[{"nome":"Ammollo fagioli di Controne PAT (12h)","pericolo":"Biologico: muffe, aflatossine nei fagioli mal conservati · Chimico: lectine fitoemagglutinine (PHA) — tossiche nel fagiolo crudo · Fisico: pietre, sassolini, frammenti vegetali","ccp":true,"misura":"Selezione visiva obbligatoria; ammollo 12h in acqua fredda in frigorifero ≤ 4°C; cambiare acqua 2 volte; eliminare i fagioli galleggianti"},{"nome":"Cottura fagioli di Controne (50–60 min) — CCP","pericolo":"Biologico: lectine PHA residue se cottura insufficiente (nausea e vomito entro 3h) · Chimico: nessuno · Fisico: sassolini sfuggiti alla selezione","ccp":true,"misura":"Ebollizione VIGOROSA per i PRIMI 10 MINUTI (fondamentale per distruggere le lectine PHA); poi sobbollire per ≥ 50 min; NON salare durante la cottura; verificare completa tenerezza al morso"},{"nome":"Stoccaggio a T controllata — frigorifero (CCP)","pericolo":"Biologico: Bacillus cereus nei fagioli cotti (spore termoresistenti che germinano a 10–50°C) · Chimico: ossidazione della scarola (annerimento) · Fisico: contaminazione da contenitori non alimentari","ccp":true,"misura":"Raffreddamento rapido fagioli a ≤ 10°C entro 90 min; contenitore chiuso alimentare; scarola fresca in frigorifero separata; consumare entro 24h"},{"nome":"Stoccaggio a T ambiente — dispensa (ingredienti non deperibili)","pericolo":"Biologico: insetti (Callosobruchus — tonchio dei legumi) nei fagioli secchi; muffe sull'aglio in ambienti umidi · Chimico: ossidazione olio EVO; perossidi nel pane di segale in confezioni aperte · Fisico: sassolini nei fagioli sfusi; corpi estranei nel pane di segale","ccp":false,"misura":"Fagioli secchi in contenitore ermetico a T ≤ 20°C e umidità < 60%; pane di segale in sacchetto chiuso; olio EVO in contenitore opaco. Procedura FIFO: fagioli: verificare mensilmente per insetti; consumare entro 12 mesi; pane di segale: consumare entro 3 giorni dall'apertura o surgelare a -18°C; olio EVO: entro 2 mesi"},{"nome":"Sbollentatura scarola riccia","pericolo":"Biologico: E. coli e batteri superficiali sulla scarola · Chimico: riduzione ossalati · Fisico: insetti, residui di terriccio tra le foglie","ccp":true,"misura":"Lavaggio ABBONDANTE sotto acqua corrente sfogliando le foglie; sbollentare in acqua bollente 2–3 min; raffreddare immediatamente in acqua ghiacciata; strizzare bene"},{"nome":"Tostatura pane di segale","pericolo":"Biologico: nessuno (pane è già cotto) · Chimico: acrilammide (composto cancerogeno nella crosta scura) · Fisico: nessuno","ccp":true,"misura":"Tostatura a T MASSIMA 180°C; colore dorato NON scuro o bruciato; tempo ≤ 8–10 min"},{"nome":"Assemblaggio zuppa e servizio","pericolo":"Biologico: zona di pericolo termico · Chimico: nessuno · Fisico: frammenti di crosta di pane duri","ccp":false,"misura":"Servire a T ≥ 75°C; olio EVO rigorosamente a crudo nel piatto finito; non conservare oltre 2h a T ambiente"}]}},
  {"diabete":"La pasta di semola rimacinata ha IG ≈ 45 se cotta al dente. Il Pomodorino del Piennolo DOP è a basso contenuto di zuccheri semplici. Per l'ipertensione: i pomodorini apportano potassio (237 mg/100 g) e licopene che riduce la rigidità arteriosa; le melanzane contengono nasunina con effetto vasodilatatorio. Per l'aterosclerosi: l'olio EVO DOP Sorrento apporta oleocantale con effetto antinfiammatorio. Evitare eccessivo consumo dell'olio di frittura.","adattamenti":{"vegan":"Il piatto è già completamente vegano. Verificare che la semola non contenga additivi di origine animale.","lattosio":"Il piatto è naturalmente privo di lattosio. Nessuna modifica.","celiaci":"Il piatto contiene glutine (semola). Non adatto a celiaci nella versione originale. Sostituire con pasta di riso o mais gluten-free.","halal":"Il piatto è naturalmente halal. L'olio di girasole e gli ingredienti vegetali non hanno restrizioni.","kosher":"Il piatto è parve e naturalmente kosher."},"haccp":{"fasi":[{"nome":"Ricezione semola e pomodorini del Piennolo DOP","pericolo":"Biologico: aflatossine nella semola umida mal conservata; muffe tossigene su pomodorini ammaccati · Chimico: residui di pesticidi; micotossine · Fisico: sassolini nella semola sfusa; frammenti di imballaggio","ccp":false,"misura":"Semola in confezione integra e asciutta; pomodorini sodi senza ammaccature; preferire DOP certificati; verifica lotto e scadenza"},{"nome":"Stoccaggio a T controllata — frigorifero (pasta fresca)","pericolo":"Biologico: proliferazione batterica sulla pasta fresca (Aw > 0.95) · Chimico: nessuno · Fisico: contaminazione crociata da altri alimenti","ccp":true,"misura":"Pasta fresca a T ≤ 4°C; consumare entro 2h dalla preparazione oppure abbattere a -18°C; mai lasciare pasta fresca a T ambiente oltre 30 min"},{"nome":"Stoccaggio a T ambiente — dispensa (ingredienti non deperibili)","pericolo":"Biologico: insetti nella semola in confezioni danneggiate; muffe sull'aglio in ambienti umidi · Chimico: ossidazione olio EVO; degradazione olio di girasole in contenitori non chiusi · Fisico: corpi estranei nella semola sfusa","ccp":false,"misura":"Semola in contenitore ermetico a T ≤ 20°C; olio EVO in contenitore opaco chiuso; olio girasole in luogo fresco. Procedura FIFO: semola aperta: consumare entro 3 mesi; olio EVO: entro 2 mesi; ruotare le scorte"},{"nome":"Impasto e formatura scialatielli","pericolo":"Biologico: contaminazione da superfici non sanificate; batteri da mani non lavate · Chimico: residui di detergente su piano lavoro · Fisico: frammenti di gioielli o unghie nell'impasto","ccp":false,"misura":"Piano lavoro sanificato; lavaggio mani; non indossare anelli/bracciali; lavorazione rapida (< 20 min)"},{"nome":"Frittura melanzane (T olio 175°C)","pericolo":"Biologico: inattivazione batteri superficiali · Chimico: degradazione termica olio (acroleina, composti polari totali CPT > 25% D.Lgs. 183/2003) · Fisico: schizzi olio caldo per umidità melanzane","ccp":true,"misura":"T olio monitorata con termometro a sonda (175°C ± 5°C); asciugare melanzane prima di friggerle; sostituire olio dopo 3 cicli o se scurisce/fuma; scolare immediatamente su carta assorbente"},{"nome":"Cottura salsa e pasta","pericolo":"Biologico: contaminazione crociata tra pasta cruda e salsa · Chimico: nessuno · Fisico: corpi estranei nella pasta","ccp":false,"misura":"Acqua a forte ebollizione; colino pulito; mantecare subito; servire a T > 65°C"},{"nome":"Impiattamento e servizio","pericolo":"Biologico: raffreddamento rapido in zona pericolo · Chimico: nessuno · Fisico: nessuno","ccp":false,"misura":"Servire immediatamente; aggiungere melanzane croccanti nel piatto al momento del servizio; non mantenere in caldo oltre 20 min"}]}},
  {"diabete":"Il tonno è privo di carboidrati: GL = 0. Le verdure di accompagnamento hanno IG bassissimo. Per l'ipertensione: il tonno è ricco di potassio e Omega-3 che abbassano la pressione sistolica; il limone di Sorrento IGP apporta bioflavonoidi con effetto ACE-inibitore. Attenzione al sesamo: è ricco di sodio. Per l'aterosclerosi: gli Omega-3 EPA e DHA del tonno riducono i trigliceridi plasmatici fino al 30% e aumentano le HDL.","adattamenti":{"vegan":"Sostituire il tonno con 2 x 150 g di melanzane grigliate in crosta di sesamo + 100 g di tofu affumicato a fette. L'aria al limone rimane identica.","lattosio":"Il piatto è naturalmente privo di lattosio. Nessuna modifica.","celiaci":"Il piatto è naturalmente senza glutine. Verificare che la lecitina di soia non contenga tracce di glutine.","halal":"Il tonno è halal. Tutti gli altri ingredienti sono naturalmente halal.","kosher":"Il tonno è kosher (ha pinne e squame). Il piatto è parve."},"haccp":{"fasi":[{"nome":"Ricezione tonno fresco (abbattuto a -18°C)","pericolo":"Biologico: Anisakis simplex (larve parassitarie) nel tonno non abbattuto; istamina (Scombridae — alto rischio) · Chimico: PCB e mercurio · Fisico: frammenti di lisca nel filetto","ccp":true,"misura":"Verifica certificato abbattimento -18°C/24h; T ricezione ≤ -18°C; carne rosso rubino compatta, odore marino neutro; candling per Anisakis; rifiutare se T > -15°C o odore anomalo"},{"nome":"Stoccaggio a T controllata — frigorifero (scongelamento)","pericolo":"Biologico: proliferazione batterica e formazione di istamina se scongelamento avviene a T > 4°C · Chimico: ossidazione Omega-3 con produzione di perossidi · Fisico: lische che si ammorbidiscono","ccp":true,"misura":"Scongelamento in frigorifero a ≤ 4°C per 12–18h; mai a T ambiente; usare entro 6h dallo scongelamento; contenitore chiuso nel ripiano inferiore"},{"nome":"Stoccaggio a T ambiente — dispensa (ingredienti non deperibili)","pericolo":"Biologico: muffe sulla lecitina di soia in confezioni aperte; insetti nei semi di sesamo sfusi · Chimico: ossidazione olio EVO; irrancidimento sesamo in confezioni aperte · Fisico: corpi estranei nei semi di sesamo sfusi","ccp":false,"misura":"Lecitina di soia in contenitore ermetico; sesamo in contenitore chiuso a T ≤ 20°C lontano da fonti di calore; olio EVO in contenitore opaco. Procedura FIFO: sesamo aperto: consumare entro 3 mesi; olio EVO: entro 2 mesi; etichettare con data apertura"},{"nome":"Preparazione aria al limone (a freddo)","pericolo":"Biologico: contaminazione da minipimer non sanificato · Chimico: nessuno · Fisico: schizzi durante l'emulsificazione","ccp":false,"misura":"Minipimer sanificato; usare l'aria entro 30 min; non esporre a T > 20°C (la schiuma collassa)"},{"nome":"Panatura in sesamo e scottatura tonno (45–60 sec/lato)","pericolo":"Biologico: temperatura interna insufficiente per l'interno rosa (non richiesto se il pesce è stato abbattuto) · Chimico: acroleina se sesamo brucia · Fisico: lische residue nel filetto","ccp":true,"misura":"Padella a T massima (> 220°C); 45–60 sec per lato; l'esterno deve essere sigillato e il sesamo dorato non scuro; ispezionare il filetto per lische prima della panatura"},{"nome":"Impiattamento e servizio","pericolo":"Biologico: contaminazione crociata tra tonno e verdure crude · Chimico: nessuno · Fisico: nessuno","ccp":false,"misura":"Utensili separati per verdure e tonno; servire entro 5 min; aggiungere l'aria al limone nell'ultimo momento"}]}},
  {"diabete":"La seppia non contiene carboidrati: GL = 0. Le zucchine hanno IG ≈ 15. Le noci migliorano la sensibilità insulinica. Per l'ipertensione: la seppia è ricca di potassio e povera di sodio; i polifenoli dell'olio EVO DOP Terra di Bari riducono la pressione sistolica. Per l'aterosclerosi: l'olio EVO DOP apporta oleocantale e oleaceina con effetti antinfiammatori documentati; i fitosteroli delle noci riducono l'assorbimento intestinale del colesterolo.","adattamenti":{"vegan":"Sostituire la seppia con 300 g di cuori di palma tagliati a listarelle e brevemente marinati in succo di limone + alga nori sbriciolata per il sapore marino. Omettere il Parmigiano dal pesto (sostituire con 2 cucchiai di lievito alimentare).","lattosio":"Omettere il Parmigiano Reggiano DOP dal pesto o sostituire con Parmigiano stagionato ≥ 24 mesi (naturalmente privo di lattosio). Il resto del piatto è naturalmente privo di lattosio.","celiaci":"Il piatto è naturalmente senza glutine. Verificare che il Parmigiano DOP non contenga addensanti con glutine.","halal":"La seppia è halal nella maggior parte delle scuole islamiche. Tutti gli altri ingredienti sono naturalmente halal.","kosher":"La seppia (mollusco) NON è kosher. Sostituire con 500 g di filetti di merluzzo o halibut cotti al vapore e tagliati a striscioline."},"haccp":{"fasi":[{"nome":"Ricezione seppie fresche","pericolo":"Biologico: Vibrio parahaemolyticus e batteri putrefattivi; Anisakis simplex · Chimico: metalli pesanti bioaccumulati · Fisico: residui di sabbia e conchiglie nell'addome","ccp":true,"misura":"T ricezione ≤ 2°C; odore marino fresco neutro; colore bianco-rosato; rifiutare se odore di ammoniaca o colore grigiastro; verificare pulizia interna"},{"nome":"Stoccaggio a T controllata — frigorifero (CCP)","pericolo":"Biologico: Vibrio (psicrotrofo, cresce fino a 0°C) e Listeria · Chimico: ossidazione proteica · Fisico: gocciolamento su altri alimenti","ccp":true,"misura":"T 0–2°C in contenitore ermetico; ripiano inferiore dedicato al pesce; consumare entro 24h; non tenere a T ambiente oltre 30 min"},{"nome":"Stoccaggio a T ambiente — dispensa (ingredienti non deperibili)","pericolo":"Biologico: muffe sulle noci in confezioni aperte; insetti nell'olio EVO in contenitori non chiusi · Chimico: irrancidimento noci per ossidazione degli Omega-3; ossidazione olio EVO DOP · Fisico: frammenti di guscio nelle noci sfuse","ccp":false,"misura":"Noci in contenitore ermetico a T ≤ 20°C lontano da fonti di calore e luce; olio EVO in contenitore opaco chiuso; Parmigiano in frigorifero. Procedura FIFO: noci aperte: consumare entro 1 mese; olio EVO: entro 2 mesi dall'apertura; etichettare con data"},{"nome":"Sbianchitura seppie (1–2 min acqua bollente) — CCP","pericolo":"Biologico: Vibrio e Listeria; inattivazione richiede T interna ≥ 70°C · Chimico: nessuno · Fisico: residui di sabbia e conchiglie","ccp":true,"misura":"Acqua a ebollizione ≥ 100°C; immersione 1–2 min da ripresa bollore; le seppie devono diventare bianche opache; raffreddare immediatamente in acqua ghiacciata"},{"nome":"Preparazione carpaccio zucchine e pesto a freddo","pericolo":"Biologico: Listeria sulle superfici tagliate delle zucchine · Chimico: ossidazione del pesto a T ambiente · Fisico: frammenti di guscio nelle noci; schegge dalla mandolina","ccp":false,"misura":"Mandolina pulita (guanti antitaglio); zucchine in contenitore chiuso a ≤ 4°C se non usate subito; pesto in contenitore chiuso con pellicola a contatto"},{"nome":"Assemblaggio e conservazione a freddo — CCP","pericolo":"Biologico: proliferazione batterica (Listeria, Vibrio) nel piatto assemblato a T > 4°C · Chimico: ossidazione degli acidi grassi delle noci · Fisico: frammenti di guscio non rilevati","ccp":true,"misura":"T cucina < 20°C durante assemblaggio; servire entro 30 min dall'assemblaggio; se conservato: contenitore chiuso a ≤ 4°C; non superare 2h a T ambiente"},{"nome":"Servizio","pericolo":"Biologico: contaminazione post-preparazione · Chimico: nessuno · Fisico: frammenti di guscio di noce residui","ccp":false,"misura":"Ispezionare visivamente ogni porzione; utensili dedicati; servire su piatti freddi (non riscaldati)"}]}}
];

let currentHaccpFilter = 'all';
function buildHaccpDiagram(fasi) {
  // Classify fasi into categories
  const ricezione   = fasi.find(f => f.nome.toLowerCase().includes('ricezion'));
  const stocRef     = fasi.find(f => f.nome.toLowerCase().includes('stoccaggio') && !f.nome.toLowerCase().includes('dispensa'));
  const stocDisp    = fasi.find(f => f.nome.toLowerCase().includes('dispensa'));
  const remaining   = fasi.filter(f => f !== ricezione && f !== stocRef && f !== stocDisp);

  // Layout constants
  const W = 620, BW = 170, BH = 38, BRX = 6;
  const CX = W/2;       // center x
  const LX = 150;       // left branch center x (T controllata)
  const RX = 450;       // right branch center x (T non controllata)
  const COLORS = { ccp:'#e74c3c', cp:'#2C3E50', fifo:'#e67e22', text:'#1a1a2e' };

  let y = 20;
  let svgContent = '';

  // helper: wrap text into lines
  function wrapText(txt, maxW, fontSize) {
    const words = txt.split(' ');
    const lines = []; let cur = '';
    const charPx = fontSize * 0.55;
    words.forEach(w => {
      const test = cur ? cur+' '+w : w;
      if (test.length * charPx > maxW - 10) { lines.push(cur); cur = w; }
      else cur = test;
    });
    if (cur) lines.push(cur);
    return lines;
  }

  // helper: draw box (rect or ellipse)
  function box(cx, cy, w, h, label, color, shape='rect', badge='') {
    const lines = wrapText(label, w, 10);
    const lineH = 13;
    const textH = lines.length * lineH;
    const bh = Math.max(h, textH + 14);
    let el = '';
    if (shape === 'ellipse') {
      el = `<ellipse cx="${cx}" cy="${cy}" rx="${w/2}" ry="${bh/2}" fill="white" stroke="${color}" stroke-width="1.5"/>`;
    } else {
      el = `<rect x="${cx-w/2}" y="${cy-bh/2}" width="${w}" height="${bh}" rx="${BRX}" fill="white" stroke="${color}" stroke-width="${color===COLORS.ccp?2:1.5}" stroke-dasharray="${badge==='fifo'?'5,3':'none'}"/>`;
    }
    const ty = cy - (lines.length-1)*lineH/2;
    const textEls = lines.map((l,i)=>`<text x="${cx}" y="${ty + i*lineH}" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="${COLORS.text}" font-weight="${color===COLORS.ccp?'600':'400'}">${l}</text>`).join('');
    let badgeEl = '';
    if (badge) {
      const bc = badge==='ccp'?COLORS.ccp : badge==='fifo'?COLORS.fifo : COLORS.cp;
      const bl = badge==='ccp'?'CCP' : badge==='fifo'?'CP·FIFO' : 'CP';
      badgeEl = `<rect x="${cx+w/2-32}" y="${cy-bh/2-1}" width="32" height="13" rx="2" fill="${bc}"/>
        <text x="${cx+w/2-16}" y="${cy-bh/2+9}" text-anchor="middle" font-family="Arial,sans-serif" font-size="7.5" fill="white" font-weight="700">${bl}</text>`;
    }
    return { svg: el+textEls+badgeEl, h: bh };
  }

  // helper: vertical arrow
  function arrow(x, y1, y2) {
    return `<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2-6}" stroke="#888" stroke-width="1.2"/>
      <polygon points="${x-4},${y2-6} ${x+4},${y2-6} ${x},${y2}" fill="#888"/>`;
  }
  // helper: horizontal line
  function hline(x1,x2,y) {
    return `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="#888" stroke-width="1.2"/>`;
  }
  // helper: vertical line (no arrow)
  function vline(x,y1,y2) {
    return `<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="#888" stroke-width="1.2"/>`;
  }

  // ── INGREDIENTI (oval top) ──
  const ingredH = 30;
  svgContent += box(CX, y+ingredH/2, 160, ingredH, 'INGREDIENTI', COLORS.cp, 'ellipse').svg;
  y += ingredH;

  // arrow down to ricezione
  svgContent += arrow(CX, y, y+25);
  y += 25;

  // ── RICEZIONE ──
  const rNome = ricezione ? ricezione.nome.toUpperCase() : 'RICEZIONE MATERIE PRIME';
  const rBadge = ricezione ? (ricezione.ccp ? 'ccp' : 'cp') : 'ccp';
  const rColor = ricezione?.ccp ? COLORS.ccp : COLORS.cp;
  const rBox = box(CX, y+BH/2, BW*1.4, BH, rNome, rColor, 'rect', rBadge);
  svgContent += rBox.svg;
  y += rBox.h;

  // ── SPLIT to two branches ──
  // horizontal line from center to left and right
  const splitY = y + 20;
  svgContent += vline(CX, y, splitY);
  svgContent += hline(LX, RX, splitY);
  svgContent += arrow(LX, splitY, splitY+20);
  svgContent += arrow(RX, splitY, splitY+20);
  y = splitY + 20;

  // ── LEFT BRANCH: stoccaggio T controllata ──
  const sNome = stocRef ? stocRef.nome.replace('Stoccaggio a T controllata — ','').replace('Stoccaggio refrigerato','Stoccaggio a T controllata').toUpperCase() : 'STOCCAGGIO A T CONTROLLATA';
  const sBox = box(LX, y+BH/2, BW, BH, sNome, COLORS.ccp, 'rect', 'ccp');
  svgContent += sBox.svg;
  const leftBranchEndY = y + sBox.h;

  // ── RIGHT BRANCH: stoccaggio T non controllata ──
  const dNome = stocDisp ? 'STOCCAGGIO A T NON CONTROLLATA (DISPENSA)' : 'STOCCAGGIO A T NON CONTROLLATA';
  const dBox = box(RX, y+BH/2, BW, BH, dNome, COLORS.fifo, 'rect', 'fifo');
  svgContent += dBox.svg;
  const rightBranchEndY = y + dBox.h;

  // optional scongelamento under left branch
  const maxBranchY = Math.max(leftBranchEndY, rightBranchEndY);
  const joinY = maxBranchY + 35;

  // arrows from branches down to join
  svgContent += vline(LX, leftBranchEndY, joinY);
  svgContent += vline(RX, rightBranchEndY, joinY);
  svgContent += hline(LX, RX, joinY);
  svgContent += arrow(CX, joinY, joinY+20);
  y = joinY + 20;

  // ── REMAINING PHASES ──
  remaining.forEach((f, fi) => {
    const fNome = f.nome.toUpperCase();
    const fColor = f.ccp ? COLORS.ccp : COLORS.cp;
    const fBadge = f.ccp ? 'ccp' : (f.nome.includes('dispensa') ? 'fifo' : 'cp');
    const fBox = box(CX, y+BH/2, BW*1.5, BH, fNome, fColor, 'rect', fBadge);
    svgContent += fBox.svg;
    y += fBox.h;
    // arrow (not after last)
    if (fi < remaining.length - 1) {
      svgContent += arrow(CX, y, y+18);
      y += 18;
    }
  });

  // ── SOMMINISTRAZIONE ──
  svgContent += arrow(CX, y, y+22);
  y += 22;
  const somBox = box(CX, y+BH/2, BW*1.3, BH, 'SOMMINISTRAZIONE', COLORS.cp, 'rect', 'cp');
  svgContent += somBox.svg;
  y += somBox.h;

  // ── PIATTO DA CONSUMARE (oval) ──
  svgContent += arrow(CX, y, y+20);
  y += 20;
  const finalH = 30;
  svgContent += box(CX, y+finalH/2, 160, finalH, 'PIATTO DA CONSUMARE', COLORS.cp, 'ellipse').svg;
  y += finalH + 15;

  return `<svg viewBox="0 0 ${W} ${y}" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width:620px;display:block;margin:0 auto;font-family:Arial,sans-serif">${svgContent}</svg>`;
}

function renderHaccp(filter) {
  currentHaccpFilter = filter;
  const grid = document.getElementById('haccp-grid');
  grid.innerHTML = '';
  data.filter(r => filter==='all' || r.cat===filter).forEach((r,i) => {
    const ex = extraData[r.id] || {};
    const haccp = ex.haccp || {fasi:[]};
    const adapt = ex.adattamenti || {};
    const diabete = ex.diabete || '';
    const flowHtml = haccp.fasi.map((f,fi) => {
      const isDispensa = f.nome.includes('dispensa');
      const badgeHtml = f.ccp
        ? `<span class="haccp-ccp-badge">CCP</span>`
        : isDispensa
          ? `<span class="haccp-fifo-badge">CP · FIFO</span>`
          : `<span class="haccp-ok-badge">CP</span>`;
      const boxClass = f.ccp ? 'is-ccp' : isDispensa ? 'is-dispensa' : '';
      return `
      <div class="haccp-step">
        <div class="haccp-step-arrow">
          ${fi>0?'<div class="haccp-arrow-line"></div><div class="haccp-arrow-head">▼</div>':'<div style="height:8px"></div>'}
        </div>
        <div class="haccp-box ${boxClass}">
          <div class="haccp-box-head">
            <span class="haccp-step-name">${fi+1}. ${f.nome}</span>
            ${badgeHtml}
          </div>
          <div class="haccp-box-body">
            <div class="haccp-field"><label>⚠ Pericolo</label><p>${f.pericolo}</p></div>
            <div class="haccp-field"><label>✓ Misura di controllo</label><p>${f.misura}</p></div>
          </div>
        </div>
      </div>`;
    }).join('');
    const adaptHtml = Object.entries(adapt).map(([k,v]) => `
      <div class="adapt-card adapt-${k}">
        <span class="adapt-label">${{vegan:'🌱 Vegan',lattosio:'🥛 Intolleranti lattosio',celiaci:'🌾 Celiaci',halal:'☪ Halal',kosher:'✡ Kosher'}[k]||k}</span>
        <p class="adapt-text">${v}</p>
      </div>`).join('');
    const diagramSvg = buildHaccpDiagram(haccp.fasi);
    const s = document.createElement('div');
    s.className = 'scheda';
    s.style.animationDelay = `${i*.07}s`;
    s.innerHTML = `
      <div class="scheda-header">
        <div class="scheda-num">${r.numero}</div>
        <div class="scheda-title-block">
          <div class="scheda-title">${r.title}</div>
          ${r.chef?`<div class="scheda-chef">Chef / Autore: ${r.chef}</div>`:''}
        </div>
        <div class="tags" style="margin:0;flex-shrink:0">
          ${r.tags.map(([l,c])=>`<span class="tag ${c}">${l}</span>`).join('')}
        </div>
      </div>
      <div class="scheda-body">
        <div class="scheda-cell diabete full">
          <div class="scheda-cell-label" style="color:var(--coral)"><span>💊</span> Prevenzione Diabete T2, Ipertensione &amp; Aterosclerosi</div>
          <div class="scheda-cell-content">${diabete}</div>
        </div>
        <div class="scheda-cell full" style="background:#F8F9FA">
          <div class="scheda-cell-label"><span>🍽</span> Adattamenti per esigenze dietetiche e religiose</div>
          <div class="adapt-grid">${adaptHtml}</div>
        </div>
        <div class="scheda-cell full">
          <div class="scheda-cell-label" style="color:var(--haccp-head)"><span>🔐</span> Piano HACCP — Diagramma di flusso</div>
          <div class="haccp-legend">
            <span><span class="haccp-ccp-badge">CCP</span> Punto Critico di Controllo</span>
            <span><span class="haccp-ok-badge">CP</span> Punto di Controllo</span>
            <span><span class="haccp-fifo-badge">CP · FIFO</span> Dispensa / T ambiente</span>
          </div>
          <div style="margin:1rem 0 .5rem;padding:.5rem;background:#f8f9fa;border-radius:4px;border:1px solid #e0e6f0">
            ${diagramSvg}
          </div>
          <div class="scheda-cell-label" style="margin-top:1rem;color:var(--haccp-head)"><span>📋</span> Dettaglio pericoli e misure di controllo</div>
          <div class="haccp-flow" style="margin-top:.8rem">${flowHtml}</div>
        </div>
      </div>
    `;
    grid.appendChild(s);
  });
}

function filterHaccp(cat, btn) {
  document.querySelectorAll('#view-haccp .filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderHaccp(cat);
}

function buildModalAdattamentiHtml(adapt) {
  if (!adapt || !Object.keys(adapt).length) return '';
  const labels = {vegan:'🌱 Vegan',lattosio:'🥛 Lattosio',celiaci:'🌾 Celiaci',halal:'☪ Halal',kosher:'✡ Kosher'};
  const cards = Object.entries(adapt).map(([k,v]) =>
    '<div class="adapt-card adapt-'+k+'">' +
    '<span class="adapt-label">'+(labels[k]||k)+'</span>' +
    '<p class="adapt-text">'+v+'</p>' +
    '</div>'
  ).join('');
  return '<div style="background:#F8F9FA;border-radius:3px;padding:.8rem 1rem;margin-top:.2rem">' +
    '<div class="scheda-cell-label" style="margin-bottom:.5rem"><span>🍽</span> Adattamenti per esigenze dietetiche e religiose</div>' +
    '<div class="adapt-grid">'+cards+'</div>' +
    '</div>';
}

function buildSdgHtml(recipeId) {
  const sdgs = sdgData[recipeId] || [];
  if (!sdgs.length) return '';
  const cards = sdgs.map(s => `
    <div class="sdg-card">
      <div class="sdg-badge sdg-${s.n}">
        <div style="font-size:.85rem;font-weight:800;line-height:1">${s.n}</div>
        <div style="font-size:.48rem;font-weight:600;letter-spacing:.02em;margin-top:1px;text-transform:uppercase;line-height:1.1">${s.titolo.split(' ').slice(0,2).join(' ')}</div>
      </div>
      <div class="sdg-text">
        <div class="sdg-title">SDG ${s.n} — ${s.titolo}</div>
        <div class="sdg-desc">${s.desc}</div>
      </div>
    </div>`).join('');
  return `
    <div class="sdg-section">
      <div class="sdg-section-label">🌍 Collegamenti con gli Obiettivi dell'Agenda 2030 — Sustainable Development Goals</div>
      <div class="sdg-grid">${cards}</div>
    </div>`;
}

function printSchedaById(id) {
  const r = data.find(x => x.id === id);
  if (!r) return;
  const ex = extraData[id] || {};
  const appro = r.approfondimento || {};
  const adapt = ex.adattamenti || {};
  const haccp = (ex.haccp || {fasi:[]});
  const sdgs  = sdgData[id] || [];
  const marchioBadge = {DOP:'🏆 DOP',IGP:'🌿 IGP','PAT':'📜 PAT','Presidio Slow Food':'🐌 Presidio Slow Food'}[appro.marchio]||appro.marchio||'';
  const sdgColors = {1:'#e5243b',2:'#dda63a',3:'#4c9f38',4:'#c5192d',5:'#ff3a21',6:'#26bde2',7:'#fcc30b',8:'#a21942',9:'#fd6925',10:'#dd1367',11:'#fd9d24',12:'#bf8b2e',13:'#3f7e44',14:'#0a97d9',15:'#56c02b',16:'#00689d',17:'#19486a'};

  /* ── helpers ── */
  const sec = (icon, label, content, bg='#fff', color='#1B4F72') => `
    <div class="section" style="background:${bg};border-left:3px solid ${color}">
      <div class="sec-label" style="color:${color}">${icon} ${label}</div>
      <div class="sec-body">${content}</div>
    </div>`;

  const haccpFlow = haccp.fasi.map((f,i) => {
    const isDispensa = f.nome.includes('dispensa');
    const badgeClass = f.ccp ? 'ccp-badge' : isDispensa ? 'fifo-badge' : 'ok-badge';
    const badgeText = f.ccp ? 'CCP' : isDispensa ? 'CP · FIFO' : 'CP';
    const boxClass = f.ccp ? 'ccp' : isDispensa ? 'dispensa' : '';
    return `
    <div class="hf-step">
      ${i>0?'<div class="hf-arrow">▼</div>':''}
      <div class="hf-box ${boxClass}">
        <div class="hf-head">
          <span class="hf-name">${i+1}. ${f.nome}</span>
          <span class="hf-badge ${badgeClass}">${badgeText}</span>
        </div>
        <div class="hf-body">
          <div><span class="hf-lbl">⚠ Pericolo</span><p>${f.pericolo}</p></div>
          <div><span class="hf-lbl">✓ Misura di controllo</span><p>${f.misura}</p></div>
        </div>
      </div>
    </div>`;
  }).join('');

  /* ── Diagramma di flusso SVG per la stampa ── */
  const printDiagramSvg = (() => {
    const fasi = haccp.fasi;
    if (!fasi || !fasi.length) return '';
    const ricezione = fasi.find(f => f.nome.toLowerCase().includes('ricezion'));
    const stocRef   = fasi.find(f => f.nome.toLowerCase().includes('stoccaggio') && !f.nome.toLowerCase().includes('dispensa'));
    const stocDisp  = fasi.find(f => f.nome.toLowerCase().includes('dispensa'));
    const remaining = fasi.filter(f => f !== ricezione && f !== stocRef && f !== stocDisp);
    const W=560, BW=160, BH=36, BRX=5;
    const CX=W/2, LX=130, RX=420;
    const COLORS={ccp:'#e74c3c',cp:'#2C3E50',fifo:'#e67e22',text:'#1a1a2e'};
    let y=18, svg='';
    function wrapText(txt,maxW,fs){const words=txt.split(' ');const lines=[];let cur='';const cpx=fs*.55;words.forEach(w=>{const t=cur?cur+' '+w:w;if(t.length*cpx>maxW-8){lines.push(cur);cur=w;}else cur=t;});if(cur)lines.push(cur);return lines;}
    function box(cx,cy,w,h,label,color,shape,badge){const lines=wrapText(label,w,9);const lh=12;const bh=Math.max(h,lines.length*lh+12);let el='';if(shape==='ellipse'){el=`<ellipse cx="${cx}" cy="${cy}" rx="${w/2}" ry="${bh/2}" fill="white" stroke="${color}" stroke-width="1.5"/>`;}else{el=`<rect x="${cx-w/2}" y="${cy-bh/2}" width="${w}" height="${bh}" rx="${BRX}" fill="white" stroke="${color}" stroke-width="${color===COLORS.ccp?2:1.5}" stroke-dasharray="${badge==='fifo'?'5,3':'none'}"/>`;}
    const ty=cy-(lines.length-1)*lh/2;const te=lines.map((l,i)=>`<text x="${cx}" y="${ty+i*lh}" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="${COLORS.text}" font-weight="${color===COLORS.ccp?'600':'400'}">${l}</text>`).join('');let be='';if(badge){const bc=badge==='ccp'?COLORS.ccp:badge==='fifo'?COLORS.fifo:COLORS.cp;const bl=badge==='ccp'?'CCP':badge==='fifo'?'CP·FIFO':'CP';be=`<rect x="${cx+w/2-30}" y="${cy-bh/2-1}" width="30" height="12" rx="2" fill="${bc}"/><text x="${cx+w/2-15}" y="${cy-bh/2+8}" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="white" font-weight="700">${bl}</text>`;}return{svg:el+te+be,h:bh};}
    function arrow(x,y1,y2){return `<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2-5}" stroke="#999" stroke-width="1.1"/><polygon points="${x-3},${y2-5} ${x+3},${y2-5} ${x},${y2}" fill="#999"/>`;}
    function hline(x1,x2,yy){return `<line x1="${x1}" y1="${yy}" x2="${x2}" y2="${yy}" stroke="#999" stroke-width="1.1"/>`;}
    function vline(x,y1,y2){return `<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="#999" stroke-width="1.1"/>`;}
    const ih=28;svg+=box(CX,y+ih/2,150,ih,'INGREDIENTI',COLORS.cp,'ellipse','').svg;y+=ih;
    svg+=arrow(CX,y,y+22);y+=22;
    const rNome=ricezione?ricezione.nome.toUpperCase():'RICEZIONE MATERIE PRIME';
    const rBadge=ricezione?(ricezione.ccp?'ccp':'cp'):'ccp';
    const rColor=ricezione?.ccp?COLORS.ccp:COLORS.cp;
    const rB=box(CX,y+BH/2,BW*1.35,BH,rNome,rColor,'rect',rBadge);svg+=rB.svg;y+=rB.h;
    const splitY=y+18;svg+=vline(CX,y,splitY);svg+=hline(LX,RX,splitY);svg+=arrow(LX,splitY,splitY+18);svg+=arrow(RX,splitY,splitY+18);y=splitY+18;
    const sNome=stocRef?stocRef.nome.replace('Stoccaggio a T controllata — ','').replace('Stoccaggio refrigerato','STOCCAGGIO T CONTROLLATA').toUpperCase():'STOCCAGGIO T CONTROLLATA';
    const sB=box(LX,y+BH/2,BW,BH,sNome,COLORS.ccp,'rect','ccp');svg+=sB.svg;const lY=y+sB.h;

    const dB=box(RX,y+BH/2,BW,BH,dNome,COLORS.fifo,'rect','fifo');svg+=dB.svg;const rY=y+dB.h;

    svg+=vline(LX,lY,joinY);svg+=vline(RX,rY,joinY);svg+=hline(LX,RX,joinY);svg+=arrow(CX,joinY,joinY+18);y=joinY+18;

function goToHaccp(id) {
  // Switch to HACCP tab
  const haccpTab = document.querySelectorAll('.view-tab')[2];
  switchView('haccp', haccpTab);
  // Render if needed
  if (document.getElementById('haccp-grid').children.length === 0) renderHaccp('all');

  setTimeout(() => {
    const r = data.find(x => x.id === id);
    if (!r) return;
    const all = document.querySelectorAll('#haccp-grid .scheda');
    let target = null;
    all.forEach(s => { if (s.querySelector('.scheda-title') && s.querySelector('.scheda-title').textContent === r.title) target = s; });
    if (target) {
      target.scrollIntoView({behavior:'smooth', block:'start'});
      target.style.outline = '3px solid var(--terracotta)';
      setTimeout(() => target.style.outline = '', 2000);
    }
  }, 150);
}
