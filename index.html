let editorOpen=false, currentEditId=0;
function toggleEditor(){editorOpen=!editorOpen;document.getElementById('editor-sidebar').classList.toggle('open',editorOpen);document.getElementById('edit-fab').classList.toggle('active',editorOpen);if(editorOpen)buildEditorSelect()}
function buildEditorSelect(){const sel=document.getElementById('editor-recipe-select');sel.innerHTML=data.map(r=>`<option value="${r.id}">${r.numero}. ${r.title}</option>`).join('');sel.value=currentEditId;loadRecipeInEditor(currentEditId)}
function loadRecipeInEditor(id){currentEditId=id;const r=data.find(x=>x.id===id);if(!r)return;const idx=data.findIndex(x=>x.id===id);const ex=extraData[idx]||{};const cats=[{v:'mare',l:'Mare & Pesce'},{v:'pasta',l:'Pasta & Cereali'},{v:'legumi',l:'Legumi'},{v:'veg',l:'Verdure'}];const catOpts=cats.map(c=>`<option value="${c.v}"${r.cat===c.v?' selected':''}>${c.l}</option>`).join('');document.getElementById('editor-form-body').innerHTML=`<div class="field-section-title">📋 Informazioni base</div><div class="field-group"><label>Nome del piatto</label><input id="ef-title" value="${esc(r.title)}"></div><div class="field-group"><label>Chef / Autore</label><input id="ef-chef" value="${esc(r.chef)}"></div><div class="field-group"><label>Categoria</label><select id="ef-cat">${catOpts}</select></div><div class="field-group"><label>Dosi / Porzioni</label><input id="ef-porzioni" value="${esc(r.porzioni)}"></div><div class="field-group"><label>Nota breve</label><input id="ef-note" value="${esc(r.note)}"></div><div class="field-sep"></div><div class="field-section-title">🛒 Ingredienti (uno per riga)</div><div class="field-group"><textarea id="ef-ing" class="tall">${r.ingredients.join('\n')}</textarea></div><div class="field-sep"></div><div class="field-section-title">⚠️ Allergeni</div><div class="field-group"><input id="ef-allergeni" value="${esc(r.allergeni)}"></div><div class="field-sep"></div><div class="field-section-title">📊 Valori nutrizionali (per porzione)</div><div class="macro-row"><div class="field-group"><label>kcal</label><input type="number" id="ef-kcal" value="${r.macros.kcal}"></div><div class="field-group"><label>Proteine g</label><input type="number" id="ef-prot" value="${r.macros.prot}"></div><div class="field-group"><label>Carboidrati g</label><input type="number" id="ef-carb" value="${r.macros.carb}"></div><div class="field-group"><label>Grassi g</label><input type="number" id="ef-grassi" value="${r.macros.grassi}"></div></div><div class="field-sep"></div><div class="field-section-title">👨‍🍳 Procedimento</div><div class="field-group"><textarea id="ef-proc" class="tall">${esc(r.procedimento)}</textarea></div><div class="field-sep"></div><div class="field-section-title">🩺 Motivazione nutrizionale</div><div class="field-group"><textarea id="ef-motiv" class="tall">${esc(r.motivazione)}</textarea></div><div class="field-sep"></div><div class="field-section-title">🍳 Tecniche di cottura</div><div class="field-group"><textarea id="ef-cottura" class="tall">${esc(r.cottura)}</textarea></div><div class="field-sep"></div><div class="field-section-title">🔬 Prevenzione oncologica</div><div class="field-group"><textarea id="ef-antitum" class="tall">${esc(r.antitumorale)}</textarea></div><div class="field-sep"></div><div class="field-section-title">🌿 Stagionalità</div><div class="field-group"><input id="ef-stagione" value="${esc(r.stagione)}"></div><div class="field-sep"></div><div class="field-section-title" style="color:#C0392B">💊 Diabete T2, Ipertensione &amp; Aterosclerosi</div><div class="field-group"><textarea id="ef-diabete" class="tall">${esc(ex.diabete||'')}</textarea></div><div class="field-sep"></div><div class="field-section-title">🍽 Adattamenti dietetici</div><div class="field-group"><label>🌱 Vegan</label><textarea id="ef-ad-vegan" class="tall">${esc((ex.adattamenti||{}).vegan||'')}</textarea></div><div class="field-group"><label>🥛 Lattosio</label><textarea id="ef-ad-latt" class="tall">${esc((ex.adattamenti||{}).lattosio||'')}</textarea></div><div class="field-group"><label>🌾 Celiaci</label><textarea id="ef-ad-celi" class="tall">${esc((ex.adattamenti||{}).celiaci||'')}</textarea></div><div class="field-group"><label>☪ Halal</label><textarea id="ef-ad-halal" class="tall">${esc((ex.adattamenti||{}).halal||'')}</textarea></div><div class="field-group"><label>✡ Kosher</label><textarea id="ef-ad-kosh" class="tall">${esc((ex.adattamenti||{}).kosher||'')}</textarea></div><div class="field-sep"></div><div class="field-section-title" style="color:#2C3E50">🔐 Fasi HACCP (una per riga: Nome | Pericolo | Misura | true/false)</div><div class="field-group"><textarea id="ef-haccp" style="min-height:160px">${((ex.haccp||{}).fasi||[]).map(f=>`${f.nome} | ${f.pericolo} | ${f.misura} | ${f.ccp}`).join('\n')}</textarea></div><div class="field-sep"></div><div class="field-section-title" style="color:#e07070">🗑 Elimina ricetta</div><div class="field-group"><button onclick="deleteRecipe(${r.id})" style="width:100%;padding:.5rem;background:#7a2020;color:#fff;border:none;border-radius:3px;cursor:pointer;font-family:'Crimson Pro',serif;font-size:.85rem">Elimina questa ricetta</button></div>`}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function applyEdits(){const r=data.find(x=>x.id===currentEditId);if(!r)return;r.title=document.getElementById('ef-title').value.trim();r.chef=document.getElementById('ef-chef').value.trim();const nc=document.getElementById('ef-cat').value;const cl={mare:'Mare & Pesce',pasta:'Pasta & Cereali',legumi:'Zuppe & Legumi',veg:'Verdure & Cereali'};r.cat=nc;r.catLabel=cl[nc]||nc;r.porzioni=document.getElementById('ef-porzioni').value.trim();r.note=document.getElementById('ef-note').value.trim();r.ingredients=document.getElementById('ef-ing').value.split('\n').map(s=>s.trim()).filter(Boolean);r.allergeni=document.getElementById('ef-allergeni').value.trim();r.macros.kcal=parseInt(document.getElementById('ef-kcal').value)||0;r.macros.prot=parseInt(document.getElementById('ef-prot').value)||0;r.macros.carb=parseInt(document.getElementById('ef-carb').value)||0;r.macros.grassi=parseInt(document.getElementById('ef-grassi').value)||0;r.procedimento=document.getElementById('ef-proc').value.trim();r.motivazione=document.getElementById('ef-motiv').value.trim();r.cottura=document.getElementById('ef-cottura').value.trim();r.antitumorale=document.getElementById('ef-antitum').value.trim();r.stagione=document.getElementById('ef-stagione').value.trim();const idx=data.findIndex(x=>x.id===r.id);if(!extraData[idx])extraData[idx]={};extraData[idx].diabete=document.getElementById('ef-diabete').value.trim();extraData[idx].adattamenti={vegan:document.getElementById('ef-ad-vegan').value.trim(),lattosio:document.getElementById('ef-ad-latt').value.trim(),celiaci:document.getElementById('ef-ad-celi').value.trim(),halal:document.getElementById('ef-ad-halal').value.trim(),kosher:document.getElementById('ef-ad-kosh').value.trim()};const hr=document.getElementById('ef-haccp').value.trim();extraData[idx].haccp={fasi:hr?hr.split('\n').filter(l=>l.trim()).map(l=>{const p=l.split('|').map(x=>x.trim());return{nome:p[0]||'',pericolo:p[1]||'',misura:p[2]||'',ccp:(p[3]||'').toLowerCase()==='true'}}):[]};renderCards(currentCardFilter);renderSchede(currentSchedeFilter);renderHaccp(currentHaccpFilter);buildEditorSelect();showToast('✓ Modifiche applicate!')}
function deleteRecipe(id){if(!confirm('Eliminare questa ricetta?'))return;data=data.filter(r=>r.id!==id);currentEditId=data.length?data[0].id:-1;renderCards(currentCardFilter);renderSchede(currentSchedeFilter);renderHaccp(currentHaccpFilter);buildEditorSelect();showToast('Ricetta eliminata')}
function addNewRecipe(){const nid=Date.now(),nn=data.length+1;data.push({id:nid,numero:nn,title:"Nuova ricetta",chef:"",cat:"veg",catLabel:"Verdure & Cereali",accent:"acc-veg",tags:[["veg","tag-veg"]],porzioni:"Dosi per 4 persone",ingredients:["Ingrediente 1","Ingrediente 2"],macros:{kcal:0,prot:0,carb:0,grassi:0},note:"",allergeni:"Nessuno",procedimento:"Descrivi il procedimento...",motivazione:"Motivazione nutrizionale...",cottura:"Tecniche di cottura...",antitumorale:"Benefici oncologici...",stagione:"Tutto l'anno",ingChips:[{t:"Ingrediente",c:""}]});extraData.push({diabete:"",adattamenti:{vegan:"",lattosio:"",celiaci:"",halal:"",kosher:""},haccp:{fasi:[]}});currentEditId=nid;renderCards(currentCardFilter);renderSchede(currentSchedeFilter);renderHaccp(currentHaccpFilter);buildEditorSelect();showToast('✓ Nuova ricetta aggiunta!')}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
function downloadHTML(){let h=document.documentElement.outerHTML;const blob=new Blob([h],{type:'text/html;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ricette_classe2.html';a.click();showToast('⬇ Download avviato!')}

let currentCardFilter='all', currentSchedeFilter='all', currentHaccpFilter='all';

function renderCards(filter){currentCardFilter=filter;const grid=document.getElementById('cards-grid');grid.innerHTML='';data.filter(r=>filter==='all'||r.cat===filter).forEach((r,i)=>{const th=r.tags.map(([l,c])=>`<span class="tag ${c}">${l}</span>`).join('');const ih=r.ingredients.map(ing=>`<li><span class="ing-dot"></span>${ing}</li>`).join('');const app=approfondimenti[r.id]||{};const appBtnColor=app.colore||'#1B4F72';const card=document.createElement('div');card.className='card';card.style.animationDelay=`${i*.06}s`;
card.innerHTML=`<div class="card-accent ${r.accent}"></div><div class="card-body" onclick="openModal(${r.id})" style="cursor:pointer"><div class="card-category cat-${r.cat}">${r.catLabel}</div><div class="card-title" onclick="event.stopPropagation();openModal(${r.id})">${r.title}</div><div class="card-chef">${r.chef?'Chef / Autore: '+r.chef:''}</div><span class="porzioni-badge">${r.porzioni}</span><div class="divider"></div><div class="tags">${th}</div>${r.note?`<p style="font-size:.86rem;font-style:italic;opacity:.6;font-weight:300;line-height:1.45">${r.note}</p>`:''}</div><div class="ingredients-section"><button class="ingredients-toggle" onclick="toggleIng(this)"><span class="toggle-icon">+</span>&nbsp; Ingredienti</button><div class="ingredients-list"><ul>${ih}</ul></div></div><div class="macros" onclick="openModal(${r.id})" style="cursor:pointer"><div class="macro"><div class="macro-val">${r.macros.kcal}</div><span class="macro-label">kcal</span></div><div class="macro"><div class="macro-val">${r.macros.prot}g</div><span class="macro-label">proteine</span></div><div class="macro"><div class="macro-val">${r.macros.carb}g</div><span class="macro-label">carboidrati</span></div><div class="macro"><div class="macro-val">${r.macros.grassi}g</div><span class="macro-label">grassi</span></div></div><button class="approfondimento-btn" style="background:${appBtnColor}10;color:${appBtnColor}" onclick="toggleApprof(this)"><span>🏷️</span> Approfondimento: ${app.prodotto||''}</button><div class="approfondimento-panel"><span class="approfondimento-badge" style="background:${appBtnColor}">${app.tipo||''}</span><div class="approfondimento-title">${app.prodotto||''}</div><p class="approfondimento-text">${app.testo||''}</p></div>`;
grid.appendChild(card)})}

function renderSchede(filter){currentSchedeFilter=filter;const grid=document.getElementById('schede-grid');grid.innerHTML='';data.filter(r=>filter==='all'||r.cat===filter).forEach((r,i)=>{const ex=extraData[r.id]||{};const diabete=ex.diabete||'';const adapt=ex.adattamenti||{};const appS=approfondimenti[r.id]||{};const appB=appS.colore||'#1B4F72';const appT=appS.prodotto||'';const appTipo=appS.tipo||'';const appTesto=appS.testo||'';const ch=r.ingChips.map(c=>`<span class="ing-chip ${c.c}">${c.t}</span>`).join('');const ah=Object.entries(adapt).map(([k,v])=>`<div class="adapt-card adapt-${k}"><span class="adapt-label">${{vegan:'🌱 Vegan',lattosio:'🥛 Lattosio',celiaci:'🌾 Celiaci',halal:'☪ Halal',kosher:'✡ Kosher'}[k]||k}</span><p class="adapt-text">${v}</p></div>`).join('');const s=document.createElement('div');s.className='scheda';s.style.animationDelay=`${i*.07}s`;s.innerHTML=`<div class="scheda-header"><div class="scheda-num">${r.numero}</div><div class="scheda-title-block"><div class="scheda-title">${r.title}</div>${r.chef?`<div class="scheda-chef">Chef / Autore: ${r.chef}</div>`:''}</div><div class="tags" style="margin:0;flex-shrink:0">${r.tags.map(([l,c])=>`<span class="tag ${c}">${l}</span>`).join('')}</div></div><div class="scheda-body"><div class="scheda-cell full"><div class="scheda-cell-label"><span>🛒</span> Ingredienti (${r.porzioni})</div><div class="scheda-cell-content"><div class="ing-chips">${ch}</div><p style="margin-top:.6rem;font-size:.88rem;opacity:.7">${r.ingredients.join(' · ')}</p></div></div><div class="scheda-cell allergeni"><div class="scheda-cell-label"><span>⚠️</span> Allergeni</div><div class="scheda-cell-content">${r.allergeni}</div></div><div class="scheda-cell stagione"><div class="scheda-cell-label"><span>🌿</span> Stagionalità</div><div class="scheda-cell-content">${r.stagione}</div></div><div class="scheda-cell full"><div class="scheda-cell-label"><span>👨‍🍳</span> Procedimento</div><div class="scheda-cell-content">${r.procedimento}</div></div><div class="scheda-cell motiv full"><div class="scheda-cell-label"><span>🩺</span> Motivazione nutrizionale</div><div class="scheda-cell-content">${r.motivazione}</div></div><div class="scheda-cell cottura full"><div class="scheda-cell-label" style="color:#5D4037"><span>🍳</span> Tecniche di cottura e benefici nutrizionali</div><div class="scheda-cell-content">${r.cottura}</div></div><div class="scheda-cell antitumorale full"><div class="scheda-cell-label" style="color:var(--purple)"><span>🔬</span> Prevenzione oncologica</div><div class="scheda-cell-content">${r.antitumorale}</div></div><div class="scheda-cell diabete full"><div class="scheda-cell-label" style="color:var(--coral)"><span>💊</span> Prevenzione Diabete T2, Ipertensione &amp; Aterosclerosi</div><div class="scheda-cell-content">${diabete}</div></div><div class="scheda-cell full" style="background:#F8F9FA"><div class="scheda-cell-label"><span>🍽</span> Adattamenti dietetici e religiosi</div><div class="adapt-grid">${ah}</div></div><div class="scheda-cell approf full" style="border-left:4px solid ${appB};background:${appB}08"><div class="scheda-cell-label" style="color:${appB}"><span>🏷️</span> Approfondimento Ingrediente — ${appT}</div><div class="scheda-cell-content"><span class="approfondimento-badge" style="background:${appB}">${appTipo}</span><p style="margin-top:.4rem">${appTesto}</p></div></div></div><div class="macros-row"><div class="macro"><div class="macro-val">${r.macros.kcal}</div><span class="macro-label">kcal/porz.</span></div><div class="macro"><div class="macro-val">${r.macros.prot}g</div><span class="macro-label">proteine</span></div><div class="macro"><div class="macro-val">${r.macros.carb}g</div><span class="macro-label">carboidrati</span></div><div class="macro"><div class="macro-val">${r.macros.grassi}g</div><span class="macro-label">grassi</span></div></div>`;grid.appendChild(s)})}

function renderHaccp(filter){currentHaccpFilter=filter;const grid=document.getElementById('haccp-grid');grid.innerHTML='';data.filter(r=>filter==='all'||r.cat===filter).forEach((r,i)=>{const ex=extraData[r.id]||{};const haccp=ex.haccp||{fasi:[]};const adapt=ex.adattamenti||{};const diabete=ex.diabete||'';const fh=haccp.fasi.map((f,fi)=>`<div class="haccp-step"><div class="haccp-step-arrow">${fi>0?'<div class="haccp-arrow-line"></div><div class="haccp-arrow-head">▼</div>':'<div style="height:8px"></div>'}</div><div class="haccp-box${f.ccp?' is-ccp':''}"><div class="haccp-box-head"><span class="haccp-step-name">${fi+1}. ${f.nome}</span><span class="${f.ccp?'haccp-ccp-badge':'haccp-ok-badge'}">${f.ccp?'CCP':'CP'}</span></div><div class="haccp-box-body"><div class="haccp-field"><label>⚠ Pericolo</label><p>${f.pericolo}</p></div><div class="haccp-field"><label>✓ Misura di controllo</label><p>${f.misura}</p></div></div></div></div>`).join('');const ah=Object.entries(adapt).map(([k,v])=>`<div class="adapt-card adapt-${k}"><span class="adapt-label">${{vegan:'🌱 Vegan',lattosio:'🥛 Intolleranti lattosio',celiaci:'🌾 Celiaci',halal:'☪ Halal',kosher:'✡ Kosher'}[k]||k}</span><p class="adapt-text">${v}</p></div>`).join('');const s=document.createElement('div');s.className='scheda';s.style.animationDelay=`${i*.07}s`;s.innerHTML=`<div class="scheda-header"><div class="scheda-num">${r.numero}</div><div class="scheda-title-block"><div class="scheda-title">${r.title}</div>${r.chef?`<div class="scheda-chef">Chef / Autore: ${r.chef}</div>`:''}</div><div class="tags" style="margin:0;flex-shrink:0">${r.tags.map(([l,c])=>`<span class="tag ${c}">${l}</span>`).join('')}</div></div><div class="scheda-body"><div class="scheda-cell diabete full"><div class="scheda-cell-label" style="color:var(--coral)"><span>💊</span> Prevenzione Diabete T2, Ipertensione &amp; Aterosclerosi</div><div class="scheda-cell-content">${diabete}</div></div><div class="scheda-cell full" style="background:#F8F9FA"><div class="scheda-cell-label"><span>🍽</span> Adattamenti dietetici e religiosi</div><div class="adapt-grid">${ah}</div></div><div class="scheda-cell full"><div class="scheda-cell-label" style="color:var(--haccp-head)"><span>🔐</span> Piano HACCP — Diagramma di flusso con CCP</div><div class="haccp-legend"><span><span class="haccp-ccp-badge">CCP</span> Punto Critico di Controllo</span><span><span class="haccp-ok-badge">CP</span> Punto di Controllo</span></div><div class="haccp-flow" style="margin-top:.8rem">${fh}</div></div></div>`;grid.appendChild(s)})}

function openModal(id){const r=data.find(x=>x.id===id);if(!r)return;const ch=r.ingChips.map(c=>`<span class="ing-chip ${c.c}">${c.t}</span>`).join('');document.getElementById('modal-body').innerHTML=`<div style="border-top:4px solid var(--navy)"><div class="scheda-header" style="background:var(--sky2)"><div class="scheda-num">${r.numero}</div><div class="scheda-title-block"><div class="scheda-title">${r.title}</div>${r.chef?`<div class="scheda-chef">Chef / Autore: ${r.chef}</div>`:''}</div></div><div style="padding:1.2rem 1.5rem;display:flex;flex-direction:column;gap:1rem"><div><div class="scheda-cell-label"><span>🛒</span> Ingredienti</div><span class="porzioni-badge" style="margin:.4rem 0;display:inline-block">${r.porzioni}</span><div class="ing-chips" style="margin-top:.4rem">${ch}</div><p style="margin-top:.5rem;font-size:.86rem;opacity:.65;line-height:1.55">${r.ingredients.join(' · ')}</p></div><div style="background:var(--peach);border-radius:3px;padding:.7rem .9rem"><div class="scheda-cell-label"><span>⚠️</span> Allergeni</div><p style="color:var(--aller);font-weight:400;font-size:.9rem;margin-top:.3rem">${r.allergeni}</p></div><div><div class="scheda-cell-label"><span>👨‍🍳</span> Procedimento</div><p style="font-size:.9rem;line-height:1.65;font-weight:300;margin-top:.3rem">${r.procedimento}</p></div><div style="background:var(--mint);border-radius:3px;padding:.8rem 1rem"><div class="scheda-cell-label"><span>🩺</span> Motivazione nutrizionale</div><p style="color:var(--motiv);font-size:.88rem;line-height:1.7;font-weight:300;margin-top:.3rem">${r.motivazione}</p></div><div style="background:#FBF7F0;border-radius:3px;padding:.8rem 1rem;border-left:3px solid var(--gold)"><div class="scheda-cell-label" style="color:#5D4037"><span>🍳</span> Tecniche di cottura</div><p style="color:#5D4037;font-size:.88rem;line-height:1.7;font-weight:300;margin-top:.3rem">${r.cottura}</p></div><div style="background:var(--purple-bg);border-radius:3px;padding:.8rem 1rem"><div class="scheda-cell-label" style="color:var(--purple)"><span>🔬</span> Prevenzione oncologica</div><p style="color:var(--purple);font-size:.88rem;line-height:1.7;font-weight:300;margin-top:.3rem">${r.antitumorale}</p></div><div><div class="scheda-cell-label"><span>🌿</span> Stagionalità</div><p style="font-size:.88rem;font-style:italic;opacity:.7;margin-top:.2rem">${r.stagione}</p></div></div><div class="macros-row" style="border-top:1px solid var(--sky2)"><div class="macro"><div class="macro-val">${r.macros.kcal}</div><span class="macro-label">kcal</span></div><div class="macro"><div class="macro-val">${r.macros.prot}g</div><span class="macro-label">proteine</span></div><div class="macro"><div class="macro-val">${r.macros.carb}g</div><span class="macro-label">carboidrati</span></div><div class="macro"><div class="macro-val">${r.macros.grassi}g</div><span class="macro-label">grassi</span></div></div></div>`;document.getElementById('modal-overlay').classList.add('open');document.body.style.overflow='hidden'}
function closeModal(e){if(e&&e.target!==document.getElementById('modal-overlay')&&!e.target.classList.contains('modal-close'))return;document.getElementById('modal-overlay').classList.remove('open');document.body.style.overflow=''}
function openEditorFor(id){currentEditId=id;if(!editorOpen)toggleEditor();else buildEditorSelect();document.getElementById('editor-recipe-select').value=id;loadRecipeInEditor(id)}

function toggleApprof(btn){
  event.stopPropagation();
  const panel=btn.nextElementSibling;
  panel.classList.toggle('open');
  btn.querySelector('span').textContent=panel.classList.contains('open')?'🔍':'🏷️';
}

function toggleIng(btn){const l=btn.nextElementSibling,ic=btn.querySelector('.toggle-icon');l.classList.toggle('open');ic.classList.toggle('open')}
function switchView(view,btn){document.querySelectorAll('.view-tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.querySelectorAll('.view-panel').forEach(p=>p.classList.remove('active'));document.getElementById('view-'+view).classList.add('active');window.scrollTo({top:0,behavior:'smooth'});if(view==='haccp')renderHaccp(currentHaccpFilter)}
function filterCards(cat,btn){document.querySelectorAll('#view-cards .filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderCards(cat)}
function filterSchede(cat,btn){document.querySelectorAll('#view-schede .filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderSchede(cat)}
function filterHaccp(cat,btn){document.querySelectorAll('#view-haccp .filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderHaccp(cat)}

renderCards('all');
renderSchede('all');
</script>
</body>
</html>
