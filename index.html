<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ricette Salutari — Classe II</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --cream:#f5f0e8;--sand:#e8dcc8;--terracotta:#c4673a;--olive:#6b7c4a;
  --deep:#2a1f14;--gold:#c9a84c;--sea:#3a6b7c;--navy:#1B4F72;
  --mint:#EAFAF1;--peach:#FDEBD0;--sky:#EBF5FB;--sky2:#D6EAF8;
  --motiv:#1D6A39;--aller:#784212;--purple:#6C3483;--purple-bg:#F5EEF8;
  --coral:#C0392B;--coral-bg:#FDEDEC;
  --appro:#7a5c10;--appro-bg:#fdf6e3;
  --adapt-border:#AEB6BF;--haccp-head:#2C3E50;--haccp-ccp:#E74C3C;--haccp-ok:#27AE60;
}
html{scroll-behavior:smooth}
body{background:var(--cream);font-family:'Crimson Pro',serif;color:var(--deep);min-height:100vh;
  background-image:radial-gradient(ellipse at 10% 20%,rgba(196,103,58,.07) 0%,transparent 50%),
                   radial-gradient(ellipse at 90% 80%,rgba(58,107,124,.07) 0%,transparent 50%)}

/* ─── EDITOR SIDEBAR ──────────────────────────────── */
#editor-sidebar{position:fixed;top:0;right:0;width:480px;height:100vh;background:#1a1a2e;color:#e8e8f0;z-index:2000;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);box-shadow:-8px 0 40px rgba(0,0,0,.4)}
#editor-sidebar.open{transform:translateX(0)}
.editor-top{background:#16213e;padding:1rem 1.2rem;display:flex;align-items:center;gap:.8rem;border-bottom:1px solid #2d2d50;flex-shrink:0}
.editor-top h2{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:400;flex:1;color:#c9b9e8}
.editor-close{background:none;border:none;color:#999;font-size:1.4rem;cursor:pointer;line-height:1;padding:.2rem}
.editor-close:hover{color:#fff}
.editor-recipe-select{padding:.5rem .8rem .5rem 1.2rem;background:#16213e;border-bottom:1px solid #2d2d50;flex-shrink:0}
.editor-recipe-select select{width:100%;background:#0f3460;color:#e8e8f0;border:1px solid #2d5f8f;border-radius:3px;padding:.5rem .8rem;font-family:'Crimson Pro',serif;font-size:.95rem;cursor:pointer}
.editor-body{flex:1;overflow-y:auto;padding:1.2rem}
.editor-body::-webkit-scrollbar{width:5px}
.editor-body::-webkit-scrollbar-track{background:#16213e}
.editor-body::-webkit-scrollbar-thumb{background:#2d5f8f;border-radius:3px}
.field-group{margin-bottom:1.1rem}
.field-group label{display:block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:#8899cc;margin-bottom:.35rem}
.field-group input,.field-group textarea,.field-group select{width:100%;background:#0d1b2a;color:#e8e8f0;border:1px solid #2d3a5a;border-radius:3px;padding:.55rem .75rem;font-family:'Crimson Pro',serif;font-size:.92rem;line-height:1.5;resize:vertical;transition:border-color .2s}
.field-group input:focus,.field-group textarea:focus,.field-group select:focus{outline:none;border-color:#5b8ee6;background:#0f2340}
.field-group textarea{min-height:80px}
.field-group textarea.tall{min-height:120px}
.field-sep{height:1px;background:#2d2d50;margin:1.2rem 0}
.field-section-title{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:#6c9fff;margin-bottom:.8rem;padding:.3rem 0;border-bottom:1px solid #1f2f50}
.macro-row{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}
.editor-footer{padding:1rem 1.2rem;background:#16213e;border-top:1px solid #2d2d50;display:flex;gap:.6rem;flex-shrink:0}
.btn-apply{flex:1;padding:.65rem;background:#1D6A39;color:#fff;border:none;border-radius:3px;font-family:'Crimson Pro',serif;font-size:.88rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:background .2s}
.btn-apply:hover{background:#27a34f}
.btn-download{flex:1;padding:.65rem;background:#c4673a;color:#fff;border:none;border-radius:3px;font-family:'Crimson Pro',serif;font-size:.88rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:background .2s}
.btn-download:hover{background:#d4834a}
.btn-new{padding:.65rem 1rem;background:#1B4F72;color:#fff;border:none;border-radius:3px;font-family:'Crimson Pro',serif;font-size:.88rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:background .2s}
.btn-new:hover{background:#2471a3}
#edit-fab{position:fixed;bottom:1.8rem;right:1.8rem;z-index:1500;width:54px;height:54px;border-radius:50%;background:var(--navy);color:#fff;border:none;font-size:1.4rem;cursor:pointer;box-shadow:0 4px 20px rgba(27,79,114,.45);transition:all .22s;display:flex;align-items:center;justify-content:center}
#edit-fab:hover{background:var(--terracotta);transform:scale(1.07)}
#edit-fab.active{background:var(--terracotta)}
#toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(60px);background:#1D6A39;color:#fff;padding:.6rem 1.4rem;border-radius:3px;font-size:.85rem;letter-spacing:.06em;z-index:3000;transition:transform .3s ease,opacity .3s ease;opacity:0;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* ─── HEADER ──────────────────────────────────────── */
.site-header{text-align:center;padding:3.5rem 2rem 1.5rem}
.header-line{width:120px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:0 auto 1.4rem}
.site-header h1{font-family:'Playfair Display',serif;font-size:clamp(2rem,5vw,3.4rem);font-weight:400;letter-spacing:.05em;line-height:1.1}
.site-header h1 em{font-style:italic;color:var(--terracotta)}
.site-header p{margin-top:.7rem;font-size:.82rem;color:var(--sea);font-weight:300;letter-spacing:.14em;text-transform:uppercase}
.view-tabs{display:flex;justify-content:center;gap:0;margin:1.2rem auto 0;max-width:700px;border:1.5px solid var(--sand);border-radius:3px;overflow:hidden}
.view-tab{flex:1;padding:.55rem 1rem;font-family:'Crimson Pro',serif;font-size:.88rem;letter-spacing:.08em;cursor:pointer;border:none;background:transparent;color:var(--deep);transition:all .22s;text-transform:uppercase}
.view-tab+.view-tab{border-left:1.5px solid var(--sand)}
.view-tab.active{background:var(--navy);color:#fff}
.view-tab:not(.active):hover{background:var(--sand)}

/* ─── FILTER BAR ──────────────────────────────────── */
.filter-bar{display:flex;justify-content:center;flex-wrap:wrap;gap:.55rem;padding:1.4rem 2rem 2rem}
.filter-btn{border:1.5px solid var(--sand);background:transparent;color:var(--deep);font-family:'Crimson Pro',serif;font-size:.88rem;letter-spacing:.06em;padding:.38rem 1rem;cursor:pointer;border-radius:2px;transition:all .22s}
.filter-btn:hover{background:var(--deep);color:var(--cream);border-color:var(--deep)}
.filter-btn.active{background:var(--terracotta);border-color:var(--terracotta);color:#fff}
.view-panel{display:none}
.view-panel.active{display:block}

/* ─── CARDS ───────────────────────────────────────── */
.cards-grid{max-width:1400px;margin:0 auto;padding:0 2rem 5rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:1.8rem}
.card{background:#fff;border-radius:3px;overflow:hidden;box-shadow:0 2px 18px rgba(42,31,20,.06);transition:transform .28s,box-shadow .28s;display:flex;flex-direction:column;opacity:0;animation:fadeUp .5s ease forwards;cursor:pointer}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 36px rgba(42,31,20,.16)}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.card:nth-child(1){animation-delay:.04s}.card:nth-child(2){animation-delay:.08s}.card:nth-child(3){animation-delay:.12s}.card:nth-child(4){animation-delay:.16s}.card:nth-child(5){animation-delay:.20s}.card:nth-child(6){animation-delay:.24s}.card:nth-child(7){animation-delay:.28s}.card:nth-child(8){animation-delay:.32s}.card:nth-child(9){animation-delay:.36s}.card:nth-child(10){animation-delay:.40s}.card:nth-child(11){animation-delay:.44s}.card:nth-child(12){animation-delay:.48s}.card:nth-child(13){animation-delay:.52s}
.card-accent{height:4px;width:100%}
.card-body{padding:1.5rem 1.5rem .9rem;flex:1}
.card-category{font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;opacity:.75;margin-bottom:.45rem}
.card-title{font-family:'Playfair Display',serif;font-size:1.17rem;font-weight:400;line-height:1.35;margin-bottom:.4rem}
.card-chef{font-size:.8rem;font-style:italic;opacity:.55;margin-bottom:.5rem}
.porzioni-badge{display:inline-block;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;background:var(--deep);color:var(--cream);padding:.18rem .6rem;border-radius:2px;margin-bottom:.5rem}
.divider{height:1px;background:linear-gradient(90deg,var(--sand),transparent);margin:.7rem 0}
.tags{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.7rem}
.tag{font-size:.7rem;padding:.18rem .55rem;border-radius:2px;letter-spacing:.04em}
.tag-km0{background:rgba(107,124,74,.12);color:var(--olive)}
.tag-dop{background:rgba(201,168,76,.15);color:#8a6d1a}
.tag-mare{background:rgba(58,107,124,.12);color:var(--sea)}
.tag-veg{background:rgba(107,124,74,.12);color:var(--olive)}
.tag-legumi{background:rgba(196,103,58,.12);color:var(--terracotta)}
.tag-integrale{background:rgba(42,31,20,.08);color:var(--deep)}
.tag-pat{background:rgba(107,124,74,.18);color:#2d5a1b}
.tag-insalata{background:rgba(107,156,124,.15);color:#3a7c5a}
.ingredients-section{padding:0 1.5rem .9rem}
.ingredients-toggle{display:flex;align-items:center;gap:.45rem;cursor:pointer;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--terracotta);border:none;background:none;font-family:'Crimson Pro',serif;padding:.5rem 0;width:100%;text-align:left;transition:opacity .2s}
.ingredients-toggle:hover{opacity:.65}
.toggle-icon{font-size:1rem;transition:transform .28s;display:inline-block;line-height:1}
.toggle-icon.open{transform:rotate(45deg)}
.ingredients-list{display:none;padding-bottom:.8rem;animation:slideDown .22s ease}
.ingredients-list.open{display:block}
@keyframes slideDown{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
.ingredients-list ul{list-style:none;display:flex;flex-direction:column;gap:.28rem}
.ingredients-list li{font-size:.9rem;display:flex;align-items:flex-start;gap:.45rem;line-height:1.4;font-weight:300}
.ing-dot{width:5px;height:5px;border-radius:50%;background:var(--gold);margin-top:.45em;flex-shrink:0}
.macros{display:grid;grid-template-columns:repeat(4,1fr);background:var(--cream);border-top:1px solid var(--sand);padding:.75rem 1.5rem}
.macro{text-align:center}
.macro-val{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:700;color:var(--deep);line-height:1}
.macro-label{font-size:.63rem;letter-spacing:.07em;text-transform:uppercase;opacity:.5;margin-top:.18rem;display:block}
.macro-approx{grid-column:1/-1;text-align:center;font-size:.62rem;font-style:italic;opacity:.4;padding:.2rem 0 .3rem;letter-spacing:.03em}

/* ─── CARD FOOTER ─────────────────────────────────── */
.card-footer{display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(201,168,76,.3);background:var(--appro-bg)}
.card-hint-text{flex:1;padding:.45rem .75rem;color:var(--appro);font-family:'Crimson Pro',serif;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase}
.card-print-btn{display:flex;align-items:center;gap:.3rem;padding:.45rem .8rem;border:none;border-left:1px solid rgba(201,168,76,.3);background:transparent;color:var(--navy);font-family:'Crimson Pro',serif;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:background .18s;flex-shrink:0}
.card-print-btn:hover{background:var(--navy);color:#fff}

/* ─── APPRO BADGE ─────────────────────────────────── */
.appro-badge{display:inline-flex;align-items:center;gap:.3rem;font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;background:var(--appro-bg);color:var(--appro);border:1px solid rgba(201,168,76,.4);padding:.22rem .6rem;border-radius:2px;margin-top:.4rem;font-weight:400}

.acc-mare{background:linear-gradient(90deg,var(--sea),#5a9bb0)}
.acc-legumi{background:linear-gradient(90deg,var(--terracotta),#d4845a)}
.acc-veg{background:linear-gradient(90deg,var(--olive),#8a9e60)}
.acc-pasta{background:linear-gradient(90deg,var(--gold),#d4b46c)}
.acc-insalata{background:linear-gradient(90deg,#6b9c7c,#8abf9c)}
.acc-zuppa{background:linear-gradient(90deg,#7c6b3a,#a08c50)}
.cat-mare{color:var(--sea)}.cat-legumi{color:var(--terracotta)}.cat-veg{color:var(--olive)}
.cat-pasta{color:#8a6d1a}.cat-insalata{color:#3a7c5a}.cat-zuppa{color:#7c6b3a}

/* ─── SCHEDE ──────────────────────────────────────── */
.schede-grid{max-width:1100px;margin:0 auto;padding:0 2rem 5rem;display:flex;flex-direction:column;gap:2.4rem}
.scheda{background:#fff;border-radius:4px;overflow:hidden;box-shadow:0 2px 20px rgba(42,31,20,.07);opacity:0;animation:fadeUp .5s ease forwards}
.scheda-header{padding:1.1rem 1.6rem;display:flex;align-items:center;gap:1rem;border-bottom:3px solid var(--navy)}
.scheda-num{font-family:'Playfair Display',serif;font-size:2rem;font-weight:700;color:var(--navy);opacity:.25;line-height:1;flex-shrink:0;min-width:2.2rem}
.scheda-title-block{flex:1}
.scheda-title{font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:400;color:var(--navy);line-height:1.25}
.scheda-chef{font-size:.8rem;font-style:italic;opacity:.55;margin-top:.15rem}
.scheda-body{display:grid;grid-template-columns:1fr 1fr}
@media(max-width:700px){.scheda-body{grid-template-columns:1fr}}
.scheda-cell{padding:1rem 1.4rem;border-right:1px solid var(--sky2);border-bottom:1px solid var(--sky2)}
.scheda-cell:nth-child(2n){border-right:none}
.scheda-cell.full{grid-column:1/-1;border-right:none}
.scheda-cell-label{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--navy);font-weight:400;margin-bottom:.4rem;display:flex;align-items:center;gap:.4rem}
.scheda-cell-content{font-size:.92rem;line-height:1.6;font-weight:300}
.scheda-cell.allergeni .scheda-cell-content{color:var(--aller);font-weight:400;background:var(--peach);border-radius:3px;padding:.5rem .7rem;font-size:.88rem}
.scheda-cell.motiv .scheda-cell-content{color:var(--motiv);font-weight:300;background:var(--mint);border-radius:3px;padding:.6rem .8rem;font-size:.88rem;line-height:1.65}
.scheda-cell.cottura .scheda-cell-content{color:#5D4037;font-weight:300;background:#FBF7F0;border-radius:3px;padding:.6rem .8rem;font-size:.88rem;line-height:1.65;border-left:3px solid var(--gold)}
.scheda-cell.antitumorale .scheda-cell-content{color:var(--purple);font-weight:300;background:var(--purple-bg);border-radius:3px;padding:.6rem .8rem;font-size:.88rem;line-height:1.65}
.scheda-cell.stagione .scheda-cell-content{font-style:italic;opacity:.7;font-size:.88rem}
.scheda-cell.diabete .scheda-cell-content{color:var(--coral);font-weight:300;background:var(--coral-bg);border-radius:3px;padding:.6rem .8rem;font-size:.88rem;line-height:1.65;border-left:3px solid var(--coral)}
.scheda-cell.approfondimento .scheda-cell-content{color:var(--appro);font-weight:300;background:var(--appro-bg);border-radius:3px;padding:.6rem .8rem;font-size:.88rem;line-height:1.65;border-left:3px solid var(--gold)}
.ing-chips{display:flex;flex-wrap:wrap;gap:.35rem}
.ing-chip{background:var(--sky);color:var(--navy);font-size:.75rem;padding:.2rem .55rem;border-radius:2px;line-height:1.4;font-weight:300}
.ing-chip.dop{background:rgba(201,168,76,.2);color:#7a5c10}
.ing-chip.igp{background:rgba(58,107,124,.15);color:var(--sea)}
.ing-chip.km0{background:rgba(107,124,74,.18);color:var(--olive)}
.ing-chip.pat{background:rgba(107,124,74,.25);color:#2d5a1b}
.macros-row{display:grid;grid-template-columns:repeat(4,1fr);background:var(--cream);border-top:1px solid var(--sky2)}
.macros-row .macro{text-align:center;padding:.7rem .5rem}
.macros-row .macro-approx{grid-column:1/-1;text-align:center;font-size:.62rem;font-style:italic;opacity:.4;padding:.2rem 0 .4rem}

/* ─── MODAL ───────────────────────────────────────── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(42,31,20,.55);z-index:999;align-items:center;justify-content:center;padding:1rem}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:4px;max-width:700px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:modalIn .25s ease}
@keyframes modalIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.modal-close{float:right;margin:1rem 1.2rem 0 0;background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--deep);opacity:.5;transition:opacity .2s;line-height:1}
.modal-close:hover{opacity:1}

/* ─── ADATTAMENTI ─────────────────────────────────── */
.adapt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.6rem;margin-top:.4rem}
.adapt-card{background:#fff;border:1px solid var(--adapt-border);border-radius:3px;padding:.7rem .9rem}
.adapt-label{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin-bottom:.3rem;display:block}
.adapt-text{font-size:.83rem;line-height:1.55;font-weight:300}
.adapt-vegan .adapt-label{color:#27AE60}
.adapt-lattosio .adapt-label{color:#8E44AD}
.adapt-celiaci .adapt-label{color:#D35400}
.adapt-halal .adapt-label{color:#1A5276}
.adapt-kosher .adapt-label{color:#7D6608}

/* ─── HACCP ───────────────────────────────────────── */
.haccp-flow{display:flex;flex-direction:column;gap:0}
.haccp-step{display:flex;gap:.6rem;align-items:stretch}
.haccp-step-arrow{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:28px}
.haccp-arrow-line{flex:1;width:2px;background:#AEB6BF;margin:0 auto}
.haccp-arrow-head{font-size:.8rem;color:#AEB6BF;line-height:1}
.haccp-box{flex:1;background:#fff;border:1px solid #AEB6BF;border-radius:3px;margin-bottom:4px;overflow:hidden}
.haccp-box.is-ccp{border-color:var(--haccp-ccp);border-width:2px}
.haccp-box.is-dispensa{border-color:#e67e22;border-style:dashed}
.haccp-box-head{display:flex;align-items:center;gap:.5rem;padding:.5rem .8rem;background:#F2F3F4}
.haccp-box.is-ccp .haccp-box-head{background:#FDEDEC}
.haccp-box.is-dispensa .haccp-box-head{background:#fef9f0}
.haccp-step-name{font-size:.85rem;font-weight:600;flex:1;line-height:1.3}
.haccp-ccp-badge{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;background:var(--haccp-ccp);color:#fff;padding:.15rem .5rem;border-radius:2px;flex-shrink:0}
.haccp-ok-badge{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;background:var(--haccp-ok);color:#fff;padding:.15rem .5rem;border-radius:2px;flex-shrink:0}
.haccp-fifo-badge{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;background:#e67e22;color:#fff;padding:.15rem .5rem;border-radius:2px;flex-shrink:0}
.haccp-box-body{padding:.45rem .8rem .55rem;display:grid;grid-template-columns:1fr 1fr;gap:.3rem .8rem}
@media(max-width:600px){.haccp-box-body{grid-template-columns:1fr}}
.haccp-field label{font-size:.63rem;letter-spacing:.1em;text-transform:uppercase;color:#5D6D7E;display:block;margin-bottom:.1rem}
.haccp-field p{font-size:.82rem;line-height:1.5;font-weight:300}
.haccp-legend{display:flex;gap:1rem;margin-top:.5rem;font-size:.75rem;align-items:center;flex-wrap:wrap}
.haccp-legend span{display:flex;align-items:center;gap:.3rem}

/* ─── SDG ─────────────────────────────────────────── */
.sdg-section{padding:.9rem 1.4rem 1rem;border-top:1px solid var(--sky2);background:#f9fafc}
.sdg-section-label{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:#1a3a5c;font-weight:400;margin-bottom:.7rem;display:flex;align-items:center;gap:.4rem}
.sdg-grid{display:flex;flex-wrap:wrap;gap:.6rem}
.sdg-card{display:flex;gap:.6rem;align-items:flex-start;background:#fff;border-radius:3px;border:1px solid #dce4f0;padding:.55rem .7rem;flex:1;min-width:260px}
.sdg-badge{flex-shrink:0;width:42px;height:42px;border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.65rem;font-weight:700;color:#fff;line-height:1.15;text-align:center}
.sdg-text{flex:1}
.sdg-title{font-size:.78rem;font-weight:600;color:#1a3a5c;margin-bottom:.18rem;line-height:1.3}
.sdg-desc{font-size:.8rem;line-height:1.55;color:#2a3a50;font-weight:300}

   macros:{kcal:290,prot:28,carb:14,grassi:11},note:"Il guazzetto di prezzemolo è il sugo tradizionale di accompagnamento delle seppie campane",
   allergeni:"Molluschi (seppia) · Uova · Glutine (pane grattugiato) · Solfiti (vino bianco)",
   procedimento:"Pulire le seppie conservando i sacchi. Preparare il ripieno con tentacoli tritati, zucchine San Pasquale PAT a cubetti, prezzemolo, aglio, pane grattugiato integrale e uovo. Farcire le seppie e chiudere con stuzzicadenti. In casseruola rosolare in olio EVO, sfumare con vino bianco, aggiungere pomodorini Piennolo DOP e cuocere 35 min a fuoco basso.",
   motivazione:"La seppia è mollusco magrissimo con soli 72 kcal/100 g. L'inchiostro di seppia contiene melanina e taurina con proprietà antiossidanti. Le zucchine San Pasquale PAT sono ipocaloriche e ricche di potassio. Il prezzemolo apporta vitamina C, apigenina e folati in quantità eccezionali.",
   cottura:"La cottura lenta in casseruola (35 min a fuoco basso) è brasatura umida che intenerisce il collagene dei molluschi. Il vino bianco viene aggiunto all'inizio per evaporare i solfiti; i pomodorini Piennolo DOP vengono aggiunti successivamente preservando il licopene.",
   antitumorale:"Il prezzemolo è la fonte alimentare più ricca di apigenina: ha dimostrato di inibire la crescita di cellule tumorali della prostata e del seno. I pomodorini del Piennolo DOP apportano licopene e betacarotene associati alla riduzione del rischio di tumori della prostata. L'aglio aggiunge allicina e diallil disolfuro.",
   stagione:"Primavera-estate (seppie febbraio-giugno; zucchine San Pasquale maggio-settembre)",

  {id:7,numero:8,title:"Farro Integrale con Sgombro e Verdure di Stagione",chef:"Mastellone",cat:"pasta",catLabel:"Cereali Integrali",accent:"acc-pasta",
   tags:[["integrale","tag-integrale"],["mare","tag-mare"],["km0","tag-km0"]],porzioni:"Dosi per 4 persone",
   ingredients:["250 g farro integrale","200 g sgombro al naturale (pesca locale)","150 g pomodorini campani freschi (km0)","2 zucchine medie (stagione, km0)","olio EVO campano","basilico fresco","menta fresca","succo di limone","1 spicchio aglio","sale marino integrale","pepe nero"],
   macros:{kcal:360,prot:22,carb:46,grassi:11},note:"Il farro integrale richiede ammollo di 8 ore per ridurre i tempi di cottura",
   allergeni:"Glutine (farro) · Pesce (sgombro)",
   procedimento:"Ammollare il farro integrale 8 ore. Cuocere in acqua salata 45 min, scolare e raffreddare. Tagliare le zucchine a dadini e saltarle in padella con olio EVO e aglio 5 min. Tagliare i pomodorini a metà. Sgocciolare lo sgombro. In ciotola assemblare farro raffreddato, sgombro sbriciolato, zucchine, pomodorini, basilico e menta. Condire con olio EVO e succo di limone.",
   motivazione:"Il farro integrale ha IG ≈ 35 tra i più bassi dei cereali. Lo sgombro è il pesce azzurro con la più alta concentrazione di Omega-3 (2,2 g/100 g). Il raffreddamento del farro massimizza l'amido resistente. Piatto a bassissimo indice glicemico, ideale per prevenzione del DT2.",
   cottura:"L'ammollo del farro integrale (8 ore) riduce gli antinutrienti migliorando la biodisponibilità di ferro, zinco e calcio. Lo sgombro al naturale non subisce ulteriore cottura, preservando integralmente gli Omega-3. Il raffreddamento rapido del farro genera amido resistente RS3 che fermentato nel colon produce butirrato.",
   antitumorale:"Lo sgombro è il pesce azzurro per eccellenza: gli Omega-3 riducono i livelli di prostaglandine pro-infiammatorie. Il farro integrale apporta lignani che riducono i livelli di estrogeni liberi. I pomodorini campani forniscono licopene. Il basilico apporta eugenolo che inibisce l'angiogenesi tumorale.",
   stagione:"Estate (zucchine e pomodorini freschi); sgombro e farro disponibili tutto l'anno",
   approfondimento:{nome:"Noci di Sorrento PAT",marchio:"PAT",descrizione:"Coltivate sui Monti Lattari e sulle colline della Penisola Sorrentina, inserite nell'elenco PAT. La cultivar locale 'Sorrento' si distingue per il guscio sottile e il gheriglio grande e carnoso dal sapore dolce. Contiene circa 15 g di Omega-3 ALA per 100 g, il triplo rispetto a molte cultivar nordeuropee. Tradizionalmente usate nel nocillo e nella cucina dolciaria sorrentina."},

   macros:{kcal:410,prot:28,carb:50,grassi:10},note:"Il riso integrale richiede pre-ammollo e tempi di cottura più lunghi del carnaroli classico",
   allergeni:"Crostacei (gamberetti) · Molluschi (cozze, vongole) · Solfiti (vino bianco) · Glutine (eventuale nel brodo)",
   procedimento:"Aprire cozze e vongole in padella con aglio e vino bianco, filtrare il liquido di cottura. Soffriggere cipolla in olio EVO, tostare il riso integrale 3 min. Aggiungere brodo di pesce caldo a mestoli mescolando. A 3/4 cottura aggiungere i gamberetti, i molluschi sgusciati, il liquido filtrato e i pomodorini. Terminare la cottura. Mantecare fuori fuoco. Prezzemolo fresco.",
   motivazione:"Il riso integrale ha IG ≈ 50 vs il riso bianco IG ≈ 72. Le cozze sono la fonte alimentare più ricca di vitamina B12 (320 μg/100 g) e selenio. I gamberetti apportano iodio. Il brodo di pesce homemade è privo di esaltatori di sapidità.",
   cottura:"Il riso integrale viene tostato a secco 3 min prima del liquido. Le cozze e le vongole vengono aperte a fuoco vivo brevemente (3 min). Il liquido di apertura dei molluschi viene filtrato e aggiunto al risotto. I gamberetti vengono aggiunti negli ultimi 3 min di cottura.",
   antitumorale:"Le cozze e le vongole contengono selenio, fondamentale per l'attività della glutatione perossidasi: bassi livelli di selenio correlano con aumento del rischio di tumori di fegato, polmone e colon-retto. I gamberetti apportano astaxantina con documentata azione antitumorale. Il prezzemolo abbondante fornisce apigenina.",
   stagione:"Tutto l'anno (frutti di mare disponibili in continua); pomodorini campani estate-autunno",
   approfondimento:{nome:"Cozze del Golfo di Napoli — km0",marchio:"km0",descrizione:"Allevate nel Golfo di Napoli con la tecnica dei 'filari galleggianti', raccolte quotidianamente garantendo una freschezza (meno di 24 ore) impossibile con prodotti di importazione. Nutrizionalmente straordinarie: vitamina B12 (340 μg/100 g, 14.000% del fabbisogno giornaliero), selenio, ferro (4,5 mg/100 g) e Omega-3, con sole 86 kcal/100 g."},

   macros:{kcal:390,prot:17,carb:58,grassi:11},note:"Il provolone del Monaco DOP, tipicità dei Monti Lattari, si usa in piccola quantità come condimento",
   allergeni:"Glutine (pasta) · Latte (provolone del Monaco)",

   motivazione:"I broccoli baresi contengono sulforafano, il composto bioattivo più studiato in oncologia nutrizionale. La pasta integrale ha IG ≈ 40. Cuocere i broccoli nella stessa acqua della pasta trasferisce parte dei glucosinolati idrosolubili nel liquido di cottura che viene poi riassorbito nella mantecatura.",
   cottura:"La cottura dei broccoli nella stessa acqua della pasta recupera i glucosinolati idrosolubili. I broccoli vengono cotti al dente (6–8 min): cotture più lunghe distruggerebbero la mirosinasi e i glucosinolati. Il provolone del Monaco DOP viene aggiunto fuori fuoco per preservarne gli aromi.",

   stagione:"Autunno-inverno (broccoli baresi ottobre-marzo); provolone del Monaco DOP e pasta disponibili tutto l'anno",
   approfondimento:{nome:"Provolone del Monaco DOP",marchio:"DOP",descrizione:"Prodotto esclusivamente con latte vaccino crudo intero dei Monti Lattari e della Penisola Sorrentina, con caglio in pasta di capretto o agnello. Stagionatura minima 6 mesi (fino a 18 mesi per il 'stagionato'). Il latte delle vacche di razza Agerolese, allevate allo stato semibrado, conferisce un bouquet aromatico inimitabile con note di fieno, erbe di montagna e una leggera acidità. Ha ottenuto la DOP nel 2010."},

  {id:10,numero:11,title:"Pasta e Cicerchie di Capri",chef:"Pollio",cat:"legumi",catLabel:"Legumi & Pasta",accent:"acc-legumi",

   ingredients:["180 g cicerchie di Capri PAT (ammollate 24h)","200 g pasta mista integrale (spaghetti spezzati o pasta mista)","2 pomodori ramati (stagione)","1 cipolla dorata","2 spicchi aglio","rosmarino fresco","olio EVO campano","brodo vegetale","sale marino integrale","peperoncino","prezzemolo fresco"],
   macros:{kcal:370,prot:17,carb:58,grassi:8},note:"Ammollo obbligatorio 24h e cottura lenta per eliminare la ODAP tossica",
   allergeni:"Glutine (pasta)",
   procedimento:"Ammollare le cicerchie 24 ore cambiando l'acqua 2-3 volte. Cuocere in acqua non salata per 60-70 min. Soffriggere cipolla, aglio e rosmarino in olio EVO. Aggiungere i pomodori a pezzetti e le cicerchie cotte. Cuocere la pasta mista nella zuppa aggiungendo brodo. La pasta assorbirà il sugo creando consistenza densa. Finire con olio EVO a crudo, prezzemolo e peperoncino.",
   motivazione:"Le cicerchie di Capri PAT sono un legume antico con proteine di alta qualità (25 g/100 g) e IG bassissimo (< 30). La cottura come zuppa densa crea un piatto ad alto potere saziante. L'amido della pasta si combina con le fibre delle cicerchie abbassando significativamente il carico glicemico.",
   cottura:"L'ammollo di 24 ore con cambi d'acqua frequenti è OBBLIGATORIO e CCP principale: riduce la ODAP (beta-N-ossalil-L-aminoalanina), neurotossina termolabile responsabile del latirismo. La pasta viene cotta direttamente nella zuppa: l'amido che rilascia crea cremosità naturale senza aggiungere grassi.",
   antitumorale:"Le cicerchie contengono lectine e inibitori di proteasi con documentata attività pro-apoptotica in vitro. Il rosmarino apporta acido carnosico e acido rosmarinico con effetto inibitorio su enzimi pro-infiammatori. I pomodori freschi forniscono licopene. L'aglio contribuisce con allicina e organosolfurati.",
   stagione:"Tutto l'anno (cicerchie secche disponibili in continuità); pomodori freschi estate",
   approfondimento:{nome:"Cicerchie di Capri PAT",marchio:"PAT",descrizione:"Lathyrus sativus, inserite nell'elenco PAT. Coltivate nell'area flegrea e nella zona di Capri per secoli. Rispetto ai comuni legumi hanno contenuto proteico superiore (25 g/100 g), indice glicemico bassissimo (< 30) e eccezionale resistenza alla siccità. Nella tradizione napoletana erano 'il cibo dei poveri' durante le carestie. Stanno vivendo una riscoperta grazie ai movimenti di valorizzazione dei legumi antichi."},

  {id:11,numero:12,title:"Tagliolini al Limone",chef:"Salvato",cat:"pasta",catLabel:"Pasta",accent:"acc-pasta",
   tags:[["IGP","tag-dop"],["km0","tag-km0"]],porzioni:"Dosi per 4 persone",
   ingredients:["320 g tagliolini freschi all'uovo (o secchi)","3 limoni di Sorrento IGP (scorza e succo)","40 g burro di qualità","200 ml panna fresca (ridotta, 50 ml/porzione)","40 g parmigiano reggiano stagionato","sale marino integrale","pepe bianco","basilico fresco","erba cipollina fresca"],
   macros:{kcal:480,prot:14,carb:60,grassi:20},note:"Usare la scorza biologica del limone IGP — è il vero protagonista del piatto",
   allergeni:"Glutine (tagliolini) · Uova (tagliolini freschi) · Latte (burro, panna, parmigiano)",
   procedimento:"Cuocere i tagliolini in abbondante acqua salata (2 min se freschi, 6 min se secchi). Nel frattempo sciogliere il burro a fuoco bassissimo, aggiungere la panna e portare a leggera ebollizione. Fuori fuoco aggiungere scorza e succo dei limoni di Sorrento IGP e parmigiano. Scolare i tagliolini al dente e mantecare nella salsa con un po' di acqua di cottura. Servire con basilico fresco ed erba cipollina.",
   motivazione:"Il limone di Sorrento IGP è l'ingrediente protagonista: la sua scorza contiene limonene, hesperidina e vitamina C in concentrazioni eccezionali. La panna viene usata in quantità limitata (50 ml/porzione) come veicolo lipidico che aumenta la biodisponibilità dei flavonoidi liposolubili del limone.",
   cottura:"Il burro e la panna vengono scaldati a fuoco bassissimo (< 90°C). Il limone — scorza e succo — viene aggiunto SEMPRE fuori fuoco: il calore degraderebbe il limonene volatile e la vitamina C termolabile. La mantecatura con acqua di cottura permette di ridurre la quantità di panna.",
   antitumorale:"Il limonene della scorza del limone di Sorrento IGP inibisce la farnesil-proteina transferasi, ha mostrato regressione di carcinomi al seno in studi clinici preliminari, e riduce la sintesi epatica del colesterolo. La vitamina C inibisce la formazione di nitrosammine cancerogene. L'erba cipollina apporta composti solforati con effetto antiproliferativo.",
   stagione:"Tutto l'anno (limoni di Sorrento IGP disponibili tutto l'anno, ottimali in inverno-primavera)",
   approfondimento:{nome:"Limone di Sorrento IGP — La scorza",marchio:"IGP",descrizione:"In questo piatto la scorza è l'ingrediente protagonista assoluto. La cultivar 'Femminello Sorrentino' produce frutti quasi tutto l'anno con picchi in primavera (limoni primofiore, i più aromatici). La scorza — spessa fino a 9 mm — contiene ghiandole oleifere visibili a occhio nudo che rilasciano profumo intenso al minimo sfregamento. Il Limoncello della Costa d'Amalfi IGP utilizza esclusivamente la scorza del Limone di Sorrento IGP."},
   ingChips:[{t:"Tagliolini freschi",c:""},{t:"Limone Sorrento IGP",c:"igp"},{t:"Burro",c:""},{t:"Parmigiano",c:""},{t:"Basilico fresco",c:"km0"}]},

   procedimento:"Ammollare i fagioli di Controne 12 ore. Cuocere in acqua non salata per 50-60 min. Soffriggere aglio e rosmarino in olio EVO, aggiungere il pomodoro e i fagioli cotti con parte del loro liquido. Cuocere 10 min. Lavare e tagliare la scarola riccia, sbollentare 3 min, strizzare bene. Aggiungere la scarola alla zuppa, regolare di sale. Tostare il pane di segale in forno. Servire la zuppa sui crostini di segale con abbondante olio EVO a crudo e peperoncino.",

   stagione:"Autunno-inverno (scarola riccia settembre-aprile; fagioli di Controne secchi tutto l'anno)",

  {diabete:"La spigola è pesce magro con pochissimi carboidrati: carico glicemico del pasto ≈ 4, ideale per diabetici. Il betacarotene delle carote migliora la funzione delle cellule beta pancreatiche. Per l'ipertensione: le carote sono ricche di potassio (320 mg/100 g); la cottura al cartoccio senza sale aggiunto riduce l'apporto sodico; il limone di Sorrento IGP può sostituire il sale come esaltatore di sapidità. Per l'aterosclerosi: l'olio EVO DOP apporta acido oleico e polifenoli cardioprotettivi; gli Omega-3 della spigola riducono i trigliceridi e aumentano le HDL.",

   haccp:{fasi:[{nome:"Ricezione spigola fresca",pericolo:"Biologico: Anisakis simplex, Listeria monocytogenes · Chimico: PCB, diossine, metalli pesanti · Fisico: lische, residui di rete",ccp:true,misura:"T ≤ 2°C; verifica organolettica (odore marino, carni compatte); ispezione visiva per Anisakis; certificato sanitario 853/2004"},{nome:"Stoccaggio refrigerato pesce (CCP)",pericolo:"Biologico: moltiplicazione rapida Listeria e Vibrio a T > 4°C · Chimico: produzione istamina · Fisico: contaminazione crociata",ccp:true,misura:"T ≤ 2°C; ripiano basso separato; contenitore chiuso; consumare entro 24h; monitoraggio T ogni 4h"},{nome:"Stoccaggio a T ambiente — dispensa",pericolo:"Biologico: muffe sull'olio in contenitori non chiusi · Chimico: irrancidimento olio EVO esposto a luce · Fisico: contaminazione da polvere",ccp:false,misura:"Olio EVO DOP in luogo fresco e buio; procedura FIFO: etichettare con data apertura, vecchio davanti nuovo dietro; consumare entro 2 mesi dall'apertura"},{nome:"Lavaggio e preparazione carote",pericolo:"Biologico: E. coli, Salmonella da suolo · Chimico: residui pesticidi · Fisico: terriccio, sassolini",ccp:false,misura:"Pelatura completa; lavaggio sotto acqua corrente potabile ≥ 30 sec; tagliere dedicato verdure"},{nome:"Cottura in forno 180°C (18–20 min) (CCP)",pericolo:"Biologico: sopravvivenza Anisakis (resiste fino a 60°C) e Listeria · Fisico: nessuno",ccp:true,misura:"T interna ≥ 63°C per ≥ 15 sec; termometro a sonda obbligatorio; forno pre-riscaldato"},{nome:"Servizio",pericolo:"Biologico: ricontaminazione post-cottura · Fisico: lische residue nel filetto",ccp:false,misura:"Servire immediatamente a T > 65°C; verificare assenza lische; utensili puliti e dedicati"}]}},

  {diabete:"Il riso integrale bio ha IG ≈ 50, più basso del riso bianco. I capperi di Pantelleria contengono quercetina che migliora la sensibilità insulinica. Per l'ipertensione: l'olio EVO Sorrentino DOP riduce la pressione sistolica; attenzione al sodio dei capperi e delle olive — dissalare i capperi accuratamente. Per l'aterosclerosi: l'olio EVO DOP apporta oleocantale con proprietà antinfiammatorie; l'Omega-3 dell'orata riduce i trigliceridi; l'aglio di Nubia IGP abbassa il colesterolo LDL.",
   adattamenti:{vegan:"Sostituire l'orata con 200 g di tofu affumicato o tempeh + 1 cucchiaio di alga nori per il sapore marino.",lattosio:"Il piatto è naturalmente privo di lattosio. Nessuna modifica.",celiaci:"Il piatto è naturalmente senza glutine. Verificare la certificazione GF di tutti i prodotti in scatola.",halal:"L'orata è halal. Verificare che le olive non siano conservate con alcol.",kosher:"L'orata ha pinne e squame — è kosher. Il piatto è parve."},
   haccp:{fasi:[{nome:"Ricezione orata fresca FAO 37",pericolo:"Biologico: Anisakis simplex, Listeria, Vibrio · Chimico: metalli pesanti, PCB · Fisico: squame residue",ccp:true,misura:"T ≤ 2°C; occhi brillanti, branchie rosse, odore marino; certificato FAO 37; consumare entro 24h"},{nome:"Stoccaggio refrigerato pesce e ingredienti (CCP)",pericolo:"Biologico: moltiplicazione Listeria · Chimico: ossidazione Omega-3 · Fisico: contaminazione crociata",ccp:true,misura:"Pesce a T ≤ 2°C separato; altri ingredienti a T ≤ 4°C; monitoraggio T 2 volte/turno"},{nome:"Stoccaggio a T ambiente — dispensa",pericolo:"Biologico: muffe sull'olio in contenitori aperti · Chimico: ossidazione olio EVO · Fisico: contaminazione",ccp:false,misura:"Procedura FIFO: olio EVO DOP in luogo buio e fresco; olive e capperi in contenitori chiusi a T ambiente ≤ 20°C; etichettare con data apertura"},{nome:"Dissalatura capperi di Pantelleria (CCP)",pericolo:"Biologico: Listeria nel sale · Chimico: eccesso sodio residuo · Fisico: residui di sale grosso",ccp:true,misura:"Immersione in acqua fredda ≤ 10°C per 20 min; cambiare acqua 2 volte; assaggiare prima di usare"},{nome:"Cottura orata in padella (CCP)",pericolo:"Biologico: sopravvivenza Anisakis e Listeria · Chimico: ossidazione olio EVO ad alta T",ccp:true,misura:"T interna ≥ 63°C per 1 min; sonda; olio EVO a T ≤ 180°C"},{nome:"Cottura riso integrale e raffreddamento (CCP)",pericolo:"Biologico: Bacillus cereus (spore resistenti alla cottura, germinano nel raffreddamento lento)",ccp:true,misura:"Ebollizione ≥ 100°C; raffreddamento rapido a ≤ 10°C entro 90 min; abbattitore o bagno ghiacciato"}]}},

  {diabete:"Le cicerchie PAT hanno IG < 30 e GL ≈ 5 per porzione. L'orzo aggiunge beta-glucani che formano un gel intestinale rallentando l'assorbimento del glucosio. Per l'ipertensione: i friarielli PAT sono ricchi di potassio e calcio; le noci di Sorrento PAT contengono arginine precursore dell'ossido nitrico vasodilatatore. Per l'aterosclerosi: le noci di Sorrento PAT apportano Omega-3 ALA, vitamina E e fitosteroli che riducono il colesterolo LDL.",
   adattamenti:{vegan:"Il piatto è già completamente vegano.",lattosio:"Il piatto è naturalmente privo di lattosio.",celiaci:"L'orzo contiene glutine. Sostituire con riso integrale (200 g) o quinoa (200 g).",halal:"Il piatto è naturalmente halal.",kosher:"Il piatto è parve e naturalmente kosher. Verificare che l'olio EVO abbia certificazione kosher."},
   haccp:{fasi:[{nome:"Ammollo cicerchie 24h (CCP CRITICO)",pericolo:"Biologico: muffe, aflatossine · Chimico: ODAP (neurotossina) presente nel legume crudo · Fisico: pietre, sassolini",ccp:true,misura:"Ammollo MINIMO 24h in acqua fredda in frigorifero ≤ 4°C; cambiare acqua ogni 8h (almeno 3 volte); eliminare tutta l'acqua di ammollo"},{nome:"Cottura cicerchie ≥ 60 min (CCP)",pericolo:"Biologico: lectine fitoemagglutinine residue · Chimico: ODAP residua se cottura insufficiente",ccp:true,misura:"Ebollizione vigorosa ≥ 100°C per ≥ 60 min in acqua non salata; verificare completa tenerezza al morso"},{nome:"Stoccaggio a T ambiente — dispensa",pericolo:"Biologico: muffe e aflatossine nell'orzo umido · Chimico: ossidazione olio EVO · Fisico: sassolini nelle cicerchie sfuse",ccp:false,misura:"Procedura FIFO: cicerchie secche (contenitore ermetico, T ≤ 20°C); orzo (idem); olio EVO (buio, fresco); etichettare con data apertura; consumare entro 12 mesi per i legumi secchi"},{nome:"Stoccaggio orzo e cicerchie cotte (CCP)",pericolo:"Biologico: Bacillus cereus nelle spore dei cereali e legumi cotti",ccp:true,misura:"Raffreddamento rapido a ≤ 10°C entro 90 min; contenitore chiuso; consumare entro 24h"},{nome:"Assemblaggio ciotola e servizio",pericolo:"Biologico: contaminazione crociata · Chimico: ossidazione noci · Fisico: gusci di noce residui",ccp:false,misura:"Noci aggiunte a crudo all'ultimo; verificare assenza frammenti di guscio; consumare entro 2h"}]}},

  {diabete:"Il risotto con zucchine km0 ha GL ≈ 22; usare riso carnaroli al dente riduce l'IG. Per l'ipertensione: lo speck contiene sodio — non aggiungere sale durante la cottura; le zucchine ricche di potassio bilanciano l'effetto pressorio. Per l'aterosclerosi: la quantità ridotta di speck (25 g/porzione) limita l'esposizione ai grassi saturi e ai nitriti.",
   adattamenti:{vegan:"Omettere lo speck, sostituire il parmigiano con lievito alimentare (2 cucchiai). Aggiungere 50 g di pomodori secchi sott'olio.",lattosio:"Omettere il parmigiano o sostituire con parmigiano stagionato ≥ 24 mesi (naturalmente privo di lattosio).",celiaci:"Il piatto è naturalmente senza glutine. Verificare che lo speck non contenga additivi con glutine.",halal:"Lo speck è prodotto da carne di maiale — NON è halal. Sostituire con bresaola di manzo o pollo affumicato halal.",kosher:"Lo speck è prodotto da maiale — NON è kosher. Sostituire con bresaola di manzo kosher certificata."},
   haccp:{fasi:[{nome:"Ricezione speck Alto Adige IGP",pericolo:"Biologico: Listeria monocytogenes · Chimico: nitriti/nitrati residui, ammine biogene · Fisico: frammenti di osso",ccp:true,misura:"T ≤ 4°C; integrità confezione sigillata; data scadenza"},{nome:"Stoccaggio speck e latticini (CCP)",pericolo:"Biologico: Listeria monocytogenes cresce a 4°C nelle carni affumicate",ccp:true,misura:"T ≤ 4°C; speck in contenitore chiuso; consumare entro 3 giorni dall'apertura"},{nome:"Stoccaggio a T ambiente — dispensa",pericolo:"Biologico: insetti nel riso sfuso · Chimico: ossidazione olio EVO · Fisico: corpi estranei nel riso",ccp:false,misura:"Procedura FIFO: riso carnaroli (contenitore ermetico, T ≤ 20°C); olio EVO (buio, fresco); etichettare con data apertura; riso: consumare entro 12 mesi"},{nome:"Tostatura riso e cottura risotto (CCP)",pericolo:"Biologico: Bacillus cereus nel riso · Fisico: corpi estranei nel riso crudo",ccp:true,misura:"Tostatura 2 min a fuoco vivo; mantenere ebollizione T ≥ 85°C; consumare entro 2h"},{nome:"Aggiunta speck e mantecatura (CCP)",pericolo:"Biologico: ricontaminazione Listeria · Chimico: nitriti a T elevata formano nitrosammine",ccp:true,misura:"Lo speck viene aggiunto a metà cottura (T > 80°C); non surriscaldare (T < 120°C); servire immediatamente"},{nome:"Servizio",pericolo:"Biologico: zona di pericolo termico",ccp:false,misura:"Servire immediatamente a T > 65°C; no riscaldamento multiplo"}]}},

  {diabete:"Il pesce spada ha GL ≈ 1 — eccellente per diabetici. I crostini integrali aggiungono fibre che abbassano il carico glicemico. Per l'ipertensione: il pesce spada è naturalmente a basso sodio; il limone di Sorrento IGP può sostituire completamente il sale. Per l'aterosclerosi: gli Omega-3 DHA ed EPA del pesce spada riducono i trigliceridi e aumentano le HDL.",
   adattamenti:{vegan:"Non è possibile una tartare vegetale equivalente. Alternativa: tartare di avocado con capperi, limone IGP e pomodorini su crostini integrali.",lattosio:"Il piatto è naturalmente privo di lattosio.",celiaci:"Sostituire il pane integrale con pane di riso o mais certificato GF.",halal:"Il pesce spada è halal.",kosher:"Il pesce spada ha pinne e squame — è kosher. Il piatto è parve."},
   haccp:{fasi:[{nome:"Verifica abbattimento pesce spada (CCP ASSOLUTO)",pericolo:"Biologico: Anisakis simplex (letale se ingerito vivo) · Chimico: mercurio (bioaccumulatore — limite UE 1 mg/kg) · Fisico: lisca nel filetto tritato",ccp:true,misura:"OBBLIGATORIO per legge (Reg. CE 853/2004): certificato abbattimento a -18°C per ≥ 24h; documentazione conservata 3 anni"},{nome:"Scongelamento controllato (CCP)",pericolo:"Biologico: moltiplicazione batterica nella zona di pericolo · Chimico: ossidazione lipidi Omega-3",ccp:true,misura:"Scongelare SOLO in frigorifero a ≤ 4°C per max 24h; mai a T ambiente; usare entro 4h"},{nome:"Stoccaggio a T ambiente — dispensa",pericolo:"Biologico: ossidazione olio EVO · Chimico: degradazione senape aperta · Fisico: contaminazione polvere",ccp:false,misura:"Procedura FIFO: olio EVO (buio, fresco, T ≤ 20°C); senape (frigorifero dopo apertura); capperi secchi (contenitore ermetico); pane integrale (contenitore chiuso, consumare entro 3 giorni dall'apertura)"},{nome:"Tritatura al coltello (preparazione tartare) (CCP)",pericolo:"Biologico: contaminazione da superfici e mani · Fisico: frammenti metallici da lama, lische residue",ccp:true,misura:"Tagliere e coltello DEDICATI e sanificati con soluzione ipoclorito 200 ppm; guanti monouso; ispezione visiva per lische"},{nome:"Assemblaggio e servizio immediato (CCP)",pericolo:"Biologico: moltiplicazione rapida su pesce crudo a T ambiente",ccp:true,misura:"Servire ENTRO 10 MINUTI dall'assemblaggio; T piatto ≤ 10°C; non conservare tartare già preparata"}]}},

  {diabete:"I piselli novelli sorrentini hanno IG ≈ 35 e la pasta integrale IG ≈ 42. Il GL del piatto è ≈ 20. Per l'ipertensione: le alici di Cetara vanno dissalate MOLTO accuratamente; le noci di Sorrento PAT apportano arginine che producono ossido nitrico vasodilatatore. Per l'aterosclerosi: gli Omega-3 delle alici di Cetara abbassano i trigliceridi; le noci PAT apportano acido linoleico che aumenta le HDL.",
   adattamenti:{vegan:"Sostituire le alici con 2 cucchiai di pasta di miso + 20 g di capperi dissalati.",lattosio:"Il piatto è naturalmente privo di lattosio.",celiaci:"Sostituire la pasta integrale con pasta di riso integrale o di legumi.",halal:"Le alici sono halal.",kosher:"Le alici hanno pinne e squame — sono kosher. Il piatto è parve."},
   haccp:{fasi:[{nome:"Ricezione e dissalatura alici di Cetara (CCP)",pericolo:"Biologico: Listeria nel sale; istamina (Engraulidae ad alto rischio) · Chimico: sodio in eccesso · Fisico: lische",ccp:true,misura:"Immersione in acqua fredda ≤ 10°C per 30 min; cambiare acqua 2 volte; sfilettare con guanti"},{nome:"Stoccaggio alici e piselli freschi (CCP)",pericolo:"Biologico: Listeria nelle alici; muffe nei piselli freschi · Chimico: istamina nelle alici se T non controllata",ccp:true,misura:"Alici dissalate in contenitore chiuso a ≤ 4°C; piselli in frigorifero; consumare entro 12h"},{nome:"Stoccaggio a T ambiente — dispensa",pericolo:"Biologico: insetti nella pasta integrale · Chimico: irrancidimento del germe di grano in confezioni aperte · Fisico: corpi estranei",ccp:false,misura:"Procedura FIFO: pasta integrale (contenitore ermetico, T ≤ 20°C); consumare entro 3 mesi dall'apertura; noci PAT (contenitore chiuso, consumare entro 1 mese dall'apertura); olio EVO DOP (buio, fresco)"},{nome:"Cottura pasta integrale al dente",pericolo:"Biologico: nessuno significativo · Fisico: corpi estranei nella pasta cruda",ccp:false,misura:"Ispezionare la pasta cruda; acqua a forte ebollizione; colino pulito per scolare"},{nome:"Mantecatura e aggiunta alici fuori fuoco (CCP)",pericolo:"Biologico: istamina nelle alici aumenta se riscaldate oltre 60°C · Fisico: lische residue",ccp:true,misura:"Aggiungere le alici ESCLUSIVAMENTE fuori fuoco (T < 50°C); verificare assenza lische; servire entro 5 min"}]}},

  {diabete:"La seppia è il mollusco con il più basso contenuto calorico (72 kcal/100 g) e GL ≈ 3 — ideale per diabetici. Per l'ipertensione: la seppia è a bassissimo contenuto di sodio naturale; il prezzemolo è ricco di potassio (800 mg/100 g). Per l'aterosclerosi: l'inchiostro di seppia contiene melanina e taurina con proprietà antiossidanti che riducono l'ossidazione delle LDL.",
   adattamenti:{vegan:"Non è possibile replicare la seppia con ingredienti vegani mantenendo la stessa struttura. Alternativa: funghi portobello ripieni con zucchine San Pasquale PAT, pane integrale e noci.",lattosio:"Il piatto è naturalmente privo di lattosio.",celiaci:"Sostituire il pane grattugiato integrale con pane di riso grattugiato GF.",halal:"La seppia è considerata halal dalla maggior parte delle scuole islamiche. Il vino bianco va sostituito con brodo vegetale + aceto bianco.",kosher:"La seppia (cefalopode) NON è kosher. Sostituire con involtini di merluzzo ripieni con le stesse verdure."},
   haccp:{fasi:[{nome:"Ricezione seppie fresche",pericolo:"Biologico: Vibrio parahaemolyticus, Listeria · Chimico: metalli pesanti (cadmio nei cefalopodi) · Fisico: osso di seppia residuo",ccp:true,misura:"T ≤ 2°C; sacca integra, colore bianco-lilla, odore marino fresco; consumare entro 24h"},{nome:"Stoccaggio seppie e uova (CCP)",pericolo:"Biologico: Vibrio (cresce rapidamente sopra 5°C), Salmonella Enteritidis nelle uova",ccp:true,misura:"Seppie a T ≤ 2°C; uova a T ≤ 4°C in contenitore separato; consumare seppie entro 24h"},{nome:"Stoccaggio a T ambiente — dispensa",pericolo:"Biologico: muffe sull'olio EVO aperto · Chimico: ossidazione olio · Fisico: contaminazione da dispensa",ccp:false,misura:"Procedura FIFO: olio EVO (buio, fresco, T ≤ 20°C, entro 2 mesi dall'apertura); pane integrale grattugiato (contenitore chiuso, consumare entro 1 mese); vino bianco (T ≤ 18°C)"},{nome:"Pulizia seppie e preparazione ripieno (CCP)",pericolo:"Biologico: Salmonella da uova crude nel ripieno · Fisico: becco corneo della seppia",ccp:true,misura:"Eliminare completamente il becco; rimuovere l'osso; guanti; il ripieno raggiungerà T ≥ 75°C in cottura"},{nome:"Cottura brasatura 35 min (CCP)",pericolo:"Biologico: sopravvivenza Salmonella (uova nel ripieno) e Vibrio · Fisico: stuzzicadenti non rimossi",ccp:true,misura:"T interna ripieno ≥ 75°C per ≥ 2 min; contare gli stuzzicadenti e rimuoverli TUTTI prima del servizio"}]}},

  {diabete:"Il farro integrale ha IG ≈ 35 e GL ≈ 12 per porzione. Lo sgombro non contiene carboidrati. Per l'ipertensione: lo sgombro al naturale è a basso contenuto di sodio; il condimento a base di limone sostituisce il sale. Per l'aterosclerosi: lo sgombro è il pesce con la più alta concentrazione di Omega-3 (2,2 g/100 g) che abbassano i trigliceridi fino al 30%; il farro integrale apporta lignani che proteggono i vasi arteriosi.",
   adattamenti:{vegan:"Lo sgombro al naturale può essere sostituito con 200 g di tofu affumicato o 3 cucchiai di alga nori sbriciolata + 30 g di semi di chia per gli Omega-3.",lattosio:"Il piatto è naturalmente privo di lattosio.",celiaci:"Il farro contiene glutine. Sostituire con riso integrale (250 g) o quinoa (250 g).",halal:"Lo sgombro è halal.",kosher:"Lo sgombro ha pinne e squame — è kosher. Il piatto è parve."},
   haccp:{fasi:[{nome:"Ammollo farro integrale 8h (CCP)",pericolo:"Biologico: moltiplicazione batterica nell'acqua di ammollo a T ambiente · Chimico: acido fitico (antinutriente) · Fisico: pietre nel farro",ccp:true,misura:"Ammollo in frigorifero a ≤ 4°C; selezionare il farro prima dell'ammollo; non ammollare mai a T ambiente oltre 1h"},{nome:"Ricezione sgombro al naturale (scatola)",pericolo:"Biologico: Clostridium botulinum (lattine danneggiate) · Chimico: istamina (Scombridae) · Fisico: frammenti metallici da lattina",ccp:true,misura:"Rifiutare lattine rigonfie, arrugginite o ammaccate profondamente; verifica data scadenza"},{nome:"Stoccaggio a T ambiente — dispensa",pericolo:"Biologico: Clostridium botulinum in lattine danneggiate; insetti nel farro sfuso · Chimico: ossidazione olio EVO · Fisico: corpi estranei",ccp:false,misura:"Procedura FIFO: farro (contenitore ermetico, T ≤ 20°C, entro 6 mesi dall'apertura); sgombro in lattina integra (T ≤ 25°C, lontano da umidità); olio EVO (buio, fresco, entro 2 mesi dall'apertura)"},{nome:"Cottura farro 45 min (CCP)",pericolo:"Biologico: inattivazione contaminanti · Fisico: corpi estranei non rimossi",ccp:true,misura:"Ebollizione ≥ 100°C per 45 min; scolare; ispezionare visivamente il farro cotto"},{nome:"Assemblaggio e condimento a freddo",pericolo:"Biologico: contaminazione crociata · Fisico: spine residue nello sgombro · Chimico: ossidazione olio EVO se esposto a luce",ccp:false,misura:"Verificare assenza spine nel sgombro; consumare entro 24h in frigorifero"}]}},

  {diabete:"Il riso integrale ha IG ≈ 50. Gamberi, cozze e vongole non contengono carboidrati e non alzano la glicemia. Per l'ipertensione: le cozze sono naturalmente a basso sodio; il prezzemolo abbondante apporta potassio e flavonoidi antipertensivi. Per l'aterosclerosi: i molluschi hanno bassissimo contenuto di colesterolo; il selenio delle cozze attiva la glutatione perossidasi che riduce l'ossidazione delle LDL.",

function renderHaccp(filter){
  currentHaccpFilter=filter;
  const grid=document.getElementById('haccp-grid');
  grid.innerHTML='';
  data.filter(r=>filter==='all'||r.cat===filter).forEach((r,i)=>{
    const ex=extraData[r.id]||{};
    const haccp=ex.haccp||{fasi:[]};
    const adapt=ex.adattamenti||{};
    const diabete=ex.diabete||'';
    const fh=haccp.fasi.map((f,fi)=>{
      const isDispensa=f.nome.toLowerCase().includes('dispensa');
      const badgeHtml=f.ccp?`<span class="haccp-ccp-badge">CCP</span>`:isDispensa?`<span class="haccp-fifo-badge">CP · FIFO</span>`:`<span class="haccp-ok-badge">CP</span>`;
      const boxClass=f.ccp?'is-ccp':isDispensa?'is-dispensa':'';
      return`<div class="haccp-step"><div class="haccp-step-arrow">${fi>0?'<div class="haccp-arrow-line"></div><div class="haccp-arrow-head">▼</div>':'<div style="height:8px"></div>'}</div><div class="haccp-box ${boxClass}"><div class="haccp-box-head"><span class="haccp-step-name">${fi+1}. ${f.nome}</span>${badgeHtml}</div><div class="haccp-box-body"><div class="haccp-field"><label>⚠ Pericolo</label><p>${f.pericolo}</p></div><div class="haccp-field"><label>✓ Misura di controllo</label><p>${f.misura}</p></div></div></div></div>`;
    }).join('');
    const ah=Object.entries(adapt).map(([k,v])=>`<div class="adapt-card adapt-${k}"><span class="adapt-label">${{vegan:'🌱 Vegan',lattosio:'🥛 Intolleranti lattosio',celiaci:'🌾 Celiaci',halal:'☪ Halal',kosher:'✡ Kosher'}[k]||k}</span><p class="adapt-text">${v}</p></div>`).join('');
    const s=document.createElement('div');
    s.className='scheda';
    s.style.animationDelay=`${i*.07}s`;
    s.innerHTML=`<div class="scheda-header"><div class="scheda-num">${r.numero}</div><div class="scheda-title-block"><div class="scheda-title">${r.title}</div>${r.chef?`<div class="scheda-chef">Chef / Autore: ${r.chef}</div>`:''}</div><div class="tags" style="margin:0;flex-shrink:0">${r.tags.map(([l,c])=>`<span class="tag ${c}">${l}</span>`).join('')}</div></div><div class="scheda-body"><div class="scheda-cell diabete full"><div class="scheda-cell-label" style="color:var(--coral)"><span>💊</span> Prevenzione Diabete T2, Ipertensione &amp; Aterosclerosi</div><div class="scheda-cell-content">${diabete}</div></div><div class="scheda-cell full" style="background:#F8F9FA"><div class="scheda-cell-label"><span>🍽</span> Adattamenti dietetici e religiosi</div><div class="adapt-grid">${ah}</div></div><div class="scheda-cell full"><div class="scheda-cell-label" style="color:var(--haccp-head)"><span>🔐</span> Piano HACCP — Diagramma di flusso con CCP</div><div class="haccp-legend"><span><span class="haccp-ccp-badge">CCP</span> Punto Critico di Controllo</span><span><span class="haccp-ok-badge">CP</span> Punto di Controllo</span><span><span class="haccp-fifo-badge">CP · FIFO</span> Dispensa / T ambiente</span></div><div class="haccp-flow" style="margin-top:.8rem">${fh}</div></div></div>`;
    grid.appendChild(s);
  });
}

e-height:1.7;font-weight:300;margin-top:.3rem">${r.antitumorale}</p></div><div><div class="scheda-cell-label"><span>🌿</span> Stagionalità</div><p style="font-size:.88rem;font-style:italic;opacity:.7;margin-top:.2rem">${r.stagione}</p></div></div><div class="macros-row" style="border-top:1px solid var(--sky2)"><div class="macro"><div class="macro-val">${r.macros.kcal}</div><span class="macro-label">kcal</span></div><div class="macro"><div class="macro-val">${r.macros.prot}g</div><span class="macro-label">proteine</span></div><div class="macro"><div class="macro-val">${r.macros.carb}g</div><span class="macro-label">carboidrati</span></div><div class="macro"><div class="macro-val">${r.macros.grassi}g</div><span class="macro-label">grassi</span></div><div class="macro-approx">⚠ valori per porzione stimati da tabelle CREA 2019 · calcolo approssimativo</div></div></div>`;
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow='hidden';
}

function printSchedaById(id){
  const r=data.find(x=>x.id===id);
  if(!r)return;
  const ex=extraData[id]||{};
  const appro=r.approfondimento||{};
  const adapt=ex.adattamenti||{};
  const haccp=(ex.haccp||{fasi:[]});
  const sdgs=sdgData[id]||[];
  const marchioBadge={DOP:'🏆 DOP',IGP:'🌿 IGP','PAT':'📜 PAT','Presidio Slow Food':'🐌 Presidio Slow Food','PAT + Presidio':'📜 PAT + Presidio'}[appro.marchio]||appro.marchio||'';
  const sdgColors={1:'#e5243b',2:'#dda63a',3:'#4c9f38',4:'#c5192d',5:'#ff3a21',6:'#26bde2',7:'#fcc30b',8:'#a21942',9:'#fd6925',10:'#dd1367',11:'#fd9d24',12:'#bf8b2e',13:'#3f7e44',14:'#0a97d9',15:'#56c02b',16:'#00689d',17:'#19486a'};

  const haccpFlow=haccp.fasi.map((f,i)=>{const isD=f.nome.toLowerCase().includes('dispensa');const bc=f.ccp?'border:2px solid #e74c3c':isD?'border:2px dashed #e67e22':'border:1px solid #ccc';const hc=f.ccp?'background:#fdedec':isD?'background:#fef9f0':'background:#f5f5f5';const bt=f.ccp?'background:#e74c3c':isD?'background:#e67e22':'background:#27ae60';const bl=f.ccp?'CCP':isD?'CP · FIFO':'CP';return`${i>0?'<div style="text-align:center;color:#aaa;font-size:9pt;margin:.1cm 0">▼</div>':''}<div style="${bc};border-radius:3px;overflow:hidden;break-inside:avoid;margin-bottom:.2cm"><div style="display:flex;align-items:center;${hc};padding:.2cm .35cm;gap:.3cm"><span style="flex:1;font-size:9pt;font-weight:600">${i+1}. ${f.nome}</span><span style="${bt};color:#fff;font-size:7pt;letter-spacing:.08em;text-transform:uppercase;padding:.1cm .3cm;border-radius:2px;-webkit-print-color-adjust:exact;print-color-adjust:exact">${bl}</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:.2cm .5cm;padding:.25cm .35cm;font-size:8.5pt;font-weight:300;line-height:1.45"><div><span style="font-size:7pt;letter-spacing:.1em;text-transform:uppercase;color:#5D6D7E;display:block;margin-bottom:.1cm">⚠ Pericolo</span><p>${f.pericolo}</p></div><div><span style="font-size:7pt;letter-spacing:.1em;text-transform:uppercase;color:#5D6D7E;display:block;margin-bottom:.1cm">✓ Misura di controllo</span><p>${f.misura}</p></div></div></div>`;}).join('');
  const adaptCards=Object.entries(adapt).map(([k,v])=>`<div style="background:#f8f9fa;border:1px solid #ddd;border-radius:3px;padding:.3cm .4cm;break-inside:avoid"><span style="font-size:7.5pt;letter-spacing:.1em;text-transform:uppercase;font-weight:700;display:block;margin-bottom:.15cm;color:${{vegan:'#27AE60',lattosio:'#8E44AD',celiaci:'#D35400',halal:'#1A5276',kosher:'#7D6608'}[k]||'#333'}">${{vegan:'🌱 Vegan',lattosio:'🥛 Lattosio',celiaci:'🌾 Celiaci',halal:'☪ Halal',kosher:'✡ Kosher'}[k]||k}</span><p style="font-size:8.5pt;font-weight:300;line-height:1.45">${v}</p></div>`).join('');
  const sdgCards=sdgs.map(s=>`<div style="display:flex;gap:.3cm;align-items:flex-start;border:1px solid #dce4f0;border-radius:3px;padding:.3cm .4cm;break-inside:avoid;background:#fff"><div style="flex-shrink:0;width:38px;height:38px;border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11pt;font-weight:800;color:#fff;line-height:1;text-align:center;background:${sdgColors[s.n]||'#333'};-webkit-print-color-adjust:exact;print-color-adjust:exact"><span>${s.n}</span><span style="font-size:5.5pt;font-weight:600;text-transform:uppercase;margin-top:1px">${s.titolo.split(' ').slice(0,2).join(' ')}</span></div><div><strong style="font-size:8.5pt;font-weight:600;display:block;margin-bottom:.1cm;color:#1a3a5c">SDG ${s.n} — ${s.titolo}</strong><p style="font-size:8pt;font-weight:300;line-height:1.45">${s.desc}</p></div></div>`).join('');
  const html=`<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><title>${r.numero}. ${r.title} — Scheda completa</title><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Crimson Pro',serif;font-size:10pt;color:#1a1a1a;background:#fff;padding:1cm}.stripe{height:5px;background:linear-gradient(90deg,#1B4F72,#c9a84c,#4c9f38);margin-bottom:.5cm;border-radius:2px;-webkit-print-color-adjust:exact;print-color-adjust:exact}h1{font-family:'Playfair Display',serif;font-size:18pt;font-weight:400;margin-bottom:.15cm}.sub{font-size:9pt;color:#555;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.4cm}.site{font-size:8pt;color:#888;text-transform:uppercase;letter-spacing:.12em;margin-bottom:.6cm;border-bottom:1px solid #ddd;padding-bottom:.25cm}.part{font-family:'Playfair Display',serif;font-size:13pt;font-weight:400;color:#1B4F72;border-bottom:2px solid #1B4F72;margin:1cm 0 .4cm;padding-bottom:.2cm;page-break-before:always}.part:first-of-type{page-break-before:avoid;margin-top:.3cm}.g2{display:grid;grid-template-columns:1fr 1fr;gap:.35cm}.full{grid-column:1/-1}.macros{display:grid;grid-template-columns:repeat(4,1fr);background:#f0f4f8;border-radius:3px;text-align:center;padding:.3cm;margin-bottom:.35cm;-webkit-print-color-adjust:exact;print-color-adjust:exact}.macro-val{font-family:'Playfair Display',serif;font-size:14pt;font-weight:700;color:#1B4F72}.macro-lbl{font-size:7pt;letter-spacing:.07em;text-transform:uppercase;opacity:.55;margin-top:2px}.macro-note{grid-column:1/-1;font-size:7pt;font-style:italic;opacity:.45;text-align:center;margin-top:.15cm}.chips{display:flex;flex-wrap:wrap;gap:.2cm;margin-top:.2cm}.chip{font-size:8pt;padding:.1cm .35cm;border-radius:2px;background:#EBF5FB;color:#1B4F72}.chip.dop{background:#fdf6e3;color:#7a5c10}.chip.igp{background:#ebf5fb;color:#1a5276}.chip.km0{background:#eafaf1;color:#1d6a39}.chip.pat{background:#e8f5e9;color:#2d5a1b}.allerg{background:#FDEBD0;border-radius:3px;padding:.3cm .45cm;color:#784212;font-weight:400;-webkit-print-color-adjust:exact;print-color-adjust:exact}.appro{background:#fdf6e3;border-left:3px solid #c9a84c;border-radius:3px;padding:.35cm .45cm;-webkit-print-color-adjust:exact;print-color-adjust:exact}.appro-t{font-family:'Playfair Display',serif;font-size:10pt;color:#7a5c10;margin:.1cm 0 .2cm}.ag{display:grid;grid-template-columns:1fr 1fr;gap:.3cm}.sdg-g{display:grid;grid-template-columns:1fr 1fr;gap:.3cm}@page{margin:1.2cm 1cm;size:A4}@media print{body{padding:0}}</style></head><body><div class="stripe"></div><div class="site">Piatti Salutari Campani · Cucina Mediterranea · Classe II · DOP · IGP · PAT · km0</div><h1>${r.numero}. ${r.title}</h1><div class="sub">${r.catLabel}${r.chef?' · Chef / Autore: '+r.chef:''} · ${r.porzioni}</div><div class="part" style="page-break-before:avoid">🃏 Scheda Ricetta</div><div class="g2"><div class="full"><div style="font-size:7.5pt;letter-spacing:.12em;text-transform:uppercase;color:#1B4F72;font-weight:600;margin-bottom:.2cm">🛒 Ingredienti</div><div class="chips">${r.ingChips.map(c=>`<span class="chip ${c.c}">${c.t}</span>`).join('')}</div><p style="font-size:8.5pt;opacity:.65;margin-top:.2cm;line-height:1.5">${r.ingredients.join(' · ')}</p></div><div class="allerg full"><div style="font-size:7.5pt;letter-spacing:.12em;text-transform:uppercase;font-weight:600;margin-bottom:.15cm">⚠️ Allergeni</div><p style="font-size:9pt">${r.allergeni}</p></div><div style="background:#f8f9fa;border-left:3px solid #aaa;border-radius:3px;padding:.35cm .45cm"><div style="font-size:7.5pt;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:#555;margin-bottom:.15cm">🌿 Stagionalità</div><p style="font-size:9pt;font-style:italic">${r.stagione}</p></div><div class="full" style="border-left:3px solid #1B4F72;background:#fff;border-radius:3px;padding:.35cm .45cm"><div style="font-size:7.5pt;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:#1B4F72;margin-bottom:.18cm">👨‍🍳 Procedimento</div><p style="font-size:9.5pt;line-height:1.55;font-weight:300">${r.procedimento}</p></div>${appro.nome?`<div class="appro full"><div style="font-size:7.5pt;letter-spacing:.12em;text-transform:uppercase;color:#7a5c10;font-weight:600;margin-bottom:.1cm">🏅 Eccellenza territoriale — ${marchioBadge}</div><div class="appro-t">${appro.nome}</div><p style="font-size:9pt;font-weight:300;line-height:1.55;color:#5a4010">${appro.descrizione}</p></div>`:''}</div><div class="part">🩺 Analisi Nutrizionale</div><div class="macros"><div><div class="macro-val">${r.macros.kcal}</div><div class="macro-lbl">kcal</div></div><div><div class="macro-val">${r.macros.prot}g</div><div class="macro-lbl">proteine</div></div><div><div class="macro-val">${r.macros.carb}g</div><div class="macro-lbl">carboidrati</div></div><div><div class="macro-val">${r.macros.grassi}g</div><div class="macro-lbl">grassi</div></div><div class="macro-note">⚠ valori per porzione stimati da tabelle CREA 2019 · calcolo approssimativo</div></div><div class="g2">${sec('🩺','Motivazione nutrizionale',r.motivazione,'#EAFAF1','#1D6A39')}${sec('🍳','Tecniche di cottura',r.cottura,'#FBF7F0','#5D4037')}${sec('🔬','Prevenzione oncologica',r.antitumorale,'#F5EEF8','#6C3483')}${sec('💊','Prevenzione Diabete T2, Ipertensione &amp; Aterosclerosi',ex.diabete||'','#FDEDEC','#C0392B')}<div class="full" style="margin-top:.2cm"><div style="font-size:7.5pt;letter-spacing:.12em;text-transform:uppercase;color:#1B4F72;font-weight:600;margin-bottom:.25cm">🍽 Adattamenti per esigenze dietetiche e religiose</div><div class="ag">${adaptCards}</div></div><div class="full" style="margin-top:.35cm"><div style="font-size:7.5pt;letter-spacing:.12em;text-transform:uppercase;color:#1a3a5c;font-weight:600;margin-bottom:.25cm">🌍 Agenda 2030 — Sustainable Development Goals</div><div class="sdg-g">${sdgCards}</div></div></div><div class="part">🔐 Piano HACCP</div><div style="display:flex;gap:.8cm;font-size:8pt;margin-bottom:.4cm;align-items:center"><span style="background:#e74c3c;color:#fff;font-size:7pt;padding:.1cm .3cm;border-radius:2px;-webkit-print-color-adjust:exact;print-color-adjust:exact">CCP</span> Punto Critico di Controllo&nbsp;&nbsp;<span style="background:#27ae60;color:#fff;font-size:7pt;padding:.1cm .3cm;border-radius:2px;-webkit-print-color-adjust:exact;print-color-adjust:exact">CP</span> Punto di Controllo&nbsp;&nbsp;<span style="background:#e67e22;color:#fff;font-size:7pt;padding:.1cm .3cm;border-radius:2px;-webkit-print-color-adjust:exact;print-color-adjust:exact">CP · FIFO</span> Dispensa / T ambiente</div>${haccpFlow}<script>window.onload=()=>{window.print();window.onafterprint=()=>window.close();}<\/script></body></html>`;
  const w=window.open('','_blank','width=900,height=700');

  w.document.close();
}
